  // =========================================================================
  // CHANGE 2: PENDING STORES -> GROUPED CLUSTER WISE
  // =========================================================================
  function findPendingCardElementsV1623() {
    var divs = document.querySelectorAll('div, section');
    for (var i = 0; i < divs.length; i++) {
      var box = divs[i];
      if (box.classList.contains('krito-pending-cluster-wrap-v1623')) continue;
      if (box.children.length < 2 || box.children.length > 4) continue;
      if (box.querySelector('table')) continue;
      var head = box.firstElementChild;
      if (!head) continue;
      var hTxt = (head.textContent || '').toUpperCase();
      if (hTxt.includes('PENDING STORES')) {
        return { card: box, head: head, listBox: box.children[1] };
      }
    }
    return null;
  }

  function applyPendingStoresClusterWiseV1623() {
    var found = findPendingCardElementsV1623();
    if (!found || !found.listBox) return;
    if (found.listBox.classList.contains('krito-pending-cluster-wrap-v1623')) return;

    var mData = getActiveMonthDataV1623();
    var pendingArr = (mData && Array.isArray(mData.pending)) ? mData.pending : [];

    // Fallback: parse from existing DOM chips if payload pending array isn't accessible
    if (pendingArr.length === 0) {
      var pills = found.listBox.children;
      for (var p = 0; p < pills.length; p++) {
        var raw = (pills[p].getAttribute('title') || pills[p].textContent || '').replace(/^[•\s]+/, '').trim();
        if (!raw) continue;
        var m = raw.match(/\(([^()]+)\)\s*$/);
        var mgr = m ? m[1].trim() : 'Unassigned';
        var pName = m ? raw.slice(0, m.index).trim() : raw;
        pendingArr.push({ party: pName, manager: mgr });
      }
    }

    if (pendingArr.length === 0) return;

    // Group by Cluster (uses cluster / subCluster if present, otherwise manager)
    var clustersMap = {};
    for (var i = 0; i < pendingArr.length; i++) {
      var item = pendingArr[i];
      if (!item) continue;
      var cName = String(item.cluster || item.subCluster || item.manager || 'Unassigned').trim() || 'Unassigned';
      var cKey = cName.toUpperCase();
      if (!clustersMap[cKey]) clustersMap[cKey] = { label: cName.toUpperCase(), stores: [] };
      clustersMap[cKey].stores.push(String(item.party || '').trim());
    }

    var clusterKeys = Object.keys(clustersMap).sort(function(a, b) {
      if (a === 'UNASSIGNED') return 1;
      if (b === 'UNASSIGNED') return -1;
      return a.localeCompare(b);
    });

    var wrap = document.createElement('div');
    wrap.className = 'krito-pending-cluster-wrap-v1623';

    for (var ci = 0; ci < clusterKeys.length; ci++) {
      var grp = clustersMap[clusterKeys[ci]];
      grp.stores.sort(function(a, b) { return a.localeCompare(b); });

      var cCard = document.createElement('div');
      cCard.className = 'krito-pending-cluster-card-v1623';

      var cHead = document.createElement('div');
      cHead.className = 'krito-pending-cluster-head-v1623';

      var cTitle = document.createElement('span');
      cTitle.className = 'krito-pending-cluster-title-v1623';
      cTitle.textContent = '📍 CLUSTER: ' + grp.label;

      var cCnt = document.createElement('span');
      cCnt.className = 'krito-pending-cluster-count-v1623';
      cCnt.textContent = grp.stores.length + ' Pending';

      cHead.appendChild(cTitle);
      cHead.appendChild(cCnt);

      var cGrid = document.createElement('div');
      cGrid.className = 'krito-pending-cluster-grid-v1623';

      for (var si = 0; si < grp.stores.length; si++) {
        var pill = document.createElement('div');
        pill.className = 'krito-pending-store-pill-v1623';
        pill.title = grp.stores[si] + ' (' + grp.label + ')';
        pill.textContent = '• ' + grp.stores[si];
        cGrid.appendChild(pill);
      }

      cCard.appendChild(cHead);
      cCard.appendChild(cGrid);
      wrap.appendChild(cCard);
    }

    found.listBox.replaceWith(wrap);
  }

  // =========================================================================
  // CHANGE 3: HEADER QTY BREAKDOWN -> VERTICAL COLUMNS (MIN 7 PER BLOCK,
  //           AUTO-ADJUSTS COLUMNS & FONTS ON SCREEN, ZERO FONT CUT-OFF)
  // =========================================================================
  function scaleVerticalHeaderGridFontsV1623(gridEl, colCount) {
    if (!gridEl) return;
    var w = gridEl.clientWidth || window.innerWidth || 1280;
    var gap = (colCount >= 9) ? 4 : 6;
    var colPx = Math.floor((w - (colCount - 1) * gap) / colCount);

    var hdrFont = '11px', chipFont = '10.5px', badgeFont = '9.5px', btnFont = '9.5px', pad = '4px 5px', plus = '17px', chk = '13px';
    if (colPx < 130) {
      hdrFont = '9px'; chipFont = '8.5px'; badgeFont = '8px'; btnFont = '8px'; pad = '2.5px 3px'; plus = '14px'; chk = '11px';
    } else if (colPx < 165) {
      hdrFont = '10px'; chipFont = '9.5px'; badgeFont = '8.5px'; btnFont = '8.5px'; pad = '3px 4px'; plus = '15px'; chk = '12px';
    } else if (colPx < 195) {
      hdrFont = '10.5px'; chipFont = '10px'; badgeFont = '9px'; btnFont = '9px'; pad = '3.5px 5px'; plus = '16px'; chk = '12.5px';
    }

    gridEl.style.setProperty('--vcol-gap', gap + 'px');
    gridEl.style.setProperty('--vcol-hdr-font', hdrFont);
    gridEl.style.setProperty('--vcol-chip-font', chipFont);
    gridEl.style.setProperty('--vcol-badge-font', badgeFont);
    gridEl.style.setProperty('--vcol-btn-font', btnFont);
    gridEl.style.setProperty('--vcol-pad', pad);
    gridEl.style.setProperty('--vcol-plus', plus);
    gridEl.style.setProperty('--vcol-chk', chk);
  }

  function applyVerticalHeaderBreakdownV1623() {
    var attrBar = document.querySelector('.attr-bar');
    if (!attrBar) return;

    // Locate each selected header's panel box via its "Tick All" button
    var panels = [];
    var seen = new Set();
    var btns = attrBar.querySelectorAll('button');

    for (var i = 0; i < btns.length; i++) {
      if (!(btns[i].textContent || '').includes('Tick All')) continue;
      var node = btns[i];
      while (node && node.parentElement && node.parentElement !== attrBar) {
        var p = node.parentElement;
        if (p.classList && p.classList.contains('krito-attr-vgrid-v1623')) break;
        var pBtns = p.querySelectorAll('button');
        var tickCnt = 0;
        for (var t = 0; t < pBtns.length; t++) {
          if ((pBtns[t].textContent || '').includes('Tick All')) tickCnt++;
        }
        if (tickCnt > 1) break;
        node = p;
      }
      if (node && node !== attrBar && !seen.has(node)) {
        if (node.children.length === 1 && node.firstElementChild && node.firstElementChild.querySelector('.attr-chip')) {
          node = node.firstElementChild;
        }
        if (!seen.has(node)) {
          seen.add(node);
          panels.push(node);
        }
      }
    }

    if (panels.length === 0) return;

    var gridEl = attrBar.querySelector('.krito-attr-vgrid-v1623');
    if (!gridEl) {
      gridEl = document.createElement('div');
      gridEl.className = 'krito-attr-vgrid-v1623';
      panels[0].parentElement.insertBefore(gridEl, panels[0]);
    }

    // Minimum 7 columns side-by-side in one block; auto-adjusts cleanly if > 7 headers are selected!
    var colCount = Math.max(7, panels.length);
    gridEl.style.setProperty('grid-template-columns', 'repeat(' + colCount + ', minmax(0, 1fr))', 'important');

    for (var pi = 0; pi < panels.length; pi++) {
      var panel = panels[pi];
      panel.classList.add('krito-attr-vcol-v1623');

      var kids = Array.from(panel.children);
      for (var ki = 0; ki < kids.length; ki++) {
        var kid = kids[ki];
        if (kid.querySelector('.attr-chip') && !kid.querySelector('input[type="text"]') && !kid.querySelector('button[onclick*="setAllAttrSubVals"]')) {
          kid.classList.add('krito-attr-vcol-list-v1623');
        } else if (kid.querySelector('button') || kid.querySelector('input')) {
          kid.classList.add('krito-attr-vcol-head-v1623');
        }
      }

      if (panel.parentElement !== gridEl) {
        gridEl.appendChild(panel);
      }
    }

    scaleVerticalHeaderGridFontsV1623(gridEl, colCount);
  }

  function applyAllThreeChangesV1623() {
    applyStoreTableTwoColumnsV1623();
    applyPendingStoresClusterWiseV1623();
    applyVerticalHeaderBreakdownV1623();
  }

  window.addEventListener('resize', function() {
    var gridEl = document.querySelector('.krito-attr-vgrid-v1623');
    if (gridEl) {
      var cnt = Math.max(7, gridEl.children.length);
      scaleVerticalHeaderGridFontsV1623(gridEl, cnt);
    }
  });

  if (typeof window.updateStoreTableBodyOnly === 'function' && !window.updateStoreTableBodyOnly._v1623) {
    var _origUpdateStoreV1623 = window.updateStoreTableBodyOnly;
    window.updateStoreTableBodyOnly = function() {
      var res = _origUpdateStoreV1623.apply(this, arguments);
      applyStoreTableTwoColumnsV1623();
      return res;
    };
    window.updateStoreTableBodyOnly._v1623 = true;
  }

  if (typeof window.renderApp === 'function' && !window.renderApp._v1623) {
    var _origRenderAppV1623 = window.renderApp;
    window.renderApp = function() {
      var res = _origRenderAppV1623.apply(this, arguments);
      applyAllThreeChangesV1623();
      return res;
    };
    window.renderApp._v1623 = true;
  }

  if (typeof LIVE_PAYLOAD !== 'undefined' && LIVE_PAYLOAD) {
    applyAllThreeChangesV1623();
  }

})();

  function findHeaderPanelsV1624(attrBar) {

    for (var i = 0; i < btns.length; i++) {
      if (!(btns[i].textContent || '').includes('Tick All')) continue;
      var node = btns[i];
      while (node && node.parentElement && node.parentElement !== attrBar) {
        var p = node.parentElement;
        var pBtns = p.querySelectorAll('button');
        var tc = 0;
        for (var t = 0; t < pBtns.length; t++) {

      if (node && node !== attrBar && !seen.has(node)) {
        if (node.children.length === 1 && node.firstElementChild && node.firstElementChild.querySelector('.attr-chip')) {
          node = node.firstElementChild;

    if (panels.length === 0) return;

    if (HEADER_LAYOUT_MODE === 'HORIZONTAL') {

      gridEl.style.setProperty('grid-template-columns', 'repeat(' + colCount + ', minmax(0, 1fr))', 'important');
      for (var pi = 0; pi < panels.length; pi++) {
        var pEl = panels[pi];
        pEl.classList.add('krito-attr-vcol-v1623');
        var pKids = Array.from(pEl.children);
        for (var ki = 0; ki < pKids.length; ki++) {

  // =========================================================================

  function getQtyAndValColIndicesV1624(theadRow) {
    var qtyIdx = -1, valIdx = -1;
    if (!theadRow) return { qtyIdx: -1, valIdx: -1 };
    var ths = theadRow.children;
    for (var i = 0; i < ths.length; i++) {

      if (qtyIdx === -1 && raw === 'QTY') {
        qtyIdx = i;
        if (i + 1 < ths.length) {
          var nxt = (ths[i + 1].getAttribute('data-orig-title-v1624') || ths[i + 1].textContent || '').toUpperCase();
          if (!nxt.startsWith('LY ')) valIdx = i + 1;
        }
        break;
      }
    }
    if (valIdx === -1) {
      for (var j = 0; j < ths.length; j++) {
        var t = (ths[j].getAttribute('data-orig-title-v1624') || ths[j].textContent || '').toUpperCase();
        if (!t.startsWith('LY ') && (t.includes('NET VALUE') || t.includes('VALUE') || t.includes('COLLECTION') || t.includes('TARGET'))) {
          valIdx = j;
          break;
        }
      }
    }
    return { qtyIdx: qtyIdx, valIdx: valIdx };

  function applyRankColumnsAndValueSortV1624() {
    var tbody = document.getElementById('liveStoreTbody');
    if (!tbody) return;
    var table = tbody.closest('table');
    if (!table) return;
    var theadRow = table.querySelector('thead tr');
    if (!theadRow || theadRow.children.length < 2) return;

    // 1. Add "Val Rank" and "Qty Rank" headers right after "#" (once)
    var hadRankHeaders = !!theadRow.querySelector('.krito-th-valrank-v1624');
    if (!hadRankHeaders) {
      var hashTh = theadRow.children[0];
      var thValRank = document.createElement('th');
      thValRank.className = 'krito-th-rank-v1624 krito-th-valrank-v1624';
      thValRank.textContent = 'Val Rank';
      thValRank.setAttribute('data-orig-title-v1624', 'Val Rank');

      var thQtyRank = document.createElement('th');
      thQtyRank.className = 'krito-th-rank-v1624 krito-th-qtyrank-v1624';
      thQtyRank.textContent = 'Qty Rank';
      thQtyRank.setAttribute('data-orig-title-v1624', 'Qty Rank');

      hashTh.insertAdjacentElement('afterend', thQtyRank);
      hashTh.insertAdjacentElement('afterend', thValRank);
    }

    var cols = getQtyAndValColIndicesV1624(theadRow);

    // 2. Collect rows (grouping any expand-drawer-row with its parent row)
    var rawRows = Array.from(tbody.children);
    var dataItems = [];
    var totalRows = [];

    for (var i = 0; i < rawRows.length; i++) {
      var tr = rawRows[i];
      if (!tr || tr.tagName !== 'TR') continue;

      if (tr.classList.contains('expand-drawer-row')) {
        if (dataItems.length > 0) dataItems[dataItems.length - 1].drawers.push(tr);
        continue;
      }
      if (tr.classList.contains('total-row')) {
        totalRows.push(tr);
        continue;
      }

      var alreadyHasRankCells = !!tr.querySelector('.krito-td-valrank-v1624');
      var idxShift = alreadyHasRankCells ? 0 : 2;
      var qCellIdx = (cols.qtyIdx >= 0) ? (cols.qtyIdx - idxShift) : -1;
      var vCellIdx = (cols.valIdx >= 0) ? (cols.valIdx - idxShift) : -1;

      var qtyNum = (qCellIdx >= 0 && tr.children[qCellIdx]) ? parseTableNumV1624(tr.children[qCellIdx].textContent) : 0;
      var valNum = (vCellIdx >= 0 && tr.children[vCellIdx]) ? parseTableNumV1624(tr.children[vCellIdx].textContent) : 0;

      var bEl = tr.querySelector('td b');
      var partyUp = bEl ? String(bEl.textContent || '').trim().toUpperCase() : ('ROW_' + i);

      dataItems.push({ tr: tr, drawers: [], partyUp: partyUp, qtyNum: qtyNum, valNum: valNum, hasRankCells: alreadyHasRankCells });
    }

    // 3. Sort rows by Highest Value first (tie-breaker: Highest Qty)
    dataItems.sort(function(a, b) {
      return (b.valNum - a.valNum) || (b.qtyNum - a.qtyNum);
    });

    // 4. Compute Excel RANK.EQ for Value and Qty
    var searchEl = document.getElementById('liveStoreSearch');
    var isSearching = !!(searchEl && searchEl.value && searchEl.value.trim().length > 0);
    var ctxKey = getActiveContextKeyV1624();

    var rankLookup = {};
    if (!isSearching || !FULL_RANKS_CACHE[ctxKey]) {
      var byVal = dataItems.slice().sort(function(a, b) { return b.valNum - a.valNum; });
      var valRankMap = {};
      for (var vi = 0; vi < byVal.length; vi++) {
        var vRank = (vi > 0 && byVal[vi].valNum === byVal[vi - 1].valNum) ? valRankMap[byVal[vi - 1].partyUp] : (vi + 1);
        valRankMap[byVal[vi].partyUp] = vRank;
      }

      var byQty = dataItems.slice().sort(function(a, b) { return b.qtyNum - a.qtyNum; });
      var qtyRankMap = {};
      for (var qi = 0; qi < byQty.length; qi++) {
        var qRank = (qi > 0 && byQty[qi].qtyNum === byQty[qi - 1].qtyNum) ? qtyRankMap[byQty[qi - 1].partyUp] : (qi + 1);
        qtyRankMap[byQty[qi].partyUp] = qRank;
      }

      for (var ri = 0; ri < dataItems.length; ri++) {
        var it = dataItems[ri];
        rankLookup[it.partyUp] = {
          valRank: (cols.valIdx >= 0) ? (valRankMap[it.partyUp] || 0) : 0,
          qtyRank: (cols.qtyIdx >= 0) ? (qtyRankMap[it.partyUp] || 0) : 0
        };
      }
      if (!isSearching && dataItems.length > 0) {
        FULL_RANKS_CACHE[ctxKey] = rankLookup;
      }
    } else {
      rankLookup = FULL_RANKS_CACHE[ctxKey];
    }

    // 5. Re-append sorted rows & populate Val Rank / Qty Rank cells + serial #
    var frag = document.createDocumentFragment();
    for (var d = 0; d < dataItems.length; d++) {
      var item = dataItems[d];
      var tr = item.tr;
      var rInfo = rankLookup[item.partyUp] || { valRank: d + 1, qtyRank: d + 1 };

      var numTd = tr.children[0];
      if (numTd) {
        numTd.setAttribute('data-row-idx-v1624', String(d));
        numTd.innerHTML = '<span>' + (d + 1) + '</span>' +
          '<button type="button" class="krito-freeze-row-btn-v1624' + (FROZEN_ROW_IDX === d ? ' is-frozen' : '') + '" data-freeze-row-v1624="' + d + '" title="Freeze top rows up to Row ' + (d + 1) + ' (Excel Freeze Panes)">❄️</button>';
      }

      if (!item.hasRankCells) {
        var tdValR = document.createElement('td');
        tdValR.className = 'krito-td-rank-v1624 krito-td-valrank-v1624';
        tdValR.innerHTML = makeRankBadgeHtmlV1624(rInfo.valRank, 'VAL');

        var tdQtyR = document.createElement('td');
        tdQtyR.className = 'krito-td-rank-v1624 krito-td-qtyrank-v1624';
        tdQtyR.innerHTML = makeRankBadgeHtmlV1624(rInfo.qtyRank, 'QTY');

        tr.children[0].insertAdjacentElement('afterend', tdQtyR);
        tr.children[0].insertAdjacentElement('afterend', tdValR);
      } else {
        var vrTd = tr.querySelector('.krito-td-valrank-v1624');
        var qrTd = tr.querySelector('.krito-td-qtyrank-v1624');
        if (vrTd) vrTd.innerHTML = makeRankBadgeHtmlV1624(rInfo.valRank, 'VAL');
        if (qrTd) qrTd.innerHTML = makeRankBadgeHtmlV1624(rInfo.qtyRank, 'QTY');
      }

      frag.appendChild(tr);
      for (var dr = 0; dr < item.drawers.length; dr++) {
        frag.appendChild(item.drawers[dr]);
      }
    }

    for (var ti = 0; ti < totalRows.length; ti++) {
      var tRow = totalRows[ti];
      if (!tRow.querySelector('.krito-td-valrank-v1624') && tRow.children.length >= 1) {
        var tVR = document.createElement('td');
        tVR.className = 'krito-td-rank-v1624 krito-td-valrank-v1624';
        tVR.textContent = '-';
        var tQR = document.createElement('td');
        tQR.className = 'krito-td-rank-v1624 krito-td-qtyrank-v1624';
        tQR.textContent = '-';
        tRow.children[0].insertAdjacentElement('afterend', tQR);
        tRow.children[0].insertAdjacentElement('afterend', tVR);
      }
      frag.appendChild(tRow);
    }

    tbody.appendChild(frag);
    patchExpandDrawerColspanV1624(tbody);

    if (storeDrawerObsV1624) {
      try { storeDrawerObsV1624.disconnect(); } catch (e) {}
    }
    if (typeof MutationObserver === 'function') {
      storeDrawerObsV1624 = new MutationObserver(function() {
        patchExpandDrawerColspanV1624(document.getElementById('liveStoreTbody'));
      });
      storeDrawerObsV1624.observe(tbody, { childList: true });
    }
  }

  // =========================================================================

  function mountFreezeButtonsOnHeadersV1624(table) {
    var theadRow = table.querySelector('thead tr');
    if (!theadRow) return;
    var ths = theadRow.children;

    for (var i = 0; i < ths.length; i++) {

      } else {

  function applyExcelFreezePanesV1624() {
    var tbody = document.getElementById('liveStoreTbody');
    if (!tbody) return;
    var table = tbody.closest('table');
    if (!table) return;

    mountFreezeButtonsOnHeadersV1624(table);

    var thead = table.querySelector('thead');
    var theadRow = thead ? thead.querySelector('tr') : null;
    if (!theadRow) return;

    var ths = Array.from(theadRow.children);
    var allBodyRows = Array.from(tbody.children);
    var dataRows = allBodyRows.filter(function(r) {
      return r.tagName === 'TR' && !r.classList.contains('expand-drawer-row') && !r.classList.contains('total-row');
    });

    if (FROZEN_COL_IDX >= ths.length) FROZEN_COL_IDX = ths.length - 1;
    var effectiveRowFreeze = Math.min(FROZEN_ROW_IDX, dataRows.length - 1);

    // 1. Reset previous freeze styles cleanly
    var hasAnyFreeze = (FROZEN_COL_IDX >= 0 || effectiveRowFreeze >= 0);
    table.classList.toggle('krito-has-freeze-v1624', hasAnyFreeze);

    for (var c = 0; c < ths.length; c++) {
      ths[c].classList.remove('krito-frozen-col-cell-v1624', 'krito-frozen-col-edge-v1624');
      ths[c].style.left = '';
      ths[c].style.zIndex = '40';
      ths[c].style.top = '0px';
      ths[c].style.position = 'sticky';
    }
    for (var r = 0; r < allBodyRows.length; r++) {

    }
    var d = String(iso || '').match(/^\d{4}-(\d{2}-\d{2})$/);

    ];
    if (ctx.compareOn) {
      headCells.push(
        { key: 'LY Qty', title: 'LY Qty' + lyLabel, cls: 'ly-th' },
        { key: 'Qty Growth %', title: 'Qty Growth %', cls: 'ly-th' },
        { key: 'LY Value', title: 'LY ' + (dtMeta.valTitle || 'Net Value'), cls: 'ly-th' },
        { key: 'Val Growth %', title: 'Val Growth %', cls: 'ly-th' }
      );
    }
    if (showMrp) {
      headCells.push(

        { key: 'Dis %', title: 'Dis %', cls: 'num' }

    }

    var theadHtml = '<tr>' + headCells.map(function(hc, idx) {

      var btnTxt = hc.primaryFreeze ? (isFrz ? '❄️ Frozen' : '❄️ Freeze') : '❄️';
      return '<th class="' + (hc.cls || '') + '" data-col-key-v1626="' + escV1626(hc.key) + '" data-orig-title-v1626="' + escV1626(hc.title) + '">' +
        escV1626(hc.title) +

      '</th>';
    }).join('') + '</tr>';

    var bodyHtml = visible.map(function(it, idx) {
      var vRank = valRankMap[it.iso] || (idx + 1);
      var qRank = qtyRankMap[it.iso] || (idx + 1);
      var isoEsc = escV1626(it.iso);
      var lblEsc = escV1626(it.label);

      return '<tr>' +
        '<td><span>' + (idx + 1) + '</span><button type="button" class="krito-freeze-row-btn-v1624' + (DATE_FROZEN_ROW === idx ? ' is-frozen' : '') + '" data-date-freeze-row-v1626="' + idx + '" title="Freeze top rows up to Row ' + (idx + 1) + '">❄️</button></td>' +
        '<td class="krito-td-rank-v1624">' + makeRankPillV1626(vRank, 'VAL') + '</td>' +
        '<td class="krito-td-rank-v1624">' + makeRankPillV1626(qRank, 'QTY') + '</td>' +
        '<td><b>' + lblEsc + '</b></td>' +
        '<td style="text-align:center;"><button type="button" class="krito-date-plus-btn-v1626 krito-date-plus-party-v1626" data-open-date-modal-v1626="PARTY" data-iso="' + isoEsc + '" data-lbl="' + lblEsc + '" title="View Party-Wise Sale for ' + lblEsc + ' (Full Screen)"><span class="krito-date-plus-ico-v1626">+</span><span>' + it.partyCount + ' ' + (it.partyCount === 1 ? 'Party' : 'Parties') + '</span></button></td>' +
        '<td style="text-align:center;"><button type="button" class="krito-date-plus-btn-v1626 krito-date-plus-cluster-v1626" data-open-date-modal-v1626="CLUSTER" data-iso="' + isoEsc + '" data-lbl="' + lblEsc + '" title="View Cluster-Wise Sale for ' + lblEsc + ' (Full Screen)"><span class="krito-date-plus-ico-v1626">+</span><span>' + it.clusterCount + ' ' + (it.clusterCount === 1 ? 'Cluster' : 'Clusters') + '</span></button></td>' +
        '<td class="num"><b>' + fmtNum(it.qty) + '</b></td>' +
        '<td class="num" style="color:#0284c7;"><b>' + fmtINR(it.net) + '</b></td>' +
        (ctx.compareOn
          ? '<td class="ly-td">' + fmtNum(it.lyQty) + '</td><td class="num">' + calcGrowthBadgeHtml(it.qty, it.lyQty) + '</td><td class="ly-td">' + fmtINR(it.lyNet) + '</td><td class="num">' + calcGrowthBadgeHtml(it.net, it.lyNet) + '</td>'

          : '') +

        '<thead>' + theadHtml + '</thead>' +

    if (!DATE_USER_UNFROZE && DATE_FROZEN_COL < 0) DATE_FROZEN_COL = 3;

    applyHiddenColumnsToTableV1626(document.getElementById('kritoDateReportTableV1626'), 'DATE');

  function applyDateTableFreezePanesV1626() {
    var table = document.getElementById('kritoDateReportTableV1626');
    if (!table) return;
    var thead = table.querySelector('thead');
    var theadRow = thead ? thead.querySelector('tr') : null;
    var tbody = table.querySelector('tbody');
    if (!theadRow || !tbody) return;

    var ths = Array.from(theadRow.children);
    var allBodyRows = Array.from(tbody.children);
    var dataRows = allBodyRows.filter(function(r) { return r.tagName === 'TR' && !r.classList.contains('total-row'); });

    if (DATE_FROZEN_COL >= ths.length) DATE_FROZEN_COL = ths.length - 1;
    var effRow = Math.min(DATE_FROZEN_ROW, dataRows.length - 1);

    for (var c = 0; c < ths.length; c++) {
      ths[c].classList.remove('krito-frozen-col-cell-v1624', 'krito-frozen-col-edge-v1624');
      ths[c].style.left = '';
      ths[c].style.zIndex = '40';
      ths[c].style.top = '0px';
      ths[c].style.position = 'sticky';
      var fb = ths[c].querySelector('[data-date-freeze-col-v1626]');
      if (fb) {
        var isA = (DATE_FROZEN_COL === c);
        fb.classList.toggle('is-frozen', isA);
        if (fb.classList.contains('is-primary')) fb.textContent = isA ? '❄️ Frozen' : '❄️ Freeze';
      }
    }
    for (var r = 0; r < allBodyRows.length; r++) {
      var tr = allBodyRows[r];
      tr.classList.remove('krito-frozen-row-v1624', 'krito-frozen-row-edge-v1624');
      for (var j = 0; j < tr.children.length; j++) {
        tr.children[j].classList.remove('krito-frozen-col-cell-v1624', 'krito-frozen-col-edge-v1624');
        tr.children[j].style.left = '';
        tr.children[j].style.top = '';
        tr.children[j].style.zIndex = '';
      }
    }

    if (DATE_FROZEN_COL >= 0) {
      var cumLeft = 0;
      var colLefts = [];
      var lastVisibleFrozen = -1;
      for (var ci = 0; ci <= DATE_FROZEN_COL; ci++) {
        colLefts.push(cumLeft);
        if (!ths[ci].classList.contains('krito-col-hidden-v1626')) {
          lastVisibleFrozen = ci;
          cumLeft += ths[ci].getBoundingClientRect().width;
        }
      }
      for (var hc = 0; hc <= DATE_FROZEN_COL; hc++) {
        ths[hc].classList.add('krito-frozen-col-cell-v1624');
        if (hc === lastVisibleFrozen) ths[hc].classList.add('krito-frozen-col-edge-v1624');
        ths[hc].style.left = colLefts[hc] + 'px';
        ths[hc].style.zIndex = '55';
      }
      for (var br = 0; br < allBodyRows.length; br++) {
        var bTr = allBodyRows[br];
        for (var bc = 0; bc <= DATE_FROZEN_COL && bc < bTr.children.length; bc++) {
          var td = bTr.children[bc];
          td.classList.add('krito-frozen-col-cell-v1624');
          if (bc === lastVisibleFrozen) td.classList.add('krito-frozen-col-edge-v1624');
          td.style.left = colLefts[bc] + 'px';
          td.style.zIndex = '20';
        }
      }
    }

    if (effRow >= 0) {
      var cumTop = thead ? thead.getBoundingClientRect().height : 34;
      for (var ri = 0; ri <= effRow; ri++) {
        var fRow = dataRows[ri];
        fRow.classList.add('krito-frozen-row-v1624');
        if (ri === effRow) fRow.classList.add('krito-frozen-row-edge-v1624');
        for (var fc = 0; fc < fRow.children.length; fc++) {
          fRow.children[fc].style.top = cumTop + 'px';
          fRow.children[fc].style.zIndex = (DATE_FROZEN_COL >= 0 && fc <= DATE_FROZEN_COL) ? '42' : '30';
        }
        cumTop += fRow.getBoundingClientRect().height;
      }
    }

    for (var dr = 0; dr < dataRows.length; dr++) {
      var rb = dataRows[dr].querySelector('[data-date-freeze-row-v1626]');
      if (rb) rb.classList.toggle('is-frozen', dr === DATE_FROZEN_ROW);
    }

    updateDateFreezeBadgeV1626(ths, effRow);
  }

  function updateDateFreezeBadgeV1626(ths, effRow) {
    var refs = getStoreCardRefsV1626();
    if (!refs || !refs.headBar) return;
    var old = document.getElementById('kritoDateFreezeStatusV1626');
    var storeBadge = document.getElementById('kritoFreezeStatusBadgeV1624');

    if (ACTIVE_TAB !== 'DATE') {
      if (old) old.style.display = 'none';
      if (storeBadge) storeBadge.style.display = '';
      return;
    }

    if (storeBadge) storeBadge.style.display = 'none';

    if (DATE_FROZEN_COL < 0 && effRow < 0) {
      if (old) old.remove();
      return;
    }

    var parts = [];
    if (DATE_FROZEN_COL >= 0 && ths && ths[DATE_FROZEN_COL]) {
      parts.push('Col: ' + (ths[DATE_FROZEN_COL].getAttribute('data-orig-title-v1626') || '').trim());
    }
    if (effRow >= 0) {
      parts.push('Rows: 1–' + (effRow + 1));
    }

    if (!old) {
      old = document.createElement('span');
      old.id = 'kritoDateFreezeStatusV1626';
      old.className = 'krito-freeze-status-v1624';
      var fsBtn = document.getElementById('kritoStoreExpandFsBtnV1624');
      if (fsBtn && fsBtn.parentElement) {
        fsBtn.insertAdjacentElement('afterend', old);
      } else {
        refs.headBar.insertBefore(old, refs.headBar.lastElementChild || null);
      }
    }
    old.style.display = 'inline-flex';
    old.innerHTML = '<span>❄️ ' + parts.join(' | ') + '</span><button type="button" id="kritoDateUnfreezeAllBtnV1626">✖ Unfreeze</button>';
    var ub = document.getElementById('kritoDateUnfreezeAllBtnV1626');
    if (ub) {
      ub.onclick = function(ev) {
        ev.stopPropagation();
        DATE_USER_UNFROZE = true;
        DATE_FROZEN_COL = -1;
        DATE_FROZEN_ROW = -1;
        applyDateTableFreezePanesV1626();
      };
    }
  }

  function renderDateDetailModalV1626() {
    if (!DATE_MODAL_STATE.kind || !DATE_MODAL_STATE.iso) {
      popupRoot.innerHTML = '';
      return;
    }

    var ctx = getActivePeriodPairV1626();
    var daily = (ctx.mData && ctx.mData.daily && Array.isArray(ctx.mData.daily.r)) ? ctx.mData.daily : null;
    if (!daily) return;

    var row = null;
    for (var i = 0; i < daily.r.length; i++) {

  function getColumnSpecsForTableV1626(table) {
    if (!table) return [];
    var tr = table.querySelector('thead tr');
    if (!tr) return [];
    var specs = [];
    var ths = tr.children;
    for (var i = 0; i < ths.length; i++) {
      var th = ths[i];
      var raw = th.getAttribute('data-orig-title-v1626') || th.getAttribute('data-orig-title-v1624') || th.textContent || '';
      var clean = raw.replace(/❄️|Frozen|Freeze|\+/g, '').replace(/\s+/g, ' ').trim();
      var key = th.getAttribute('data-col-key-v1626') || clean || ('COL_' + i);
      specs.push({ idx: i, key: key, label: clean || ('Col ' + (i + 1)) });
    }
    return specs;
  }

  function applyHiddenColumnsToTableV1626(table, tabKey) {
    if (!table) return;
    var hiddenMap = HIDDEN_COLS[tabKey] || {};
    var specs = getColumnSpecsForTableV1626(table);
    var visibleCount = 0;

    var theadRow = table.querySelector('thead tr');
    if (theadRow) {
      for (var c = 0; c < specs.length && c < theadRow.children.length; c++) {
        var isHid = !!hiddenMap[specs[c].key];
        theadRow.children[c].classList.toggle('krito-col-hidden-v1626', isHid);
        if (!isHid) visibleCount++;
      }
    }

    var tbody = table.querySelector('tbody');
    if (tbody) {
      var rows = tbody.children;
      for (var r = 0; r < rows.length; r++) {
        var tr = rows[r];
        if (!tr || tr.tagName !== 'TR') continue;
        if (tr.classList.contains('expand-drawer-row')) {
          var dTd = tr.querySelector('td');
          if (dTd && visibleCount > 0) dTd.setAttribute('colspan', String(visibleCount));
          continue;
        }
        for (var j = 0; j < specs.length && j < tr.children.length; j++) {
          tr.children[j].classList.toggle('krito-col-hidden-v1626', !!hiddenMap[specs[j].key]);
        }
      }
    }
  }

  function computePaceAndExpectedClosingV1631() {
    var tKey = (typeof ACTIVE_DATA_TYPE !== 'undefined') ? ACTIVE_DATA_TYPE : 'TERTIARY';
    var brand = (typeof ACTIVE_BRAND !== 'undefined') ? ACTIVE_BRAND : '';
    var pKey = (typeof ACTIVE_MONTH !== 'undefined') ? ACTIVE_MONTH : '';
    var mData = getPeriodDataForTypeV1631(tKey, pKey);
    if (!mData || !mData.summary) return null;

    var curQty = Number(mData.summary.qty) || 0;
    var curVal = Number(mData.summary.net) || 0;
    var lyKey = (typeof getLastYearPeriodKey === 'function') ? getLastYearPeriodKey(pKey) : '';
    var lyData = lyKey ? getPeriodDataForTypeV1631(tKey, lyKey) : null;
    var lyFullQty = (lyData && lyData.summary) ? (Number(lyData.summary.qty) || 0) : 0;
    var lyFullVal = (lyData && lyData.summary) ? (Number(lyData.summary.net) || 0) : 0;

    var now = new Date();
    var isFullFy = String(pKey).indexOf('FULL_FY::') === 0;

    if (!isFullFy) {
      var mm = String(pKey).match(/^([A-Z]{3})-(\d{4})$/);
      var mNum = mm ? (MON_NUM[mm[1]] || (now.getMonth() + 1)) : (now.getMonth() + 1);
      var yr = mm ? parseInt(mm[2], 10) : now.getFullYear();
      var totalDays = daysInCalendarMonthV1631(yr, mNum);

      var isPastMonth = (yr < now.getFullYear()) || (yr === now.getFullYear() && mNum < (now.getMonth() + 1));
      var elapsedDays = totalDays;
      if (!isPastMonth) {
        var maxDataDay = 0;
        if (mData.daily && Array.isArray(mData.daily.r)) {
          var dr = mData.daily.r;
          for (var i = 0; i < dr.length; i++) {
            var isoMatch = String(dr[i][0] || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (isoMatch && parseInt(isoMatch[1], 10) === yr && parseInt(isoMatch[2], 10) === mNum) {
              var dd = parseInt(isoMatch[3], 10);
              if (dd > maxDataDay) maxDataDay = dd;
            }
          }
        }
        elapsedDays = maxDataDay > 0 ? Math.min(maxDataDay, totalDays) : Math.max(1, Math.min(now.getDate(), totalDays));
      }

      var perDayQty = curQty / Math.max(1, elapsedDays);
      var perDayVal = curVal / Math.max(1, elapsedDays);
      var expAvgQty = perDayQty * totalDays;
      var expAvgVal = perDayVal * totalDays;

      var expLyQty = null, expLyVal = null, lyNote = 'No LY Data';
      if (lyData && (lyFullVal > 0 || lyFullQty > 0)) {
        if (elapsedDays >= totalDays) {
          expLyQty = curQty; expLyVal = curVal;
          var grC = lyFullVal > 0 ? (((curVal - lyFullVal) / lyFullVal) * 100).toFixed(1) : '0.0';
          lyNote = 'Month Closed | vs LY: ' + (Number(grC) >= 0 ? '+' : '') + grC + '%';
        } else {
          var lyTillQty = 0, lyTillVal = 0;
          if (lyData.daily && Array.isArray(lyData.daily.r)) {
            var lr = lyData.daily.r;
            for (var j = 0; j < lr.length; j++) {
              var lm = String(lr[j][0] || '').match(/^\d{4}-\d{2}-(\d{2})$/);
              if (lm && parseInt(lm[1], 10) <= elapsedDays) {
                lyTillQty += Number(lr[j][2]) || 0;
                lyTillVal += Number(lr[j][3]) || 0;
              }
            }
          }
          if (lyTillVal > 0 && lyTillQty > 0) {
            expLyVal = lyFullVal * (curVal / lyTillVal);
            expLyQty = lyFullQty * (curQty / lyTillQty);
            var trendGr = (((curVal - lyTillVal) / lyTillVal) * 100).toFixed(1);
            lyNote = 'LY Till Day ' + elapsedDays + ' Trend (' + (Number(trendGr) >= 0 ? '+' : '') + trendGr + '%)';
          } else {
            var remDays = totalDays - elapsedDays;
            expLyVal = curVal + (lyFullVal / totalDays) * remDays;
            expLyQty = curQty + (lyFullQty / totalDays) * remDays;
            lyNote = 'Cur + LY Daily Pace (' + remDays + 'd left)';
          }
        }
      }

      return {
        perDayQty: perDayQty, perDayVal: perDayVal, daySub: 'Avg of ' + elapsedDays + ' / ' + totalDays + ' Days',
        perMonthQty: curQty, perMonthVal: curVal, monthSub: pKey + ' Total',
        expAvgQty: expAvgQty, expAvgVal: expAvgVal, avgSub: 'At Current Daily Avg × ' + totalDays + 'd',
        expLyQty: expLyQty, expLyVal: expLyVal, lyNote: lyNote
      };
    }

    var fyStr = String(pKey).replace('FULL_FY::', '');
    var fyStartYr = parseInt(fyStr.split('-')[0], 10) || now.getFullYear();
    var fyMonths = [
      'APR-' + fyStartYr, 'MAY-' + fyStartYr, 'JUN-' + fyStartYr, 'JUL-' + fyStartYr,
      'AUG-' + fyStartYr, 'SEP-' + fyStartYr, 'OCT-' + fyStartYr, 'NOV-' + fyStartYr, 'DEC-' + fyStartYr,
      'JAN-' + (fyStartYr + 1), 'FEB-' + (fyStartYr + 1), 'MAR-' + (fyStartYr + 1)
    ];

    var brandBucket = (LIVE_PAYLOAD.datasets && LIVE_PAYLOAD.datasets[tKey] && LIVE_PAYLOAD.datasets[tKey][brand]) ? LIVE_PAYLOAD.datasets[tKey][brand] : {};
    var activeMonths = [];
    var totalElapsedDays = 0;

    for (var mi = 0; mi < fyMonths.length; mi++) {
      var mk = fyMonths[mi];
      var md = brandBucket[mk];
      if (!md || !md.summary || ((Number(md.summary.qty) || 0) === 0 && (Number(md.summary.net) || 0) === 0)) continue;
      activeMonths.push(mk);
      var mParts = mk.match(/^([A-Z]{3})-(\d{4})$/);
      var mN = MON_NUM[mParts[1]], mY = parseInt(mParts[2], 10);
      var dInM = daysInCalendarMonthV1631(mY, mN);
      var isPastM = (mY < now.getFullYear()) || (mY === now.getFullYear() && mN < (now.getMonth() + 1));
      if (isPastM) {
        totalElapsedDays += dInM;
      } else {
        var maxD = 0;
        if (md.daily && Array.isArray(md.daily.r)) {
          for (var di = 0; di < md.daily.r.length; di++) {
            var im = String(md.daily.r[di][0] || '').match(/^\d{4}-\d{2}-(\d{2})$/);
            if (im) maxD = Math.max(maxD, parseInt(im[1], 10));
          }
        }
        totalElapsedDays += (maxD > 0 ? Math.min(maxD, dInM) : Math.max(1, Math.min(now.getDate(), dInM)));
      }
    }

    var mCnt = Math.max(1, activeMonths.length);
    var dCnt = Math.max(1, totalElapsedDays);
    var perDayQ = curQty / dCnt, perDayV = curVal / dCnt;
    var perMonQ = curQty / mCnt, perMonV = curVal / mCnt;
    var expAvgQ = perMonQ * 12, expAvgV = perMonV * 12;

    var expLyQ = null, expLyV = null, lyFyNote = 'No LY Data';
    if (lyData && (lyFullVal > 0 || lyFullQty > 0)) {
      var lySameMonthsQty = 0, lySameMonthsVal = 0;
      for (var am = 0; am < activeMonths.length; am++) {
        var amParts = activeMonths[am].match(/^([A-Z]{3})-(\d{4})$/);
        if (!amParts) continue;
        var lyMk = amParts[1] + '-' + (parseInt(amParts[2], 10) - 1);
        var lmd = brandBucket[lyMk];
        if (lmd && lmd.summary) {
          lySameMonthsQty += Number(lmd.summary.qty) || 0;
          lySameMonthsVal += Number(lmd.summary.net) || 0;
        }
      }
      if (lySameMonthsVal > 0 && lySameMonthsQty > 0) {
        expLyV = lyFullVal * (curVal / lySameMonthsVal);
        expLyQ = lyFullQty * (curQty / lySameMonthsQty);
        var fyGr = (((curVal - lySameMonthsVal) / lySameMonthsVal) * 100).toFixed(1);
        lyFyNote = 'LY Same ' + mCnt + 'M Trend (' + (Number(fyGr) >= 0 ? '+' : '') + fyGr + '%)';
      } else {
        expLyV = curVal + (lyFullVal / 12) * Math.max(0, 12 - mCnt);
        expLyQ = curQty + (lyFullQty / 12) * Math.max(0, 12 - mCnt);
        lyFyNote = 'Cur + LY Monthly Pace';
      }
    }

    return {
      perDayQty: perDayQ, perDayVal: perDayV, daySub: 'Avg across ' + dCnt + ' Days',
      perMonthQty: perMonQ, perMonthVal: perMonV, monthSub: 'Avg of ' + mCnt + ' Active Month(s)',
      expAvgQty: expAvgQ, expAvgVal: expAvgV, avgSub: 'At Current Monthly Avg × 12M',
      expLyQty: expLyQ, expLyVal: expLyV, lyNote: lyFyNote
    };
  }

     - FIX 3: Adds "🏢 Multi-Unit (>1)" button -> Full-Screen Popup showing all >1 Unit
              Locations in 1 window with Cluster-style multi-type stacked rows
     (PASTE RIGHT AFTER v16.33 & BEFORE </body> IN live.html)
     ============================================================================ -->
<script>
(function unifyMultiTypePopupsAndMultiUnitViewV1634() {

  if (window._kritoUnifiedPopupsV1634Installed) return;
  window._kritoUnifiedPopupsV1634Installed = true;

  var css = [

    '.krito-iad-card-v1634{background:#ffffff;border:1.5px solid #c4b5fd;border-radius:11px;padding:10px 12px;box-shadow:0 2px 8px rgba(124,58,237,0.08);}',

    '.krito-iad-hide-btn-v1634{background:#ffffff;color:#475569;border:1px solid #cbd5e1;border-radius:7px;padding:3px 10px;font-size:11px;font-weight:800;cursor:pointer;}',
    '.krito-iad-hide-btn-v1634:hover{background:#f1f5f9;color:#0f172a;}',
    '.krito-iad-grid-v1634{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}',
    '.krito-iad-pill-v1634{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#ffffff;font-size:11.5px;font-weight:800;color:#1e293b;white-space:nowrap;}',
    '.krito-iad-pill-qty-v1634{background:#4c1d95;color:#ffffff;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;}',
    '.krito-iad-pill-pct-v1634{font-size:10.5px;font-weight:700;color:#64748b;}',
    '.krito-sub-attr-btn-v1633.is-open-v1634{background:#6d28d9 !important;color:#ffffff !important;border-color:#5b21b6 !important;}',
    '.krito-sub-attr-btn-v1633.is-open-v1634 .krito-sub-attr-ico-v1633{background:#ffffff !important;color:#6d28d9 !important;}',
    '.krito-sub-attr-btn-v1633.is-open-v1634 .krito-sub-attr-cnt-v1633{color:#e9d5ff !important;}',

    /* 2. Multi-Unit (>1) Button in Individual Store Data Toolbar */
    '.krito-multiunit-btn-v1634{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:5px 11px;border-radius:8px;border:1.5px solid #2563eb;background:#eff6ff;color:#1d4ed8;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:0.15s;vertical-align:middle;}',
    '.krito-multiunit-btn-v1634:hover{background:#dbeafe;border-color:#1d4ed8;}',
    '.krito-multiunit-cnt-v1634{background:#2563eb;color:#ffffff;padding:0px 6px;border-radius:99px;font-size:10px;font-weight:900;}',

    /* 3. Full-Screen Unit / Multi-Unit Popup (Exact Match to Tertiary Active Stores Modal) */
    '#kritoUnitFsModalRootV1634 .fs-modal-backdrop{z-index:100015 !important;}',
    '.krito-ufm-typebar-v1634{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px 14px;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;}',
    '.krito-ufm-kpis-v1634{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px;}',
    '.krito-ufm-kpi-v1634{background:#0f172a;color:#ffffff;padding:12px 15px;border-radius:11px;}',
    '.krito-ufm-kpi-lbl-v1634{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:0.3px;}',
    '.krito-ufm-kpi-val-v1634{font-size:20px;font-weight:900;margin-top:3px;color:#ffffff;}',
    '.krito-ufm-sel-v1634{padding:6px 10px;border-radius:8px;border:1px solid #6366f1;font-size:12px;font-weight:700;background:#ffffff;color:#0f172a;max-width:230px;}'
  ].join('\n');

  var stEl = document.createElement('style');
  stEl.id = 'kritoUnifiedPopupsCssV1634';
  stEl.textContent = css;
  document.head.appendChild(stEl);

  var modalRoot = document.getElementById('kritoUnitFsModalRootV1634');
  if (!modalRoot) {
    modalRoot = document.createElement('div');
    modalRoot.id = 'kritoUnitFsModalRootV1634';
    document.body.appendChild(modalRoot);
  }

  var TYPE_LIST = [
    { key: 'TERTIARY',     label: 'Tertiary',     valTitle: 'Tertiary Net Value' },
    { key: 'STOCK',        label: 'Stock',        valTitle: 'Stock Value' },
    { key: 'SELL_OUT',     label: 'Sell Out',     valTitle: 'Sell Out Value' },
    { key: 'BRAND_ORDER',  label: 'Brand Order',  valTitle: 'Order Value' },
    { key: 'PAYMENT_COLL', label: 'Payment Coll', valTitle: 'Collection Value' },
    { key: 'TARGET_SHEET', label: 'Target Sheet', valTitle: 'Target Value' }
  ];
  var TYPE_META_MAP = {};
  TYPE_LIST.forEach(function(t) { TYPE_META_MAP[t.key] = t; });

  var UNIT_MODAL = {
    open: false,
    mode: 'SINGLE_PARTY', // 'SINGLE_PARTY' | 'MULTI_UNIT'
    partyName: '',
    partyFilter: 'ALL',
    selectedTypes: ['TERTIARY'],
    search: '',
    openAttrKey: ''
  };

  function esc34(s) {
    if (typeof escHtml === 'function') return escHtml(s);
    return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');
  }

  function fmtQ34(v) {
    if (typeof fmtNum === 'function') return fmtNum(Math.round(Number(v) || 0));
    return Math.round(Number(v) || 0).toLocaleString('en-IN');
  }

  function fmtI34(v) {
    if (typeof fmtINR === 'function') return fmtINR(Math.round(Number(v) || 0));
    return '₹' + Math.round(Number(v) || 0).toLocaleString('en-IN');
  }

  function growthHtml34(cur, ly) {
    if (typeof calcGrowthBadgeHtml === 'function') return calcGrowthBadgeHtml(cur, ly);
    if (!ly) return cur > 0 ? '<span style="background:#e0f2fe;color:#0284c7;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;">★ NEW</span>' : '0.0%';
    var p = (((cur - ly) / Math.abs(ly)) * 100).toFixed(1);
    var col = Number(p) >= 0 ? '#16a34a' : '#dc2626';
    return '<span style="color:' + col + ';font-weight:800;">' + (Number(p) >= 0 ? '+' : '') + p + '%</span>';
  }

  function makeTypePill34(typeKey) {
    var meta = TYPE_META_MAP[typeKey] || { label: typeKey };
    return '<span class="krito-type-pill-v1631 krito-tp-' + esc34(typeKey) + '">' + esc34(meta.label.toUpperCase()) + '</span>';
  }

  function getPeriodData34(typeKey, periodKeyOpt) {
    try {
      if (typeof LIVE_PAYLOAD === 'undefined' || !LIVE_PAYLOAD) return null;
      var brand = (typeof ACTIVE_BRAND !== 'undefined') ? ACTIVE_BRAND : '';
      var pKey = periodKeyOpt || (typeof ACTIVE_MONTH !== 'undefined' ? ACTIVE_MONTH : '');
      var ds = LIVE_PAYLOAD.datasets && LIVE_PAYLOAD.datasets[typeKey];
      if (ds && ds[brand] && ds[brand][pKey]) return ds[brand][pKey];
      if (typeKey === 'TERTIARY' && LIVE_PAYLOAD.brands && LIVE_PAYLOAD.brands[brand] && LIVE_PAYLOAD.brands[brand][pKey]) {
        return LIVE_PAYLOAD.brands[brand][pKey];
      }
      return null;
    } catch (e) { return null; }
  }

  function getCompareLy34() {
    try {
      var compareOn = !!(typeof ACTIVE_LINK !== 'undefined' && ACTIVE_LINK && ACTIVE_LINK.rights && ACTIVE_LINK.rights.allowCompareLY && typeof COMPARE_LY_ENABLED !== 'undefined' && COMPARE_LY_ENABLED);
      var lyKey = (typeof getLastYearPeriodKey === 'function' && typeof ACTIVE_MONTH !== 'undefined') ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
      return { compareOn: compareOn, lyKey: lyKey };
    } catch (e) { return { compareOn: false, lyKey: '' }; }
  }

  function getActivePinnedHeaders34() {
    var out = [];
    var tb = document.getElementById('liveStoreTbody');
    var tbl = tb ? tb.closest('table') : null;
    var tr = tbl ? tbl.querySelector('thead tr') : null;
    if (tr) {
      for (var i = 0; i < tr.children.length; i++) {
        var th = tr.children[i];
        var txt = th.textContent || '';
        var raw = (th.getAttribute('data-orig-title-v1624') || txt).replace(/📌|❄️|Frozen|Freeze/g, '').replace(/\+\s*$/, '').replace(/\s+/g, ' ').trim();
        if (txt.indexOf('📌') !== -1 || raw.indexOf('Master_') === 0) {
          out.push(raw);
        }
      }
    }
    return out;
  }

  function getCaseInsensitiveEntry34(objMap, keyName) {
    if (!objMap || !keyName) return null;
    if (objMap[keyName]) return objMap[keyName];
    var up = String(keyName).trim().toUpperCase();
    var ks = Object.keys(objMap);
    for (var i = 0; i < ks.length; i++) {
      if (String(ks[i]).trim().toUpperCase() === up) return objMap[ks[i]];
    }
    return null;
  }

  function getActiveSubValFilter34(headerName) {
    try {
      if (typeof SELECTED_ATTR_SUBVALS !== 'undefined' && SELECTED_ATTR_SUBVALS && SELECTED_ATTR_SUBVALS[headerName] instanceof Set) {
        var tertData = getPeriodData34('TERTIARY');
        var tertAttr = tertData && tertData.attributes && tertData.attributes[headerName];
        var totalPossible = (tertAttr && Array.isArray(tertAttr.values)) ? tertAttr.values.length : 0;
        var selSet = SELECTED_ATTR_SUBVALS[headerName];
        if (totalPossible > 0 && selSet.size > 0 && selSet.size < totalPossible) return selSet;
      }
    } catch (e) {}
    return null;
  }

  function summarizeValMap34(valMap, filterSet) {
    if (!valMap || typeof valMap !== 'object') return { qty: 0, count: 0, entries: [] };
    var sum = 0, entries = [];
    var ks = Object.keys(valMap);
    for (var i = 0; i < ks.length; i++) {
      var v = ks[i];
      if (filterSet && !filterSet.has(v)) continue;
      var q = Number(valMap[v]) || 0;
      if (q === 0) continue;
      sum += q;
      entries.push({ val: v, qty: q });
    }
    entries.sort(function(a, b) { return b.qty - a.qty; });
    return { qty: sum, count: entries.length, entries: entries };
  }

  function buildInlinePillGridCardHtml34(opts) {
    var entries = opts.entries || [];
    var totalQty = opts.totalQty || 0;
    var pillsHtml = entries.map(function(e) {
      var pct = totalQty !== 0 ? ((e.qty / totalQty) * 100).toFixed(1) : '0.0';
      return '<div class="krito-iad-pill-v1634">' +
        '<span>' + esc34(e.val) + '</span>' +
        '<span class="krito-iad-pill-qty-v1634">' + fmtQ34(e.qty) + '</span>' +
        '<span class="krito-iad-pill-pct-v1634">(' + pct + '%)</span>' +
      '</div>';
    }).join('') || '<span style="font-size:11.5px;color:#64748b;font-weight:700;">No header breakdown data.</span>';

    return '<div class="krito-iad-card-v1634">' +
      '<div class="krito-iad-head-v1634">' +
        '<div class="krito-iad-meta-v1634">' +
          '<span>' + esc34(opts.entityLabel) + '</span>' +
          (opts.subInfo ? '<span style="color:#64748b;font-weight:700;">| ' + esc34(opts.subInfo) + '</span>' : '') +
          '<span class="krito-iad-hdr-pill-v1634">📌 ' + esc34(opts.headerName) + '</span>' +
          '<span class="krito-iad-tot-pill-v1634">Total Qty: ' + fmtQ34(totalQty) + '</span>' +
          makeTypePill34(opts.typeKey) +
        '</div>' +
        '<button type="button" class="krito-iad-hide-btn-v1634" data-close-iad-v1634="' + esc34(opts.closeId || '1') + '">− Hide</button>' +
      '</div>' +
      '<div class="krito-iad-grid-v1634">' + pillsHtml + '</div>' +
    '</div>';
  }

  // 1. FIX MANAGER-WISE SUMMARY NATIVE DRAWER BUG (REMOVES STRAY TERTIARY CELL & BOGUS 0-ROW)
  function fixManagerNativeDrawerRowsV1634() {
    var btnBar = document.getElementById('kritoMultiTypeBtnBarV1631');
    if (!btnBar) return;
    var card = btnBar.parentElement;
    while (card && card.parentElement && !card.querySelector('table')) card = card.parentElement;
    if (!card) return;
    var table = card.querySelector('table');
    if (!table) return;
    var theadRow = table.querySelector('thead tr');
    var tbody = table.querySelector('tbody');
    if (!theadRow || !tbody) return;

    var colCount = theadRow.children.length;
    var rows = Array.from(tbody.children);

    for (var i = 0; i < rows.length; i++) {
      var tr = rows[i];
      if (!tr || tr.tagName !== 'TR') continue;
      if (tr.classList.contains('krito-type-subrow-v1631') || tr.classList.contains('krito-inline-attr-drawer-v1634')) continue;

      var firstTd = tr.children[0];
      var cs = firstTd ? parseInt(firstTd.getAttribute('colspan') || '1', 10) : 1;
      var txt = tr.textContent || '';
      var isNativeDrawer = (cs > 1) || (txt.indexOf('− Hide') !== -1 && txt.indexOf('Total Qty:') !== -1);

      if (isNativeDrawer) {
        var strayTds = tr.querySelectorAll('td.krito-td-type-v1631');
        for (var st = 0; st < strayTds.length; st++) strayTds[st].remove();

        if (firstTd) firstTd.setAttribute('colspan', String(colCount));

        var nxt = tr.nextElementSibling;
        while (nxt && nxt.classList.contains('krito-type-subrow-v1631')) {
          var toDel = nxt;
          nxt = nxt.nextElementSibling;
          toDel.remove();
        }
      }
    }
  }

  // 2. INLINE PILL-GRID DRAWER FOR PURPLE HEADER BUTTON ON SUB-ROWS (EXACT PIC 1 FORMAT)
  function toggleInlineAttrDrawerForSubRowV1634(btn) {
    var subTr = btn.closest('tr');
    if (!subTr) return;

    var hdrName = btn.getAttribute('data-hdr') || '';
    var typeKey = btn.getAttribute('data-type') || '';
    var scope   = btn.getAttribute('data-scope') || 'STORE';
    var entity  = btn.getAttribute('data-entity') || '';
    var drawerKey = typeKey + '|' + scope + '|' + entity + '|' + hdrName;

    var nextTr = subTr.nextElementSibling;
    var wasSameOpen = (nextTr && nextTr.classList.contains('krito-inline-attr-drawer-v1634') && nextTr.getAttribute('data-iad-key') === drawerKey);

    if (nextTr && nextTr.classList.contains('krito-inline-attr-drawer-v1634')) {
      nextTr.remove();
    }
    var rowBtns = subTr.querySelectorAll('.krito-sub-attr-btn-v1633.is-open-v1634');
    for (var rb = 0; rb < rowBtns.length; rb++) {
      rowBtns[rb].classList.remove('is-open-v1634');
      var ico = rowBtns[rb].querySelector('.krito-sub-attr-ico-v1633');
      if (ico) ico.textContent = '+';
    }

    if (wasSameOpen) return;

    var pData = getPeriodData34(typeKey);
    if (!pData || !pData.attributes) return;
    var attrObj = getCaseInsensitiveEntry34(pData.attributes, hdrName);
    if (!attrObj) return;

    var srcMap = (scope === 'MANAGER')
      ? getCaseInsensitiveEntry34(attrObj.byManager, entity)
      : getCaseInsensitiveEntry34(attrObj.byStore, entity);
    var sumObj = summarizeValMap34(srcMap, getActiveSubValFilter34(hdrName));

    var table = subTr.closest('table');
    var theadRow = table ? table.querySelector('thead tr') : null;
    var visibleCols = 1;
    if (theadRow) {
      visibleCols = Array.from(theadRow.children).filter(function(th) {
        return !th.classList.contains('krito-col-hidden-v1626');
      }).length || theadRow.children.length;
    }

    var subInfo = '';
    if (scope === 'MANAGER' && Array.isArray(pData.managers)) {
      var mObj = pData.managers.find(function(m) { return m && String(m.manager || '').trim().toUpperCase() === entity.trim().toUpperCase(); });
      if (mObj) subInfo = 'Stores: ' + (mObj.stores || 0);
    }

    var drawerTr = document.createElement('tr');
    drawerTr.className = 'krito-inline-attr-drawer-v1634';
    drawerTr.setAttribute('data-iad-key', drawerKey);
    drawerTr.innerHTML = '<td colspan="' + visibleCols + '">' +
      buildInlinePillGridCardHtml34({
        entityLabel: (scope === 'MANAGER' ? '👤 Manager: ' : '🏪 Party: ') + entity,
        subInfo: subInfo,
        headerName: hdrName,
        totalQty: sumObj.qty,
        typeKey: typeKey,
        entries: sumObj.entries,
        closeId: 'ROW_DRAWER'
      }) +
    '</td>';

    subTr.insertAdjacentElement('afterend', drawerTr);
    btn.classList.add('is-open-v1634');
    var curIco = btn.querySelector('.krito-sub-attr-ico-v1633');
    if (curIco) curIco.textContent = '−';
  }

  // 3. FULL-SCREEN POPUP (EXACT PIC 2 FORMAT + CLUSTER-STYLE MULTI-TYPE ROWS)
  function getMultiUnitPartiesList34(typesArr) {
    var checkTypes = Array.from(new Set(['TERTIARY', 'STOCK'].concat(typesArr || [])));
    var partyMap = {};
    for (var t = 0; t < checkTypes.length; t++) {
      var pData = getPeriodData34(checkTypes[t]);
      if (!pData || !Array.isArray(pData.stores)) continue;
      for (var i = 0; i < pData.stores.length; i++) {
        var st = pData.stores[i];
        if (!st || !st.party) continue;
        var uCnt = Array.isArray(st.subStores) ? st.subStores.length : 1;
        if (uCnt > 1) {
          var up = String(st.party).trim().toUpperCase();
          if (!partyMap[up]) {
            partyMap[up] = { party: st.party, manager: st.manager || 'Unassigned', maxUnits: uCnt };
          } else if (uCnt > partyMap[up].maxUnits) {
            partyMap[up].maxUnits = uCnt;
          }
        }
      }
    }
    return Object.values(partyMap).sort(function(a, b) { return b.maxUnits - a.maxUnits || a.party.localeCompare(b.party); });
  }

  function findStoreUnitsMap34(typeKey, partyName, periodKeyOpt) {
    var pData = getPeriodData34(typeKey, periodKeyOpt);
    var out = { storeObj: null, byUnit: {} };
    if (!pData || !Array.isArray(pData.stores)) return out;
    var up = String(partyName || '').trim().toUpperCase();
    var st = null;
    for (var i = 0; i < pData.stores.length; i++) {
      if (pData.stores[i] && String(pData.stores[i].party || '').trim().toUpperCase() === up) {
        st = pData.stores[i];
        break;
      }
    }
    if (!st) return out;
    out.storeObj = st;
    var subs = (Array.isArray(st.subStores) && st.subStores.length > 0)
      ? st.subStores
      : [{
          store: st.party, manager: st.manager || '-',
          qty: st.qty || 0, net: st.net || 0, mrp: st.mrp || 0,
          disc: st.disc || 0, discPct: st.discPct || 0, attrs: null
        }];
    for (var j = 0; j < subs.length; j++) {
      var u = subs[j];
      var uUp = String(u.store || st.party).trim().toUpperCase();
      out.byUnit[uUp] = u;
    }
    return out;
  }

  window.closeUnitFsModalV1634 = function() {
    UNIT_MODAL.open = false;
    UNIT_MODAL.openAttrKey = '';
    modalRoot.innerHTML = '';
  };

  function openSinglePartyUnitFsModalV1634(partyName, initialTypeKey) {
    UNIT_MODAL.open = true;
    UNIT_MODAL.mode = 'SINGLE_PARTY';
    UNIT_MODAL.partyName = partyName;
    UNIT_MODAL.partyFilter = 'ALL';
    UNIT_MODAL.selectedTypes = [initialTypeKey || 'STOCK'];
    UNIT_MODAL.search = '';
    UNIT_MODAL.openAttrKey = '';
    renderUnitFsModalV1634();
  }

  function openMultiUnitClusterFsModalV1634() {
    var curTypes = (window._kritoMultiTypeStateV1631 && Array.isArray(window._kritoMultiTypeStateV1631.selectedTypes) && window._kritoMultiTypeStateV1631.selectedTypes.length > 0)
      ? window._kritoMultiTypeStateV1631.selectedTypes.slice()
      : ['TERTIARY'];
    UNIT_MODAL.open = true;
    UNIT_MODAL.mode = 'MULTI_UNIT';
    UNIT_MODAL.partyName = '';
    UNIT_MODAL.partyFilter = 'ALL';
    UNIT_MODAL.selectedTypes = curTypes;
    UNIT_MODAL.search = '';
    UNIT_MODAL.openAttrKey = '';
    renderUnitFsModalV1634();
  }

  function renderUnitFsModalV1634() {
    if (!UNIT_MODAL.open) { modalRoot.innerHTML = ''; return; }

    var activeFocusId = document.activeElement ? document.activeElement.id : '';
    var selPos = (activeFocusId === 'kritoUfmSearchV1634') ? (document.activeElement.selectionStart || 0) : -1;

    var selSet = new Set(UNIT_MODAL.selectedTypes || ['TERTIARY']);
    var selTypes = TYPE_LIST.filter(function(t) { return selSet.has(t.key); }).map(function(t) { return t.key; });
    if (selTypes.length === 0) selTypes = ['TERTIARY'];

    var primaryType = selTypes[0];
    var primaryMeta = TYPE_META_MAP[primaryType] || { label: primaryType, valTitle: 'Net Value' };
    var isMultiUnitMode = (UNIT_MODAL.mode === 'MULTI_UNIT');
    var pinnedHeaders = getActivePinnedHeaders34();
    var lyInfo = getCompareLy34();
    var rights = (typeof ACTIVE_LINK !== 'undefined' && ACTIVE_LINK && ACTIVE_LINK.rights) ? ACTIVE_LINK.rights : {};
    var showMrp = (rights.showMrpAndDisc !== false);
    var lyLabel = lyInfo.lyKey ? (' (' + lyInfo.lyKey.replace('FULL_FY::', 'FY ') + ')') : '';
    var periodNice = (typeof getPeriodDisplayLabel === 'function' && typeof ACTIVE_MONTH !== 'undefined') ? getPeriodDisplayLabel(ACTIVE_MONTH) : '';

    var multiPartiesList = isMultiUnitMode ? getMultiUnitPartiesList34(selTypes) : [];
    var targetParties = [];
    if (isMultiUnitMode) {
      if (UNIT_MODAL.partyFilter && UNIT_MODAL.partyFilter !== 'ALL') {
        var fp = multiPartiesList.find(function(x) { return x.party === UNIT_MODAL.partyFilter; });
        if (fp) targetParties = [fp.party];
      } else {
        targetParties = multiPartiesList.map(function(x) { return x.party; });
      }
    } else {
      targetParties = [UNIT_MODAL.partyName];
    }
