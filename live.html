<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRITO — Live Sales & Operations Tracker</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; background: #f1f5f9; color: #0f172a; padding: 12px; }
  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .top-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; border-radius: 16px; padding: 15px 18px; box-shadow: 0 12px 30px rgba(15,23,42,0.18); }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 11.5px; font-weight: 900; }
  .st-completed { background: #10b981; color: #ffffff; }
  .st-updating  { background: #f59e0b; color: #0f172a; }
  .st-partial   { background: #f97316; color: #ffffff; }
  .timer-pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(16,185,129,0.18); border: 1px solid #34d399; color: #6ee7b7; padding: 5px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .tab-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .dtype-btn { padding: 7px 13px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); color: #e2e8f0; font-size: 12px; font-weight: 900; cursor: pointer; }
  .dtype-btn.active { background: #10b981; color: #ffffff; border-color: #34d399; box-shadow: 0 4px 12px rgba(16,185,129,0.35); }
  .brand-btn { padding: 7px 14px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; font-size: 12px; font-weight: 900; cursor: pointer; }
  .brand-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.35); }
  .ctrl-select { padding: 7px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 900; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; cursor: pointer; }
  .compare-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; font-size: 11.5px; font-weight: 900; cursor: pointer; user-select: none; border: 1.5px solid #34d399; background: rgba(16,185,129,0.16); color: #ecfdf5; }
  .compare-pill.off { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); color: #cbd5e1; }
  .grand-card { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #fff; border-radius: 16px; padding: 16px 20px; border: 2px solid #4f46e5; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 11px; margin-top: 12px; }
  .kpi-box { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 11px 13px; }
  .kpi-lbl { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
  .kpi-val { font-size: 19px; font-weight: 900; margin-top: 4px; }
  .kpi-sub { font-size: 11px; font-weight: 800; margin-top: 4px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .section-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 13px 16px; box-shadow: 0 4px 12px rgba(15,23,42,0.04); }
  .attr-bar { background: #f5f3ff; border: 2px solid #c4b5fd; border-radius: 14px; padding: 12px 15px; display: flex; flex-direction: column; gap: 9px; }
  .attr-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 800; cursor: pointer; border: 1.5px solid #c4b5fd; background: #ffffff; color: #3b0764; user-select: none; }
  .attr-chip.checked { background: #ede9fe; border-color: #7c3aed; color: #4c1d95; }
  .attr-chip.missing { background: #fef2f2; border-color: #ef4444; color: #b91c1c; }
  .table-scroll { overflow: auto; max-height: 460px; border: 1px solid #e2e8f0; border-radius: 9px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.8px; white-space: nowrap; }
  th { background: #f8fafc; color: #334155; padding: 8px 10px; text-align: left; border-bottom: 2px solid #cbd5e1; font-weight: 900; position: sticky; top: 0; z-index: 5; }
  th.attr-th { background: #ede9fe; color: #4c1d95; border-left: 1px solid #ddd6fe; text-align: right; }
  th.missing-th { background: #fee2e2; color: #b91c1c; border-left: 1px solid #fecaca; text-align: right; }
  th.ly-th { background: #ecfdf5; color: #065f46; border-left: 1px solid #a7f3d0; text-align: right; }
  td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; font-weight: 700; }
  td.attr-td { text-align: right; color: #4c1d95; background: #faf5ff; border-left: 1px solid #f3e8ff; font-weight: 800; }
  td.missing-td { text-align: right; color: #b91c1c; background: #fef2f2; border-left: 1px solid #fee2e2; font-weight: 900; }
  td.ly-td { text-align: right; color: #475569; background: #f8fafc; border-left: 1px solid #e2e8f0; }
  .num { text-align: right; }
  .gr-pos { background: #dcfce7; color: #15803d; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 900; display: inline-block; }
  .gr-neg { background: #fee2e2; color: #b91c1c; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 900; display: inline-block; }
  .gr-new { background: #e0f2fe; color: #0369a1; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 900; display: inline-block; }
  .gr-flat { background: #f1f5f9; color: #64748b; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 800; display: inline-block; }
  .lock-screen { max-width: 420px; margin: 70px auto; background: #fff; border-radius: 16px; padding: 28px; text-align: center; border: 2px solid #cbd5e1; box-shadow: 0 18px 40px rgba(15,23,42,0.12); }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="lock-screen">⏳ Loading Live KRITO Report...</div>
</div>

<script>
var TYPE_META = {
  TERTIARY:     { label: '🔥 Tertiary Data', valTitle: 'Tertiary Net Value' },
  STOCK:        { label: '📦 Stock Data',    valTitle: 'Stock Value' },
  SELL_IN:      { label: '📥 Sell In',       valTitle: 'Sell-In Value' },
  SELL_OUT:     { label: '📤 Sell Out',      valTitle: 'Sell-Out Value' },
  BRAND_ORDER:  { label: '📝 Brand Order',   valTitle: 'Order Value' },
  PAYMENT_COLL: { label: '💳 Payment Coll',  valTitle: 'Collection Value' },
  TARGET_SHEET: { label: '🎯 Target Sheet',  valTitle: 'Target Value' }
};

var MON_NUM = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };

var LIVE_PAYLOAD = null;
var ACTIVE_LINK = null;
var ACTIVE_DATA_TYPE = '';
var ACTIVE_BRAND = '';
var ACTIVE_YEAR2 = 'ALL';
var ACTIVE_MONTH = '';
var COMPARE_LY_ENABLED = true; // Default Ticked!
var ACTIVE_HEADER = '';
var HEADER_DEFAULT_INIT = false;
var UNCHECKED_ATTR_VALS = {}; // headerName -> Set of unchecked sub-values
var ATTR_VAL_SEARCH = '';
var PIN_UNLOCKED = false;
var SEARCH_Q = '';
var SEARCH_TIMER = null;

// Live 30-Second Countdown Timer State
var TIMER_SECONDS = 30;
var TIMER_INTERVAL = null;
var IS_FETCHING_NOW = false;

function fmtINR(n) { return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getQueryId() {
  return new URLSearchParams(window.location.search).get('id') || '';
}

// Compute Previous Year Period Key ("OCT-2026" -> "OCT-2025", "FULL_FY::2026-27" -> "FULL_FY::2025-26")
function getLastYearPeriodKey(periodKey) {
  if (!periodKey) return '';
  if (periodKey.startsWith('FULL_FY::')) {
    var fy = periodKey.slice(9); // e.g. "2026-27"
    var fm = fy.match(/^(\d{4})-(\d{2})$/);
    if (fm) {
      var prevStart = parseInt(fm[1], 10) - 1;
      var prevEnd = String((prevStart + 1) % 100).padStart(2, '0');
      return 'FULL_FY::' + prevStart + '-' + prevEnd;
    }
    return '';
  }
  var mm = periodKey.match(/^([A-Z]{3})-(\d{4})$/);
  if (mm) {
    return mm[1] + '-' + (parseInt(mm[2], 10) - 1);
  }
  return '';
}

function getPeriodDisplayLabel(periodKey) {
  if (!periodKey) return '-';
  if (periodKey.startsWith('FULL_FY::')) return '📅 FULL FY (' + periodKey.slice(9) + ')';
  return '🗓️ ' + periodKey;
}

function calcGrowthBadgeHtml(cyVal, lyVal) {
  var cy = Number(cyVal) || 0;
  var ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return '<span class="gr-new">★ NEW</span>';
  if (ly <= 0 && cy <= 0) return '<span class="gr-flat">0.0%</span>';
  var pct = ((cy - ly) / ly) * 100;
  var sign = pct >= 0 ? '▲ +' : '▼ ';
  var cls = pct >= 0 ? 'gr-pos' : 'gr-neg';
  return '<span class="' + cls + '">' + sign + pct.toFixed(1) + '%</span>';
}

function calcGrowthPlainText(cyVal, lyVal) {
  var cy = Number(cyVal) || 0;
  var ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return 'NEW';
  if (ly <= 0 && cy <= 0) return '0.0%';
  var pct = ((cy - ly) / ly) * 100;
  return (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function sortMonthKeysDesc(keysArr) {
  return keysArr.slice().sort(function(a, b) {
    var aIsFy = a.startsWith('FULL_FY::');
    var bIsFy = b.startsWith('FULL_FY::');
    if (aIsFy && !bIsFy) return 1;
    if (!aIsFy && bIsFy) return -1;
    if (aIsFy && bIsFy) return b.localeCompare(a);
    var ma = a.match(/^([A-Z]{3})-(\d{4})$/);
    var mb = b.match(/^([A-Z]{3})-(\d{4})$/);
    if (ma && mb) {
      var na = parseInt(ma[2], 10) * 100 + (MON_NUM[ma[1]] || 0);
      var nb = parseInt(mb[2], 10) * 100 + (MON_NUM[mb[1]] || 0);
      return nb - na;
    }
    return b.localeCompare(a);
  });
}

// Live 30-Second Countdown Engine (Updates ONLY the single timer span -> Zero Flicker / Zero Hang!)
function start30SecCountdownLoop() {
  if (TIMER_INTERVAL) clearInterval(TIMER_INTERVAL);
  TIMER_INTERVAL = setInterval(function() {
    if (IS_FETCHING_NOW) return;
    TIMER_SECONDS--;
    var el = document.getElementById('liveTimerText');
    if (TIMER_SECONDS <= 0) {
      TIMER_SECONDS = 30;
      if (el) el.textContent = '🔄 Syncing...';
      fetchLiveReportData(true);
    } else if (el) {
      el.textContent = TIMER_SECONDS + 's';
    }
  }, 1000);
}

function manualRefreshClick() {
  TIMER_SECONDS = 30;
  var el = document.getElementById('liveTimerText');
  if (el) el.textContent = '🔄 Syncing...';
  fetchLiveReportData(false);
}

async function fetchLiveReportData(isAutoTick) {
  if (IS_FETCHING_NOW) return;
  IS_FETCHING_NOW = true;
  try {
    var res = await fetch('./live_data.json?_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Live data file not found yet.');
    var freshPayload = await res.json();

    var prevIso = LIVE_PAYLOAD ? LIVE_PAYLOAD.generatedAtIso : '';
    var changed = !LIVE_PAYLOAD || (freshPayload.generatedAtIso !== prevIso);
    LIVE_PAYLOAD = freshPayload;

    // On auto-refresh, skip full DOM re-render if no new data arrived (Zero flicker & smooth browsing!)
    if (!isAutoTick || changed) {
      var winY = window.scrollY || 0;
      var tblEl = document.getElementById('liveStoreScrollWrap');
      var tblY = tblEl ? tblEl.scrollTop : 0;
      renderApp();
      window.scrollTo(0, winY);
      var newTblEl = document.getElementById('liveStoreScrollWrap');
      if (newTblEl) newTblEl.scrollTop = tblY;
    }
  } catch (err) {
    if (!LIVE_PAYLOAD) {
      document.getElementById('app').innerHTML = '<div class="lock-screen"><h3>⚠️ Unable to Load Live Data</h3><p style="color:#64748b;font-size:13px;">' + escHtml(err.message) + '</p><button onclick="manualRefreshClick()" style="background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-weight:800;cursor:pointer;">🔄 Retry</button></div>';
    }
  } finally {
    IS_FETCHING_NOW = false;
    TIMER_SECONDS = 30;
    var el = document.getElementById('liveTimerText');
    if (el) el.textContent = '30s';
  }
}

function verifyPin() {
  var inp = document.getElementById('viewerPinInp')?.value.trim();
  if (inp === String(ACTIVE_LINK.pin)) {
    PIN_UNLOCKED = true;
    renderApp();
  } else {
    alert('❌ Wrong Access PIN!');
  }
}

function getActiveDatasetBucket() {
  if (!LIVE_PAYLOAD) return {};
  if (LIVE_PAYLOAD.datasets && LIVE_PAYLOAD.datasets[ACTIVE_DATA_TYPE]) {
    return LIVE_PAYLOAD.datasets[ACTIVE_DATA_TYPE];
  }
  if (ACTIVE_DATA_TYPE === 'TERTIARY' && LIVE_PAYLOAD.brands) {
    return LIVE_PAYLOAD.brands;
  }
  return {};
}

function getSelectedAttrColsForRender(mData, rights) {
  if (!rights.showHeaderBreakdown || !ACTIVE_HEADER) return [];
  var aObj = (mData && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? mData.attributes[ACTIVE_HEADER] : null;
  if (!aObj || !Array.isArray(aObj.values)) return [];
  var unchk = UNCHECKED_ATTR_VALS[ACTIVE_HEADER] || new Set();
  return aObj.values.filter(function(v) { return !unchk.has(v); });
}

function toggleAttrSubVal(valName, checked) {
  if (!ACTIVE_HEADER) return;
  if (!UNCHECKED_ATTR_VALS[ACTIVE_HEADER]) UNCHECKED_ATTR_VALS[ACTIVE_HEADER] = new Set();
  if (checked) UNCHECKED_ATTR_VALS[ACTIVE_HEADER].delete(valName);
  else UNCHECKED_ATTR_VALS[ACTIVE_HEADER].add(valName);
  renderApp();
}

function setAllAttrSubVals(shouldSelectAll) {
  if (!ACTIVE_HEADER) return;
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH];
  var aObj = (mData && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? mData.attributes[ACTIVE_HEADER] : null;
  if (!aObj) return;
  UNCHECKED_ATTR_VALS[ACTIVE_HEADER] = shouldSelectAll ? new Set() : new Set(aObj.values);
  renderApp();
}

function showOnlyMissingAttrVal() {
  if (!ACTIVE_HEADER) return;
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH];
  var aObj = (mData && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? mData.attributes[ACTIVE_HEADER] : null;
  if (!aObj) return;
  UNCHECKED_ATTR_VALS[ACTIVE_HEADER] = new Set(aObj.values.filter(function(v) { return v !== '(ENTER ATTRIBUTES)'; }));
  renderApp();
}

function onStoreSearchTyped(val) {
  SEARCH_Q = String(val || '').toLowerCase();
  if (SEARCH_TIMER) clearTimeout(SEARCH_TIMER);
  SEARCH_TIMER = setTimeout(updateStoreTableBodyOnly, 100);
}

// Fast In-Place Store Table Updater (Zero lag while typing in Store Search!)
function updateStoreTableBodyOnly() {
  var tbody = document.getElementById('liveStoreTbody');
  var cntBadge = document.getElementById('liveStoreCountBadge');
  if (!tbody || !ACTIVE_LINK || !LIVE_PAYLOAD) return;

  var bucket = getActiveDatasetBucket();
  var brandPeriods = bucket[ACTIVE_BRAND] || {};
  var mData = brandPeriods[ACTIVE_MONTH] || { stores: [], attributes: {} };
  var rights = ACTIVE_LINK.rights || {};
  var compareOn = !!(rights.allowCompareLY && COMPARE_LY_ENABLED);
  var lyKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyKey && brandPeriods[lyKey]) ? brandPeriods[lyKey] : null;
  var lyStoreMap = {};
  if (lyData && Array.isArray(lyData.stores)) {
    lyData.stores.forEach(function(s) { lyStoreMap[String(s.party || '').trim().toUpperCase()] = s; });
  }

  var activeAttrCols = getSelectedAttrColsForRender(mData, rights);
  var attrByStore = (ACTIVE_HEADER && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? (mData.attributes[ACTIVE_HEADER].byStore || {}) : {};

  var filtered = (mData.stores || []).filter(function(s) {
    return !SEARCH_Q || s.party.toLowerCase().includes(SEARCH_Q) || s.manager.toLowerCase().includes(SEARCH_Q);
  });

  if (cntBadge) cntBadge.textContent = '(' + filtered.length + ' Stores)';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="40" style="text-align:center;color:#64748b;padding:24px;">No store data found for this filter.</td></tr>';
    return;
  }

  var htmlRows = [];
  for (var i = 0; i < filtered.length; i++) {
    var s = filtered[i];
    var pKey = String(s.party || '').trim().toUpperCase();
    var lyS = lyStoreMap[pKey] || { qty: 0, net: 0 };
    var sAttrs = attrByStore[pKey] || attrByStore[s.party] || {};

    var attrTds = '';
    for (var a = 0; a < activeAttrCols.length; a++) {
      var av = activeAttrCols[a];
      var aq = sAttrs[av] || 0;
      var isMiss = (av === '(ENTER ATTRIBUTES)');
      attrTds += '<td class="' + (isMiss ? 'missing-td' : 'attr-td') + '">' + (aq > 0 ? fmtNum(aq) : '<span style="color:#cbd5e1;">-</span>') + '</td>';
    }

    var lyTds = compareOn
      ? '<td class="ly-td">' + fmtNum(lyS.qty) + '</td><td class="ly-td">' + fmtINR(lyS.net) + '</td><td class="num">' + calcGrowthBadgeHtml(s.net, lyS.net) + '</td>'
      : '';

    var mrpDiscTds = rights.showMrpAndDisc
      ? '<td class="num">' + fmtINR(s.mrp) + '</td><td class="num" style="color:#dc2626;">' + s.discPct + '%</td>'
      : '';

    htmlRows.push(
      '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><b>' + escHtml(s.party) + '</b></td>' +
        '<td>' + escHtml(s.manager) + '</td>' +
        attrTds +
        '<td class="num"><b>' + fmtNum(s.qty) + '</b></td>' +
        '<td class="num" style="color:#0284c7;"><b>' + fmtINR(s.net) + '</b></td>' +
        lyTds +
        mrpDiscTds +
      '</tr>'
    );
  }
  tbody.innerHTML = htmlRows.join('');
}

function downloadLiveCsv() {
  var bucket = getActiveDatasetBucket();
  var brandPeriods = bucket[ACTIVE_BRAND] || {};
  var mData = brandPeriods[ACTIVE_MONTH];
  if (!mData || !mData.stores) return;

  var r = ACTIVE_LINK.rights || {};
  var compareOn = !!(r.allowCompareLY && COMPARE_LY_ENABLED);
  var lyKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyKey && brandPeriods[lyKey]) ? brandPeriods[lyKey] : null;
  var lyStoreMap = {};
  if (lyData && Array.isArray(lyData.stores)) {
    lyData.stores.forEach(function(s) { lyStoreMap[String(s.party || '').trim().toUpperCase()] = s; });
  }

  var activeAttrCols = getSelectedAttrColsForRender(mData, r);
  var attrByStore = (ACTIVE_HEADER && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? (mData.attributes[ACTIVE_HEADER].byStore || {}) : {};
  var vTitle = (TYPE_META[ACTIVE_DATA_TYPE] && TYPE_META[ACTIVE_DATA_TYPE].valTitle) || 'Net Value';

  var hdr = ['S.No', 'Party Name', 'Manager'].concat(activeAttrCols).concat(['Qty', vTitle]);
  if (compareOn) hdr = hdr.concat(['LY Qty', 'LY ' + vTitle, 'Growth %']);
  if (r.showMrpAndDisc) hdr = hdr.concat(['MRP Value', 'Discount', 'Disc %']);

  var lines = [hdr.map(function(h) { return '"' + String(h).replace(/"/g,'""') + '"'; }).join(',')];
  mData.stores.forEach(function(s, i) {
    var pKey = String(s.party || '').trim().toUpperCase();
    var lyS = lyStoreMap[pKey] || { qty: 0, net: 0 };
    var sAttrs = attrByStore[pKey] || attrByStore[s.party] || {};

    var row = [i + 1, '"' + s.party.replace(/"/g,'""') + '"', '"' + s.manager.replace(/"/g,'""') + '"'];
    activeAttrCols.forEach(function(av) { row.push(sAttrs[av] || 0); });
    row.push(s.qty, s.net);
    if (compareOn) row.push(lyS.qty, lyS.net, '"' + calcGrowthPlainText(s.net, lyS.net) + '"');
    if (r.showMrpAndDisc) row.push(s.mrp, s.disc, s.discPct + '%');
    lines.push(row.join(','));
  });

  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ACTIVE_DATA_TYPE + '_' + ACTIVE_BRAND + '_' + ACTIVE_MONTH.replace(/:/g,'_') + '_Live.csv';
  a.click();
}

function renderApp() {
  var app = document.getElementById('app');
  var linkId = getQueryId();
  var linksMap = (LIVE_PAYLOAD && LIVE_PAYLOAD.links) || {};
  ACTIVE_LINK = linkId ? linksMap[linkId] : Object.values(linksMap)[0];

  if (!ACTIVE_LINK) {
    app.innerHTML = '<div class="lock-screen"><h2>🔒 Invalid Link</h2><p style="color:#64748b;font-size:13px;">Yeh Live Report Link valid nahi hai ya delete ho chuka hai.</p></div>';
    return;
  }
  if (!ACTIVE_LINK.active) {
    app.innerHTML = '<div class="lock-screen"><h2>🚫 Access Disabled</h2><p style="color:#dc2626;font-weight:700;font-size:13px;">Admin ne is Live Report Link ka access band (Revoke) kar diya hai.</p></div>';
    return;
  }
  if (ACTIVE_LINK.expiresAt && new Date(ACTIVE_LINK.expiresAt).getTime() < Date.now()) {
    app.innerHTML = '<div class="lock-screen"><h2>⏰ Link Expired</h2><p style="color:#b91c1c;font-weight:700;font-size:13px;">Is Live Report Link ka valid time (' + escHtml(ACTIVE_LINK.validityLabel) + ') khatam ho chuka hai.</p></div>';
    return;
  }
  if (ACTIVE_LINK.pin && !PIN_UNLOCKED) {
    app.innerHTML = '<div class="lock-screen"><h2>🔐 PIN Protected Report</h2><p style="color:#475569;font-size:13px;"><b>' + escHtml(ACTIVE_LINK.title) + '</b> dekhne ke liye Access PIN daalein:</p><input id="viewerPinInp" type="password" placeholder="Enter PIN" style="padding:10px;width:180px;text-align:center;font-size:16px;font-weight:900;border:2px solid #4f46e5;border-radius:8px;margin:10px 0;"><br><button onclick="verifyPin()" style="background:#4f46e5;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:900;cursor:pointer;">🔓 Unlock Report</button></div>';
    return;
  }

  var rights = ACTIVE_LINK.rights || {
    showGrandTotal: true, showManagers: true, showStores: true, showPending: true,
    showMrpAndDisc: true, showYear2: false, allowCompareLY: false, showHeaderBreakdown: false
  };

  // Initialize Default Header once if configured
  var allowedHeaders = (rights.showHeaderBreakdown && Array.isArray(ACTIVE_LINK.allowedHeaders)) ? ACTIVE_LINK.allowedHeaders : [];
  if (!HEADER_DEFAULT_INIT) {
    HEADER_DEFAULT_INIT = true;
    if (ACTIVE_LINK.defaultHeader && allowedHeaders.includes(ACTIVE_LINK.defaultHeader)) {
      ACTIVE_HEADER = ACTIVE_LINK.defaultHeader;
    }
  }
  if (ACTIVE_HEADER && !allowedHeaders.includes(ACTIVE_HEADER)) ACTIVE_HEADER = '';

  // Strictly enforce Allowed Data Types
  var allowedDataTypes = (Array.isArray(ACTIVE_LINK.dataTypes) && ACTIVE_LINK.dataTypes.length > 0) ? ACTIVE_LINK.dataTypes : ['TERTIARY'];
  if (!ACTIVE_DATA_TYPE || !allowedDataTypes.includes(ACTIVE_DATA_TYPE)) ACTIVE_DATA_TYPE = allowedDataTypes[0];

  var activeBucket = getActiveDatasetBucket();
  var allowedBrands = (Array.isArray(ACTIVE_LINK.brands) && ACTIVE_LINK.brands.length > 0) ? ACTIVE_LINK.brands : Object.keys(activeBucket);
  if (!ACTIVE_BRAND || !allowedBrands.includes(ACTIVE_BRAND)) ACTIVE_BRAND = allowedBrands[0] || 'ARROW';

  var brandPeriods = activeBucket[ACTIVE_BRAND] || {};
  var allPeriodKeys = Object.keys(brandPeriods);

  // Collect available Year 2 (FY) values for this Brand
  var fySet = new Set();
  allPeriodKeys.forEach(function(pk) {
    var y2 = brandPeriods[pk] && brandPeriods[pk].year2;
    if (y2) fySet.add(y2);
  });
  var availYear2 = Array.from(fySet).sort().reverse();
  if (!rights.showYear2) ACTIVE_YEAR2 = 'ALL';
  else if (ACTIVE_YEAR2 !== 'ALL' && !fySet.has(ACTIVE_YEAR2)) ACTIVE_YEAR2 = availYear2[0] || 'ALL';

  // Filter Month options by selected Year 2 (FY)
  var availMonths = sortMonthKeysDesc(allPeriodKeys.filter(function(pk) {
    if (ACTIVE_YEAR2 === 'ALL') return !pk.startsWith('FULL_FY::');
    var y2 = brandPeriods[pk] && brandPeriods[pk].year2;
    return y2 === ACTIVE_YEAR2;
  }));

  if (!ACTIVE_MONTH || !availMonths.includes(ACTIVE_MONTH)) {
    ACTIVE_MONTH = (ACTIVE_LINK.defaultMonth && availMonths.includes(ACTIVE_LINK.defaultMonth)) ? ACTIVE_LINK.defaultMonth : (availMonths[0] || '');
  }

  var dtMeta = TYPE_META[ACTIVE_DATA_TYPE] || { label: ACTIVE_DATA_TYPE, valTitle: 'Net Value' };
  var gStatus = LIVE_PAYLOAD.globalStatus || { status: 'UPDATING', statusNote: '' };
  var effStatus = (ACTIVE_LINK.statusOverride && ACTIVE_LINK.statusOverride !== 'GLOBAL') ? ACTIVE_LINK.statusOverride : gStatus.status;
  var stClass = effStatus === 'COMPLETED' ? 'st-completed' : (effStatus === 'PARTIAL' ? 'st-partial' : 'st-updating');
  var stText  = effStatus === 'COMPLETED' ? '✅ STATUS: COMPLETED & UPDATED' : (effStatus === 'PARTIAL' ? '🟠 STATUS: PARTIALLY UPDATED' : '🟡 STATUS: LIVE UPDATING IN PROGRESS');

  var mData = brandPeriods[ACTIVE_MONTH] || { grandTotal: { stores: 0, pendingStores: 0, qty: 0, mrp: 0, net: 0, disc: 0, discPct: 0 }, managers: [], stores: [], pending: [], attributes: {} };
  var gt = mData.grandTotal;

  // Last Year Same-Month / Same-FY Comparison Data
  var compareOn = !!(rights.allowCompareLY && COMPARE_LY_ENABLED);
  var lyPeriodKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyPeriodKey && brandPeriods[lyPeriodKey]) ? brandPeriods[lyKey = lyPeriodKey] : null;
  var lyGt = lyData ? lyData.grandTotal : { qty: 0, net: 0, mrp: 0, disc: 0 };
  var lyMgrMap = {};
  if (lyData && Array.isArray(lyData.managers)) {
    lyData.managers.forEach(function(m) { lyMgrMap[String(m.manager || '').trim().toUpperCase()] = m; });
  }

  // Header Qty Breakdown Data
  var activeAttrObj = (rights.showHeaderBreakdown && ACTIVE_HEADER && mData.attributes && mData.attributes[ACTIVE_HEADER]) ? mData.attributes[ACTIVE_HEADER] : null;
  var activeAttrCols = getSelectedAttrColsForRender(mData, rights);
  var attrByMgr = activeAttrObj ? (activeAttrObj.byManager || {}) : {};

  // Build Header Breakdown Control Bar HTML (if right granted)
  var headerBreakdownBarHtml = '';
  if (rights.showHeaderBreakdown && allowedHeaders.length > 0) {
    var subChipsHtml = '';
    if (ACTIVE_HEADER && activeAttrObj) {
      var unchk = UNCHECKED_ATTR_VALS[ACTIVE_HEADER] || new Set();
      var qAttr = ATTR_VAL_SEARCH.trim().toLowerCase();
      var missQty = activeAttrObj.totals['(ENTER ATTRIBUTES)'] || 0;

      subChipsHtml = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <input type="text" value="${escHtml(ATTR_VAL_SEARCH)}" oninput="ATTR_VAL_SEARCH=this.value; renderApp();" placeholder="🔍 Search values inside ${escHtml(ACTIVE_HEADER)} (e.g. SHIRTS, T-SHIRTS)..." style="padding:5px 9px; border:1px solid #a78bfa; border-radius:6px; font-size:11px; font-weight:700; width:260px;">
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <button onclick="setAllAttrSubVals(true)" style="background:#7c3aed;color:#fff;border:none;padding:4px 9px;border-radius:5px;font-size:10.5px;font-weight:900;cursor:pointer;">☑️ Tick All (${activeAttrObj.values.length})</button>
            <button onclick="setAllAttrSubVals(false)" style="background:#64748b;color:#fff;border:none;padding:4px 9px;border-radius:5px;font-size:10.5px;font-weight:900;cursor:pointer;">⬜ Untick All</button>
            ${missQty > 0 ? `<button onclick="showOnlyMissingAttrVal()" style="background:#dc2626;color:#fff;border:none;padding:4px 9px;border-radius:5px;font-size:10.5px;font-weight:900;cursor:pointer;">⚠️ Only (ENTER ATTRIBUTES): ${fmtNum(missQty)} Qty</button>` : ''}
          </div>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:6px; max-height:115px; overflow-y:auto; padding-top:2px;">
          ${activeAttrObj.values.filter(function(v) { return !qAttr || v.toLowerCase().includes(qAttr); }).map(function(v) {
            var isChk = !unchk.has(v);
            var isMiss = (v === '(ENTER ATTRIBUTES)');
            var tQty = activeAttrObj.totals[v] || 0;
            var safeV = v.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            return `<label class="attr-chip ${isMiss ? 'missing' : (isChk ? 'checked' : '')}">
              <input type="checkbox" ${isChk ? 'checked' : ''} onchange="toggleAttrSubVal('${safeV}', this.checked)" style="margin:0; accent-color:${isMiss ? '#dc2626' : '#7c3aed'};">
              <span>${isMiss ? '⚠️ ' + escHtml(v) : escHtml(v)}</span>
              <span style="background:${isMiss ? '#dc2626' : '#6d28d9'}; color:#fff; padding:1px 5px; border-radius:4px; font-size:9.5px;">${fmtNum(tQty)}</span>
            </label>`;
          }).join('')}
        </div>
      `;
    } else if (ACTIVE_HEADER) {
      subChipsHtml = `<div style="font-size:11.5px; color:#b45309; font-weight:800;">⚠️ Is period mein "${escHtml(ACTIVE_HEADER)}" ka data abhi available nahi hai. Software se ek baar "Push Live Data Now" karein.</div>`;
    }

    headerBreakdownBarHtml = `
      <div class="attr-bar">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-size:12.5px; font-weight:900; color:#4c1d95;">🧩 Header Qty Breakdown (Manager & Party Wise):</span>
            <select class="ctrl-select" style="border-color:#7c3aed; color:#4c1d95;" onchange="ACTIVE_HEADER=this.value; ATTR_VAL_SEARCH=''; renderApp();">
              <option value="">-- Off (Standard View) --</option>
              ${allowedHeaders.map(function(h) {
                return `<option value="${escHtml(h)}" ${h === ACTIVE_HEADER ? 'selected' : ''}>📌 ${escHtml(h)}</option>`;
              }).join('')}
            </select>
          </div>
          ${ACTIVE_HEADER ? `<span style="font-size:11px; font-weight:800; color:#6d28d9;">Showing <b>${activeAttrCols.length}</b> Attribute Qty Columns right next to Manager & Party Name</span>` : `<span style="font-size:11px; font-weight:700; color:#64748b;">Select any header (e.g. Master_GROUP NAME5 / Category) to see Qty breakdown</span>`}
        </div>
        ${subChipsHtml}
      </div>
    `;
  }

  // Manager Table Header & Rows
  var attrHeaderThs = activeAttrCols.map(function(av) {
    var isMiss = (av === '(ENTER ATTRIBUTES)');
    return '<th class="' + (isMiss ? 'missing-th' : 'attr-th') + '">' + (isMiss ? '⚠️ ' + escHtml(av) : escHtml(av)) + '</th>';
  }).join('');

  var lyHeaderThs = compareOn
    ? '<th class="ly-th">LY Qty (' + escHtml(lyPeriodKey.replace('FULL_FY::','FY ')) + ')</th><th class="ly-th">LY ' + escHtml(dtMeta.valTitle) + '</th><th class="ly-th">Growth %</th>'
    : '';

  var managerRowsHtml = (mData.managers || []).map(function(m) {
    var lyM = lyMgrMap[String(m.manager || '').trim().toUpperCase()] || { qty: 0, net: 0 };
    var mAttrs = attrByMgr[m.manager] || {};
    var mAttrTds = activeAttrCols.map(function(av) {
      var aq = mAttrs[av] || 0;
      var isMiss = (av === '(ENTER ATTRIBUTES)');
      return '<td class="' + (isMiss ? 'missing-td' : 'attr-td') + '">' + (aq > 0 ? fmtNum(aq) : '<span style="color:#cbd5e1;">-</span>') + '</td>';
    }).join('');

    return `<tr>
      <td><b>${escHtml(m.manager)}</b></td>
      <td class="num">${m.stores}</td>
      ${mAttrTds}
      <td class="num"><b>${fmtNum(m.qty)}</b></td>
      <td class="num" style="color:#0284c7;"><b>${fmtINR(m.net)}</b></td>
      ${compareOn ? `<td class="ly-td">${fmtNum(lyM.qty)}</td><td class="ly-td">${fmtINR(lyM.net)}</td><td class="num">${calcGrowthBadgeHtml(m.net, lyM.net)}</td>` : ''}
      ${rights.showMrpAndDisc ? `<td class="num">${fmtINR(m.mrp)}</td><td class="num" style="color:#dc2626;">${m.discPct}%</td>` : ''}
    </tr>`;
  }).join('') || '<tr><td colspan="40" style="text-align:center;color:#64748b;padding:18px;">No manager data available for this selection.</td></tr>';

  app.innerHTML = `
    <div class="top-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:18px; font-weight:900;">📊 ${escHtml(ACTIVE_LINK.title)}</div>
          <div style="font-size:11.5px; color:#cbd5e1; margin-top:4px;">🕒 Last Live Update: <b>${escHtml(LIVE_PAYLOAD.generatedAtHuman)}</b> ${ACTIVE_LINK.validityLabel ? (' | ⏳ Valid Till: <b>' + escHtml(ACTIVE_LINK.validityLabel) + '</b>') : ''}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <span class="status-pill ${stClass}">${stText}</span>
          <button onclick="manualRefreshClick()" style="background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:800;cursor:pointer;">🔄 Refresh Live</button>
          <span class="timer-pill" title="Auto-refreshes every 30 seconds">⏱️ <span id="liveTimerText">${TIMER_SECONDS}s</span></span>
        </div>
      </div>
      ${gStatus.statusNote ? `<div style="margin-top:8px; font-size:12px; color:#fde68a; font-weight:700;">💬 Note: ${escHtml(gStatus.statusNote)}</div>` : ''}

      <!-- ALLOWED DATA TYPE TABS -->
      <div class="tab-row" style="margin-top:11px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.14);">
        ${allowedDataTypes.map(function(dk) {
          var lbl = (TYPE_META[dk] && TYPE_META[dk].label) || dk;
          return `<button class="dtype-btn ${dk === ACTIVE_DATA_TYPE ? 'active' : ''}" onclick="ACTIVE_DATA_TYPE='${dk}'; ACTIVE_MONTH=''; renderApp();">${lbl}</button>`;
        }).join('')}
      </div>

      <!-- BRAND TABS + YEAR 2 (FY) + MONTH + COMPARE LY (DEFAULT TICKED) + DOWNLOAD -->
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px;">
        <div class="tab-row">
          ${allowedBrands.map(function(b) {
            return `<button class="brand-btn ${b === ACTIVE_BRAND ? 'active' : ''}" onclick="ACTIVE_BRAND='${b}'; ACTIVE_MONTH=''; renderApp();">${escHtml(b)}</button>`;
          }).join('')}
        </div>

        <div class="tab-row">
          ${rights.showYear2 ? `
            <select class="ctrl-select" style="border-color:#f59e0b; background:#fffbeb; color:#92400e;" onchange="ACTIVE_YEAR2=this.value; ACTIVE_MONTH=''; renderApp();">
              <option value="ALL" ${ACTIVE_YEAR2 === 'ALL' ? 'selected' : ''}>📅 Year 2: All FY</option>
              ${availYear2.map(function(y) { return `<option value="${escHtml(y)}" ${y === ACTIVE_YEAR2 ? 'selected' : ''}>📅 FY ${escHtml(y)}</option>`; }).join('')}
            </select>
          ` : ''}

          <select class="ctrl-select" onchange="ACTIVE_MONTH=this.value; renderApp();">
            ${availMonths.map(function(m) {
              return `<option value="${escHtml(m)}" ${m === ACTIVE_MONTH ? 'selected' : ''}>${getPeriodDisplayLabel(m)}</option>`;
            }).join('') || '<option>No Data</option>'}
          </select>

          ${rights.allowCompareLY ? `
            <label class="compare-pill ${COMPARE_LY_ENABLED ? '' : 'off'}" title="Compare with Last Year Same Month (${escHtml(getLastYearPeriodKey(ACTIVE_MONTH))}) & Growth %">
              <input type="checkbox" ${COMPARE_LY_ENABLED ? 'checked' : ''} onchange="COMPARE_LY_ENABLED=this.checked; renderApp();" style="margin:0; width:14px; height:14px; accent-color:#10b981; cursor:pointer;">
              <span>📊 Compare LY</span>
            </label>
          ` : ''}

          ${rights.allowDownload ? `<button onclick="downloadLiveCsv()" style="background:#10b981;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:900;cursor:pointer;">📥 CSV</button>` : ''}
        </div>
      </div>
    </div>

    ${rights.showGrandTotal ? `
      <div class="grand-card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="font-size:15px; font-weight:900;">🏆 ${dtMeta.label} — ${escHtml(ACTIVE_BRAND)} (${gt.stores} Updated Stores${gt.pendingStores > 0 ? ' | ' + gt.pendingStores + ' Pending' : ''})</div>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <span style="background:#10b981; color:#fff; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:900;">${getPeriodDisplayLabel(ACTIVE_MONTH)}</span>
            ${compareOn ? `<span style="background:rgba(255,255,255,0.14); color:#fde68a; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:900;">vs LY: ${escHtml(lyPeriodKey.replace('FULL_FY::','FY ') || '-')}</span>` : ''}
          </div>
        </div>
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="kpi-lbl">Total Qty</div>
            <div class="kpi-val" style="color:#ffffff;">${fmtNum(gt.qty)}</div>
            ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtNum(lyGt.qty)}</span> ${calcGrowthBadgeHtml(gt.qty, lyGt.qty)}</div>` : ''}
          </div>
          <div class="kpi-box">
            <div class="kpi-lbl">${dtMeta.valTitle}</div>
            <div class="kpi-val" style="color:#38bdf8;">${fmtINR(gt.net)}</div>
            ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtINR(lyGt.net)}</span> ${calcGrowthBadgeHtml(gt.net, lyGt.net)}</div>` : ''}
          </div>
          ${rights.showMrpAndDisc ? `
            <div class="kpi-box">
              <div class="kpi-lbl">Total MRP</div>
              <div class="kpi-val" style="color:#fbbf24;">${fmtINR(gt.mrp)}</div>
              ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtINR(lyGt.mrp)}</span> ${calcGrowthBadgeHtml(gt.mrp, lyGt.mrp)}</div>` : ''}
            </div>
            <div class="kpi-box">
              <div class="kpi-lbl">Discount</div>
              <div class="kpi-val" style="color:#fb7185;">${fmtINR(gt.disc)} <span style="font-size:13px;">(${gt.discPct}%)</span></div>
            </div>
          ` : ''}
        </div>
      </div>
    ` : ''}

    ${headerBreakdownBarHtml}

    ${rights.showManagers ? `
      <div class="section-card">
        <div style="font-size:14px; font-weight:900; color:#1e1b4b; margin-bottom:9px;">👨‍💼 MANAGER-WISE SUMMARY (${(mData.managers || []).length})</div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Stores</th>
                ${attrHeaderThs}
                <th class="num">Qty</th>
                <th class="num">${dtMeta.valTitle}</th>
                ${lyHeaderThs}
                ${rights.showMrpAndDisc ? '<th class="num">MRP</th><th class="num">Dis %</th>' : ''}
              </tr>
            </thead>
            <tbody>${managerRowsHtml}</tbody>
          </table>
        </div>
      </div>
    ` : ''}

    ${rights.showStores ? `
      <div class="section-card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:9px;">
          <div style="font-size:14px; font-weight:900; color:#0f172a;">🏪 INDIVIDUAL STORE DATA <span id="liveStoreCountBadge">(${(mData.stores || []).length} Stores)</span></div>
          <input type="text" value="${escHtml(SEARCH_Q)}" oninput="onStoreSearchTyped(this.value)" placeholder="🔍 Search Party or Manager..." style="padding:6px 10px; border:1.5px solid #cbd5e1; border-radius:7px; font-size:12px; width:240px;">
        </div>
        <div id="liveStoreScrollWrap" class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Party / Store Name</th>
                <th>Manager</th>
                ${attrHeaderThs}
                <th class="num">Qty</th>
                <th class="num">${dtMeta.valTitle}</th>
                ${lyHeaderThs}
                ${rights.showMrpAndDisc ? '<th class="num">MRP</th><th class="num">Dis %</th>' : ''}
              </tr>
            </thead>
            <tbody id="liveStoreTbody"></tbody>
          </table>
        </div>
      </div>
    ` : ''}

    ${rights.showPending ? `
      <div class="section-card" style="border-color:#fca5a5; background:#fffafa;">
        <div style="font-size:14px; font-weight:900; color:#b91c1c; margin-bottom:8px;">⏳ PENDING STORES (${(mData.pending || []).length} Stores Not Uploaded Yet)</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px; max-height:200px; overflow-y:auto;">
          ${(mData.pending || []).map(function(p) {
            return `<span style="background:#fee2e2; color:#991b1b; border:1px solid #fecaca; padding:4px 9px; border-radius:7px; font-size:11px; font-weight:800;">• ${escHtml(p.party)} <small style="color:#475569;">(${escHtml(p.manager)})</small></span>`;
          }).join('') || '<span style="color:#059669; font-weight:900; font-size:12.5px;">🎉 All Stores Updated! Zero Pending!</span>'}
        </div>
      </div>
    ` : ''}
  `;

  if (rights.showStores) {
    updateStoreTableBodyOnly();
  }
}

fetchLiveReportData(false);
start30SecCountdownLoop();
</script>
</body>
</html>
