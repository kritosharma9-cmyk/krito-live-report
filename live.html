<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRITO — Live Sales & Operations Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html, body {
    margin: 0;
    background: #f1f5f9;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-optical-sizing: auto;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    line-height: 1.45;
    overflow-x: hidden;
  }
  body { padding: 14px; }
  .wrap { width: 100%; max-width: 1380px; margin: 0 auto; display: flex; flex-direction: column; gap: 13px; }

  .top-card {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 12px 30px rgba(15,23,42,0.16);
  }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 0.01em; }
  .st-completed { background: #10b981; color: #ffffff; }
  .st-updating  { background: #f59e0b; color: #0f172a; }
  .st-partial   { background: #f97316; color: #ffffff; }
  .timer-pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(16,185,129,0.16); border: 1px solid #34d399; color: #6ee7b7; padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; }

  .tab-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dtype-btn { padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); color: #e2e8f0; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .dtype-btn.active { background: #10b981; color: #ffffff; border-color: #34d399; box-shadow: 0 4px 12px rgba(16,185,129,0.32); }
  .brand-btn { padding: 7px 15px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .brand-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.32); }
  .ctrl-select { padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; cursor: pointer; }
  .compare-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; user-select: none; border: 1.5px solid #34d399; background: rgba(16,185,129,0.16); color: #ecfdf5; }
  .compare-pill.off { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); color: #cbd5e1; }

  .grand-card { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #fff; border-radius: 16px; padding: 17px 20px; border: 1.5px solid #4f46e5; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-top: 12px; }
  .kpi-box { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 14px; }
  .kpi-lbl { font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-val { font-size: 21px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 11.5px; font-weight: 600; margin-top: 4px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .section-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 18px; box-shadow: 0 4px 12px rgba(15,23,42,0.04); width: 100%; max-width: 100%; overflow: hidden; }
  .attr-bar { background: #f8f6ff; border: 1.5px solid #c4b5fd; border-radius: 14px; padding: 13px 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 100%; }

  /* Strict Symmetrical CSS Grids (Prevents Horizontal Width Stretching!) */
  .multi-hdr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 7px;
    width: 100%;
    padding-top: 6px;
    border-top: 1px dashed #ddd6fe;
  }
  .attr-chips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 7px;
    max-height: 155px;
    overflow-y: auto;
    padding: 2px;
    width: 100%;
  }
  .attr-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    min-width: 0;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid #c4b5fd;
    background: #ffffff;
    color: #3b0764;
    user-select: none;
  }
  .attr-chip.checked { background: #ede9fe; border-color: #7c3aed; color: #4c1d95; }
  .attr-chip.missing { background: #fef2f2; border-color: #ef4444; color: #b91c1c; }

  .table-scroll { width: 100%; max-width: 100%; overflow: auto; max-height: 500px; border: 1px solid #e2e8f0; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { background: #f8fafc; color: #334155; padding: 9px 11px; text-align: left; border-bottom: 2px solid #cbd5e1; font-weight: 700; position: sticky; top: 0; z-index: 5; white-space: nowrap; }
  th.attr-compact-th { background: #ede9fe; color: #4c1d95; border-left: 1px solid #ddd6fe; border-right: 1px solid #ddd6fe; text-align: center; }
  th.ly-th { background: #ecfdf5; color: #065f46; border-left: 1px solid #a7f3d0; text-align: right; }
  td { padding: 8px 11px; border-bottom: 1px solid #e2e8f0; font-weight: 500; white-space: nowrap; color: #0f172a; }
  td.ly-td { text-align: right; color: #475569; background: #f8fafc; border-left: 1px solid #e2e8f0; font-weight: 600; }
  .num { text-align: right; }

  .plus-hdr-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    background: #6d28d9; color: #ffffff; border: none; border-radius: 6px;
    padding: 3px 8px; margin-left: 6px; font-size: 11px; font-weight: 800;
    cursor: pointer; transition: 0.15s; box-shadow: 0 2px 5px rgba(109,40,217,0.28);
  }
  .plus-hdr-btn:hover { background: #5b21b6; }
  .plus-cell-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f5f3ff; color: #4c1d95; border: 1.5px solid #a78bfa;
    padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .plus-cell-btn:hover { background: #ede9fe; border-color: #7c3aed; }
  .plus-cell-btn.open { background: #6d28d9; color: #ffffff; border-color: #5b21b6; }
  .plus-icon-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px;
    background: #7c3aed; color: #ffffff; font-size: 13px; font-weight: 800; line-height: 1;
  }
  .plus-cell-btn.open .plus-icon-badge { background: #ffffff; color: #5b21b6; }

  .expand-drawer-row td {
    background: #faf5ff !important;
    padding: 10px 12px !important;
    border-bottom: 2px solid #c4b5fd !important;
    white-space: normal !important;
  }
  .drawer-box {
    position: sticky;
    left: 0;
    width: 100%;
    max-width: calc(100vw - 68px);
    background: #ffffff;
    border: 1.5px solid #c4b5fd;
    border-radius: 10px;
    padding: 10px 13px;
    box-shadow: 0 4px 12px rgba(109,40,217,0.06);
  }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    padding-bottom: 8px; margin-bottom: 9px; border-bottom: 1px solid #ede9fe;
  }
  /* Symmetrical Responsive Grid inside Expanded [+] Drawer */
  .drawer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 8px;
    width: 100%;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-width: 0;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #1e293b;
  }
  .drawer-item.missing {
    background: #fef2f2; border-color: #fca5a5; color: #b91c1c;
  }
  .drawer-item-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  .drawer-qty {
    background: #4c1d95; color: #ffffff; padding: 2px 7px; border-radius: 5px;
    font-size: 11.5px; font-weight: 700; flex-shrink: 0;
  }
  .drawer-item.missing .drawer-qty { background: #dc2626; }

  .pending-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 7px;
    max-height: 210px;
    overflow-y: auto;
    width: 100%;
  }

  .gr-pos { background: #dcfce7; color: #15803d; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
  .gr-neg { background: #fee2e2; color: #b91c1c; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
  .gr-new { background: #e0f2fe; color: #0369a1; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
  .gr-flat { background: #f1f5f9; color: #64748b; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-block; }
  .lock-screen { max-width: 420px; margin: 70px auto; background: #fff; border-radius: 16px; padding: 28px; text-align: center; border: 2px solid #cbd5e1; box-shadow: 0 18px 40px rgba(15,23,42,0.12); }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="lock-screen">⏳ Loading Live KRITO Report...</div>
</div>

<script>
var TYPE_META = {
  TERTIARY:     { label: '🔥 Tertiary Data', valTitle: 'Tertiary Net Value' },
  STOCK:        { label: '📦 Stock Data',    valTitle: 'Stock Value' },
  SELL_IN:      { label: '📥 Sell In',       valTitle: 'Sell-In Value' },
  SELL_OUT:     { label: '📤 Sell Out',      valTitle: 'Sell-Out Value' },
  BRAND_ORDER:  { label: '📝 Brand Order',   valTitle: 'Order Value' },
  PAYMENT_COLL: { label: '💳 Payment Coll',  valTitle: 'Collection Value' },
  TARGET_SHEET: { label: '🎯 Target Sheet',  valTitle: 'Target Value' }
};

var MON_NUM = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };

var LIVE_PAYLOAD = null;
var ACTIVE_LINK = null;
var ACTIVE_DATA_TYPE = '';
var ACTIVE_BRAND = '';
var ACTIVE_YEAR2 = 'ALL';
var ACTIVE_MONTH = '';
var COMPARE_LY_ENABLED = true;

var ACTIVE_HEADERS_LIST = [];
var FOCUSED_CHIP_HEADER = '';
var HEADER_DEFAULT_INIT = false;
var UNCHECKED_ATTR_VALS = {};
var ATTR_VAL_SEARCH = '';

var EXPANDED_MGR_KEYS = new Set();
var EXPANDED_STORE_KEYS = new Set();

var PIN_UNLOCKED = false;
var SEARCH_Q = '';
var SEARCH_TIMER = null;

var TIMER_SECONDS = 30;
var TIMER_INTERVAL = null;
var IS_FETCHING_NOW = false;

function fmtINR(n) { return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s) { return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function getQueryId() {
  return new URLSearchParams(window.location.search).get('id') || '';
}

function getLastYearPeriodKey(periodKey) {
  if (!periodKey) return '';
  if (periodKey.startsWith('FULL_FY::')) {
    var fm = periodKey.slice(9).match(/^(\d{4})-(\d{2})$/);
    if (fm) {
      var prevStart = parseInt(fm[1], 10) - 1;
      return 'FULL_FY::' + prevStart + '-' + String((prevStart + 1) % 100).padStart(2, '0');
    }
    return '';
  }
  var mm = periodKey.match(/^([A-Z]{3})-(\d{4})$/);
  return mm ? (mm[1] + '-' + (parseInt(mm[2], 10) - 1)) : '';
}

function getPeriodDisplayLabel(periodKey) {
  if (!periodKey) return '-';
  if (periodKey.startsWith('FULL_FY::')) return '📅 FULL FY (' + periodKey.slice(9) + ')';
  return '🗓️ ' + periodKey;
}

function calcGrowthBadgeHtml(cyVal, lyVal) {
  var cy = Number(cyVal) || 0, ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return '<span class="gr-new">★ NEW</span>';
  if (ly <= 0 && cy <= 0) return '<span class="gr-flat">0.0%</span>';
  var pct = ((cy - ly) / ly) * 100;
  return '<span class="' + (pct >= 0 ? 'gr-pos' : 'gr-neg') + '">' + (pct >= 0 ? '▲ +' : '▼ ') + pct.toFixed(1) + '%</span>';
}

function calcGrowthPlainText(cyVal, lyVal) {
  var cy = Number(cyVal) || 0, ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return 'NEW';
  if (ly <= 0 && cy <= 0) return '0.0%';
  var pct = ((cy - ly) / ly) * 100;
  return (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function sortMonthKeysDesc(keysArr) {
  return keysArr.slice().sort(function(a, b) {
    var aIsFy = a.startsWith('FULL_FY::'), bIsFy = b.startsWith('FULL_FY::');
    if (aIsFy && !bIsFy) return 1;
    if (!aIsFy && bIsFy) return -1;
    if (aIsFy && bIsFy) return b.localeCompare(a);
    var ma = a.match(/^([A-Z]{3})-(\d{4})$/), mb = b.match(/^([A-Z]{3})-(\d{4})$/);
    if (ma && mb) {
      return (parseInt(mb[2], 10) * 100 + (MON_NUM[mb[1]] || 0)) - (parseInt(ma[2], 10) * 100 + (MON_NUM[ma[1]] || 0));
    }
    return b.localeCompare(a);
  });
}

function start30SecCountdownLoop() {
  if (TIMER_INTERVAL) clearInterval(TIMER_INTERVAL);
  TIMER_INTERVAL = setInterval(function() {
    if (IS_FETCHING_NOW) return;
    TIMER_SECONDS--;
    var el = document.getElementById('liveTimerText');
    if (TIMER_SECONDS <= 0) {
      TIMER_SECONDS = 30;
      if (el) el.textContent = '🔄 Syncing...';
      fetchLiveReportData(true);
    } else if (el) {
      el.textContent = TIMER_SECONDS + 's';
    }
  }, 1000);
}

function manualRefreshClick() {
  TIMER_SECONDS = 30;
  var el = document.getElementById('liveTimerText');
  if (el) el.textContent = '🔄 Syncing...';
  fetchLiveReportData(false);
}

async function fetchLiveReportData(isAutoTick) {
  if (IS_FETCHING_NOW) return;
  IS_FETCHING_NOW = true;
  try {
    var res = await fetch('./live_data.json?_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Live data file not found yet.');
    var freshPayload = await res.json();
    var prevIso = LIVE_PAYLOAD ? LIVE_PAYLOAD.generatedAtIso : '';
    var changed = !LIVE_PAYLOAD || (freshPayload.generatedAtIso !== prevIso);
    LIVE_PAYLOAD = freshPayload;

    if (!isAutoTick || changed) {
      var winY = window.scrollY || 0;
      var tblEl = document.getElementById('liveStoreScrollWrap');
      var tblY = tblEl ? tblEl.scrollTop : 0;
      renderApp();
      window.scrollTo(0, winY);
      var newTblEl = document.getElementById('liveStoreScrollWrap');
      if (newTblEl) newTblEl.scrollTop = tblY;
    }
  } catch (err) {
    if (!LIVE_PAYLOAD) {
      document.getElementById('app').innerHTML = '<div class="lock-screen"><h3>⚠️ Unable to Load Live Data</h3><p style="color:#64748b;font-size:13px;">' + escHtml(err.message) + '</p><button onclick="manualRefreshClick()" style="background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-weight:700;cursor:pointer;">🔄 Retry</button></div>';
    }
  } finally {
    IS_FETCHING_NOW = false;
    TIMER_SECONDS = 30;
    var el = document.getElementById('liveTimerText');
    if (el) el.textContent = '30s';
  }
}

function verifyPin() {
  var inp = document.getElementById('viewerPinInp')?.value.trim();
  if (inp === String(ACTIVE_LINK.pin)) {
    PIN_UNLOCKED = true;
    renderApp();
  } else {
    alert('❌ Wrong Access PIN!');
  }
}

function getActiveDatasetBucket() {
  if (!LIVE_PAYLOAD) return {};
  if (LIVE_PAYLOAD.datasets && LIVE_PAYLOAD.datasets[ACTIVE_DATA_TYPE]) return LIVE_PAYLOAD.datasets[ACTIVE_DATA_TYPE];
  if (ACTIVE_DATA_TYPE === 'TERTIARY' && LIVE_PAYLOAD.brands) return LIVE_PAYLOAD.brands;
  return {};
}

function getAdminPermittedSubValues(mData, headerName) {
  var aObj = (mData && mData.attributes && mData.attributes[headerName]) ? mData.attributes[headerName] : null;
  if (!aObj || !Array.isArray(aObj.values)) return [];
  var adminAllowedMap = ACTIVE_LINK && ACTIVE_LINK.allowedHeaderValues;
  if (adminAllowedMap && Array.isArray(adminAllowedMap[headerName])) {
    var allowSet = new Set(adminAllowedMap[headerName]);
    return aObj.values.filter(function(v) { return allowSet.has(v); });
  }
  return aObj.values;
}

function getSelectedSubValuesForHeader(mData, headerName) {
  var permitted = getAdminPermittedSubValues(mData, headerName);
  var unchk = UNCHECKED_ATTR_VALS[headerName] || new Set();
  return permitted.filter(function(v) { return !unchk.has(v); });
}

function onSelectPrimaryHeader(val) {
  if (!val) {
    ACTIVE_HEADERS_LIST = [];
    FOCUSED_CHIP_HEADER = '';
  } else {
    if (!ACTIVE_HEADERS_LIST.includes(val)) ACTIVE_HEADERS_LIST = [val];
    FOCUSED_CHIP_HEADER = val;
  }
  ATTR_VAL_SEARCH = '';
  renderApp();
}

function toggleAdditionalHeaderColumn(hName, checked) {
  if (checked) {
    if (!ACTIVE_HEADERS_LIST.includes(hName)) ACTIVE_HEADERS_LIST.push(hName);
    FOCUSED_CHIP_HEADER = hName;
  } else {
    ACTIVE_HEADERS_LIST = ACTIVE_HEADERS_LIST.filter(function(x) { return x !== hName; });
    if (FOCUSED_CHIP_HEADER === hName) FOCUSED_CHIP_HEADER = ACTIVE_HEADERS_LIST[0] || '';
  }
  renderApp();
}

function toggleAttrSubVal(headerName, valName, checked) {
  if (!UNCHECKED_ATTR_VALS[headerName]) UNCHECKED_ATTR_VALS[headerName] = new Set();
  if (checked) UNCHECKED_ATTR_VALS[headerName].delete(valName);
  else UNCHECKED_ATTR_VALS[headerName].add(valName);
  renderApp();
}

function setAllAttrSubVals(headerName, shouldSelectAll) {
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH];
  var permitted = getAdminPermittedSubValues(mData, headerName);
  UNCHECKED_ATTR_VALS[headerName] = shouldSelectAll ? new Set() : new Set(permitted);
  renderApp();
}

function showOnlyMissingAttrVal(headerName) {
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH];
  var permitted = getAdminPermittedSubValues(mData, headerName);
  UNCHECKED_ATTR_VALS[headerName] = new Set(permitted.filter(function(v) { return v !== '(ENTER ATTRIBUTES)'; }));
  renderApp();
}

function toggleMgrExpand(hName, mgrName) {
  var key = hName + '||' + mgrName;
  if (EXPANDED_MGR_KEYS.has(key)) EXPANDED_MGR_KEYS.delete(key);
  else EXPANDED_MGR_KEYS.add(key);
  renderApp();
}

function toggleAllMgrExpandForHeader(hName) {
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH] || { managers: [] };
  var mgrs = mData.managers || [];
  var allOpen = mgrs.length > 0 && mgrs.every(function(m) { return EXPANDED_MGR_KEYS.has(hName + '||' + m.manager); });
  mgrs.forEach(function(m) {
    var k = hName + '||' + m.manager;
    if (allOpen) EXPANDED_MGR_KEYS.delete(k);
    else EXPANDED_MGR_KEYS.add(k);
  });
  renderApp();
}

function toggleStoreExpand(hName, partyName) {
  var key = hName + '||' + partyName;
  if (EXPANDED_STORE_KEYS.has(key)) EXPANDED_STORE_KEYS.delete(key);
  else EXPANDED_STORE_KEYS.add(key);
  updateStoreTableBodyOnly();
}

function toggleAllStoreExpandForHeader(hName) {
  var bucket = getActiveDatasetBucket();
  var mData = (bucket[ACTIVE_BRAND] || {})[ACTIVE_MONTH] || { stores: [] };
  var filtered = (mData.stores || []).filter(function(s) {
    return !SEARCH_Q || s.party.toLowerCase().includes(SEARCH_Q) || s.manager.toLowerCase().includes(SEARCH_Q);
  });
  var allOpen = filtered.length > 0 && filtered.every(function(s) { return EXPANDED_STORE_KEYS.has(hName + '||' + s.party); });
  filtered.forEach(function(s) {
    var k = hName + '||' + s.party;
    if (allOpen) EXPANDED_STORE_KEYS.delete(k);
    else EXPANDED_STORE_KEYS.add(k);
  });
  renderApp();

    '</div>';
  }).filter(Boolean).join('') || '<span style="font-size:12px; color:#64748b; font-weight:600;">Is selection mein koi Qty nahi hai.</span>';

    '<div class="drawer-head">' +

      var sumQty = 0, nonZeroCount = 0;

      compactHeaderTds += '<td style="text-align:center; border-left:1px solid #ede9fe; border-right:1px solid #ede9fe; background:#fcfaff;">' +
        '<button type="button" class="plus-cell-btn ' + (isOpen ? 'open' : '') + '" onclick="' + clickJs + '" title="Click to view ' + escHtml(hName) + ' breakdown">' +
          '<span class="plus-icon-badge">' + (isOpen ? '−' : '+') + '</span>' +
          '<span>' + fmtNum(sumQty) + ' Qty</span>' +
          '<span style="font-size:10.5px; opacity:0.8;">(' + nonZeroCount + ')</span>' +

      '</td>';

      if (isOpen) {
        var titleLeft = '<span>🏢 <b>' + escHtml(s.party) + '</b></span>' +

        expandedDrawersHtml.push(buildCompactDrawerHtml(titleLeft, hName, subVals, sAttrMap, sumQty, clickJs));
      }
    }

    var lyTds = compareOn
      ? '<td class="ly-td">' + fmtNum(lyS.qty) + '</td><td class="ly-td">' + fmtINR(lyS.net) + '</td><td class="num">' + calcGrowthBadgeHtml(s.net, lyS.net) + '</td>'

        '<td>' + escHtml(s.manager) + '</td>' +

function downloadLiveCsv() {
  var bucket = getActiveDatasetBucket();
  var brandPeriods = bucket[ACTIVE_BRAND] || {};
  var mData = brandPeriods[ACTIVE_MONTH];
  if (!mData || !mData.stores) return;

  var r = ACTIVE_LINK.rights || {};
  var compareOn = !!(r.allowCompareLY && COMPARE_LY_ENABLED);
  var lyKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyKey && brandPeriods[lyKey]) ? brandPeriods[lyKey] : null;
  var lyStoreMap = {};
  if (lyData && Array.isArray(lyData.stores)) {
    lyData.stores.forEach(function(s) { lyStoreMap[String(s.party || '').trim().toUpperCase()] = s; });
  }

  var activeHeaders = r.showHeaderBreakdown ? ACTIVE_HEADERS_LIST : [];
  var flatAttrSpecs = [];
  activeHeaders.forEach(function(hName) {
    getSelectedSubValuesForHeader(mData, hName).forEach(function(v) {
      flatAttrSpecs.push({ hName: hName, val: v, colTitle: activeHeaders.length > 1 ? (hName + ': ' + v) : v });
    });
  });

  var vTitle = (TYPE_META[ACTIVE_DATA_TYPE] && TYPE_META[ACTIVE_DATA_TYPE].valTitle) || 'Net Value';
  var hdr = ['S.No', 'Party Name', 'Manager'].concat(flatAttrSpecs.map(function(x) { return x.colTitle; })).concat(['Qty', vTitle]);
  if (compareOn) hdr = hdr.concat(['LY Qty', 'LY ' + vTitle, 'Growth %']);
  if (r.showMrpAndDisc) hdr = hdr.concat(['MRP Value', 'Discount', 'Disc %']);

  var lines = [hdr.map(function(h) { return '"' + String(h).replace(/"/g,'""') + '"'; }).join(',')];
  mData.stores.forEach(function(s, i) {
    var pKey = String(s.party || '').trim().toUpperCase();
    var lyS = lyStoreMap[pKey] || { qty: 0, net: 0 };
    var row = [i + 1, '"' + s.party.replace(/"/g,'""') + '"', '"' + s.manager.replace(/"/g,'""') + '"'];
    flatAttrSpecs.forEach(function(sp) {
      var byS = (mData.attributes && mData.attributes[sp.hName]) ? (mData.attributes[sp.hName].byStore || {}) : {};
      var mp = byS[pKey] || byS[s.party] || {};
      row.push(mp[sp.val] || 0);
    });
    row.push(s.qty, s.net);
    if (compareOn) row.push(lyS.qty, lyS.net, '"' + calcGrowthPlainText(s.net, lyS.net) + '"');
    if (r.showMrpAndDisc) row.push(s.mrp, s.disc, s.discPct + '%');
    lines.push(row.join(','));
  });

  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ACTIVE_DATA_TYPE + '_' + ACTIVE_BRAND + '_' + ACTIVE_MONTH.replace(/:/g,'_') + '_Live.csv';
  a.click();
}

  var managerRowsHtml = (mData.managers || []).map(function(m) {
    var lyM = lyMgrMap[String(m.manager || '').trim().toUpperCase()] || { qty: 0, net: 0 };
    var compactTds = '';
    var drawersHtml = [];

    activeHeaders.forEach(function(hName) {
      var subVals = getSelectedSubValuesForHeader(mData, hName);
      var byMgr = (mData.attributes && mData.attributes[hName]) ? (mData.attributes[hName].byManager || {}) : {};
      var mAttrMap = byMgr[m.manager] || {};

      var sumQty = 0, nonZeroCnt = 0;
      subVals.forEach(function(sv) {
        var qv = Number(mAttrMap[sv] || 0);
        if (qv > 0) { sumQty += qv; nonZeroCnt++; }
      });

      var expKey = hName + '||' + m.manager;
      var isOpen = EXPANDED_MGR_KEYS.has(expKey);
      var clickJs = "toggleMgrExpand('" + escJs(hName) + "','" + escJs(m.manager) + "')";

      compactTds += '<td style="text-align:center; border-left:1px solid #ede9fe; border-right:1px solid #ede9fe; background:#fcfaff;">' +
        '<button type="button" class="plus-cell-btn ' + (isOpen ? 'open' : '') + '" onclick="' + clickJs + '" title="Click + to open ' + escHtml(hName) + ' details for ' + escHtml(m.manager) + '">' +
          '<span class="plus-icon-badge">' + (isOpen ? '−' : '+') + '</span>' +
          '<span>' + fmtNum(sumQty) + ' Qty</span>' +
          '<span style="font-size:10.5px; opacity:0.8;">(' + nonZeroCnt + ')</span>' +
        '</button>' +
      '</td>';

      if (isOpen) {
        var titleLeft = '<span>👨‍💼 Manager: <b>' + escHtml(m.manager) + '</b></span>' +
                        '<span style="color:#475569;">|</span>' +
                        '<span style="font-size:11.5px; color:#475569;">Stores: <b>' + m.stores + '</b></span>';
        drawersHtml.push(buildCompactDrawerHtml(titleLeft, hName, subVals, mAttrMap, sumQty, clickJs));
      }
    });

    var mainRow = `<tr>
      <td><b>${escHtml(m.manager)}</b></td>
      <td class="num">${m.stores}</td>
      ${compactTds}
      <td class="num"><b>${fmtNum(m.qty)}</b></td>
      <td class="num" style="color:#0284c7;"><b>${fmtINR(m.net)}</b></td>
      ${compareOn ? `<td class="ly-td">${fmtNum(lyM.qty)}</td><td class="ly-td">${fmtINR(lyM.net)}</td><td class="num">${calcGrowthBadgeHtml(m.net, lyM.net)}</td>` : ''}
      ${rights.showMrpAndDisc ? `<td class="num">${fmtINR(m.mrp)}</td><td class="num" style="color:#dc2626; font-weight:700;">${m.discPct}%</td>` : ''}
    </tr>`;

    if (drawersHtml.length > 0) {
      return mainRow + '<tr class="expand-drawer-row"><td colspan="' + mgrTotalCols + '"><div style="display:flex; flex-direction:column; gap:8px;">' + drawersHtml.join('') + '</div></td></tr>';
    }
    return mainRow;
  }).join('') || '<tr><td colspan="' + mgrTotalCols + '" style="text-align:center;color:#64748b;padding:18px;">No manager data available for this selection.</td></tr>';

  app.innerHTML = `
    <div class="top-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:19px; font-weight:800; letter-spacing:-0.02em;">📊 ${escHtml(ACTIVE_LINK.title)}</div>
          <div style="font-size:12px; color:#cbd5e1; margin-top:4px; font-weight:500;">🕒 Last Live Update: <b style="color:#ffffff;">${escHtml(LIVE_PAYLOAD.generatedAtHuman)}</b> ${ACTIVE_LINK.validityLabel ? (' | ⏳ Valid Till: <b style="color:#ffffff;">' + escHtml(ACTIVE_LINK.validityLabel) + '</b>') : ''}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <span class="status-pill ${stClass}">${stText}</span>
          <button onclick="manualRefreshClick()" style="background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">🔄 Refresh Live</button>
          <span class="timer-pill" title="Auto-refreshes every 30 seconds">⏱️ <span id="liveTimerText">${TIMER_SECONDS}s</span></span>
        </div>
      </div>
      ${gStatus.statusNote ? `<div style="margin-top:8px; font-size:12.5px; color:#fde68a; font-weight:600;">💬 Note: ${escHtml(gStatus.statusNote)}</div>` : ''}

      <div class="tab-row" style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.14);">
        ${allowedDataTypes.map(function(dk) {
          var lbl = (TYPE_META[dk] && TYPE_META[dk].label) || dk;
          return `<button class="dtype-btn ${dk === ACTIVE_DATA_TYPE ? 'active' : ''}" onclick="ACTIVE_DATA_TYPE='${dk}'; ACTIVE_MONTH=''; renderApp();">${lbl}</button>`;
        }).join('')}
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px;">
        <div class="tab-row">
          ${allowedBrands.map(function(b) {
            return `<button class="brand-btn ${b === ACTIVE_BRAND ? 'active' : ''}" onclick="ACTIVE_BRAND='${b}'; ACTIVE_MONTH=''; renderApp();">${escHtml(b)}</button>`;
          }).join('')}
        </div>

        <div class="tab-row">
          ${rights.showYear2 ? `
            <select class="ctrl-select" style="border-color:#f59e0b; background:#fffbeb; color:#92400e;" onchange="ACTIVE_YEAR2=this.value; ACTIVE_MONTH=''; renderApp();">
              <option value="ALL" ${ACTIVE_YEAR2 === 'ALL' ? 'selected' : ''}>📅 Year 2: All FY</option>
              ${availYear2.map(function(y) { return `<option value="${escHtml(y)}" ${y === ACTIVE_YEAR2 ? 'selected' : ''}>📅 FY ${escHtml(y)}</option>`; }).join('')}
            </select>
          ` : ''}

          <select class="ctrl-select" onchange="ACTIVE_MONTH=this.value; renderApp();">
            ${availMonths.map(function(m) {
              return `<option value="${escHtml(m)}" ${m === ACTIVE_MONTH ? 'selected' : ''}>${getPeriodDisplayLabel(m)}</option>`;
            }).join('') || '<option>No Data</option>'}
          </select>

          ${rights.allowCompareLY ? `
            <label class="compare-pill ${COMPARE_LY_ENABLED ? '' : 'off'}" title="Compare with Last Year Same Month (${escHtml(getLastYearPeriodKey(ACTIVE_MONTH))}) & Growth %">
              <input type="checkbox" ${COMPARE_LY_ENABLED ? 'checked' : ''} onchange="COMPARE_LY_ENABLED=this.checked; renderApp();" style="margin:0; width:14px; height:14px; accent-color:#10b981; cursor:pointer;">
              <span>📊 Compare LY</span>
            </label>
          ` : ''}

          ${rights.allowDownload ? `<button onclick="downloadLiveCsv()" style="background:#10b981;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">📥 CSV</button>` : ''}
        </div>
      </div>
    </div>

    ${rights.showGrandTotal ? `
      <div class="grand-card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="font-size:15.5px; font-weight:800; letter-spacing:-0.01em;">🏆 ${dtMeta.label} — ${escHtml(ACTIVE_BRAND)} (${gt.stores} Updated Stores${gt.pendingStores > 0 ? ' | ' + gt.pendingStores + ' Pending' : ''})</div>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <span style="background:#10b981; color:#fff; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:700;">${getPeriodDisplayLabel(ACTIVE_MONTH)}</span>
            ${compareOn ? `<span style="background:rgba(255,255,255,0.14); color:#fde68a; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:700;">vs LY: ${escHtml(lyPeriodKey.replace('FULL_FY::','FY ') || '-')}</span>` : ''}
          </div>
        </div>
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="kpi-lbl">Total Qty</div>
            <div class="kpi-val" style="color:#ffffff;">${fmtNum(gt.qty)}</div>
            ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtNum(lyGt.qty)}</span> ${calcGrowthBadgeHtml(gt.qty, lyGt.qty)}</div>` : ''}
          </div>
          <div class="kpi-box">
            <div class="kpi-lbl">${dtMeta.valTitle}</div>
            <div class="kpi-val" style="color:#38bdf8;">${fmtINR(gt.net)}</div>
            ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtINR(lyGt.net)}</span> ${calcGrowthBadgeHtml(gt.net, lyGt.net)}</div>` : ''}
          </div>
          ${rights.showMrpAndDisc ? `
            <div class="kpi-box">
              <div class="kpi-lbl">Total MRP</div>
              <div class="kpi-val" style="color:#fbbf24;">${fmtINR(gt.mrp)}</div>
              ${compareOn ? `<div class="kpi-sub"><span>LY: ${fmtINR(lyGt.mrp)}</span> ${calcGrowthBadgeHtml(gt.mrp, lyGt.mrp)}</div>` : ''}
            </div>
            <div class="kpi-box">
              <div class="kpi-lbl">Discount</div>
              <div class="kpi-val" style="color:#fb7185;">${fmtINR(gt.disc)} <span style="font-size:13.5px; font-weight:700;">(${gt.discPct}%)</span></div>
            </div>
          ` : ''}
        </div>
      </div>
    ` : ''}

    ${headerBreakdownBarHtml}

    ${rights.showManagers ? `
      <div class="section-card">
        <div style="font-size:14.5px; font-weight:800; color:#1e1b4b; margin-bottom:10px; letter-spacing:-0.01em;">👨‍💼 MANAGER-WISE SUMMARY (${(mData.managers || []).length})</div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Stores</th>
                ${mgrCompactThs}
                <th class="num">Qty</th>
                <th class="num">${dtMeta.valTitle}</th>
                ${lyHeaderThs}
                ${rights.showMrpAndDisc ? '<th class="num">MRP</th><th class="num">Dis %</th>' : ''}
              </tr>
            </thead>
            <tbody>${managerRowsHtml}</tbody>
          </table>
        </div>
      </div>
    ` : ''}

    ${rights.showStores ? `
      <div class="section-card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
          <div style="font-size:14.5px; font-weight:800; color:#0f172a; letter-spacing:-0.01em;">🏪 INDIVIDUAL STORE DATA <span id="liveStoreCountBadge">(${(mData.stores || []).length} Stores)</span></div>
          <input type="text" value="${escHtml(SEARCH_Q)}" oninput="onStoreSearchTyped(this.value)" placeholder="🔍 Search Party or Manager..." style="padding:7px 11px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:12.5px; font-weight:500; width:250px; max-width:100%;">
        </div>
        <div id="liveStoreScrollWrap" class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Party / Store Name</th>
                <th>Manager</th>
                ${storeCompactThs}
                <th class="num">Qty</th>
                <th class="num">${dtMeta.valTitle}</th>
                ${lyHeaderThs}
                ${rights.showMrpAndDisc ? '<th class="num">MRP</th><th class="num">Dis %</th>' : ''}
              </tr>
            </thead>
            <tbody id="liveStoreTbody"></tbody>
          </table>
        </div>
      </div>
    ` : ''}

    ${rights.showPending ? `
      <div class="section-card" style="border-color:#fca5a5; background:#fffafa;">
        <div style="font-size:14px; font-weight:800; color:#b91c1c; margin-bottom:8px;">⏳ PENDING STORES (${(mData.pending || []).length} Stores Not Uploaded Yet)</div>
        <div class="pending-grid">
          ${(mData.pending || []).map(function(p) {
            return `<span style="background:#fee2e2; color:#991b1b; border:1px solid #fecaca; padding:5px 10px; border-radius:7px; font-size:11.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escHtml(p.party)} (${escHtml(p.manager)})">• ${escHtml(p.party)} <small style="color:#475569; font-weight:600;">(${escHtml(p.manager)})</small></span>`;
          }).join('') || '<span style="color:#059669; font-weight:700; font-size:12.5px;">🎉 All Stores Updated! Zero Pending!</span>'}
        </div>
      </div>
    ` : ''}
  `;

  if (rights.showStores) {
    updateStoreTableBodyOnly();
  }
}

fetchLiveReportData(false);
start30SecCountdownLoop();
</script>
</body>
</html>
