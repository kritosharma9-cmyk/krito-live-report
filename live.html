<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRITO — Live Sales & Operations Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html, body {
    margin: 0;
    background: #f1f5f9;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-optical-sizing: auto;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    line-height: 1.45;
    overflow-x: hidden;
  }
  body { padding: 14px; }
  .wrap { width: 100%; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 13px; }

  .top-card {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    border-radius: 16px;
    padding: 15px 20px;
    box-shadow: 0 12px 30px rgba(15,23,42,0.16);
  }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 0.01em; }
  .st-completed { background: #10b981; color: #ffffff; }
  .st-updating  { background: #f59e0b; color: #0f172a; }
  .st-partial   { background: #f97316; color: #ffffff; }
  .timer-pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(16,185,129,0.16); border: 1px solid #34d399; color: #6ee7b7; padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; }

  /* Point 5: View Mode Toggle Switch inside Top-Right Red Box Area */
  .view-switch-bar {
    display: inline-flex;
    align-items: center;
    background: rgba(255,255,255,0.09);
    border: 1.5px solid rgba(129,140,248,0.55);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
  }
  .view-switch-btn {
    border: none;
    background: transparent;
    color: #cbd5e1;
    padding: 5px 12px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .view-switch-btn.active {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #ffffff;
    box-shadow: 0 3px 10px rgba(99,102,241,0.4);
  }

  .tab-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dtype-btn { padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); color: #e2e8f0; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .dtype-btn.active { background: #10b981; color: #ffffff; border-color: #34d399; box-shadow: 0 4px 12px rgba(16,185,129,0.32); }
  .brand-btn { padding: 7px 15px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .brand-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.32); }
  .ctrl-select { padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; cursor: pointer; }
  .compare-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; user-select: none; border: 1.5px solid #34d399; background: rgba(16,185,129,0.16); color: #ecfdf5; }
  .compare-pill.off { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); color: #cbd5e1; }

  /* Point 1: Grand Total 4 KPI Boxes with Left (Group 5 + PROMO) & Right White Inset Box (Full Total + LY) */
  .grand-card { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #fff; border-radius: 16px; padding: 16px 18px; border: 1.5px solid #4f46e5; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(295px, 1fr)); gap: 12px; margin-top: 12px; }
  .kpi-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .kpi-split {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 10px;
    align-items: stretch;
  }
  .kpi-left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .kpi-white-box {
    border: 1.5px solid rgba(255,255,255,0.65);
    border-radius: 9px;
    padding: 8px 10px;
    background: rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .kpi-lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-val { font-size: 19px; font-weight: 800; margin-top: 2px; letter-spacing: -0.02em; line-height: 1.2; }
  .kpi-val-sm { font-size: 15.5px; font-weight: 800; margin-top: 2px; letter-spacing: -0.01em; line-height: 1.2; }
  .kpi-promo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #fde68a;
    background: rgba(245,158,11,0.18);
    border: 1px solid rgba(251,191,36,0.38);
    padding: 2px 7px;
    border-radius: 6px;
    width: fit-content;
  }
  .kpi-sub { font-size: 10.5px; font-weight: 600; margin-top: 5px; color: #cbd5e1; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .kpi-manual-strip {
    border-top: 1px dashed rgba(255,255,255,0.18);
    padding-top: 7px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kpi-manual-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    background: rgba(124,58,237,0.22);
    border: 1px solid rgba(167,139,250,0.38);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .section-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 18px; box-shadow: 0 4px 12px rgba(15,23,42,0.04); width: 100%; max-width: 100%; overflow: hidden; }
  .attr-bar { background: #f8f6ff; border: 1.5px solid #c4b5fd; border-radius: 14px; padding: 13px 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 100%; }
  .multi-hdr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 7px;
    width: 100%;
    padding-top: 6px;
    border-top: 1px dashed #ddd6fe;
  }
  .hdr-subbox-card {
    background: #ffffff;
    border: 1.5px solid #c4b5fd;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .attr-chips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
    gap: 7px;
    max-height: 145px;
    overflow-y: auto;
    padding: 2px;
    width: 100%;
  }
  .attr-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    min-width: 0;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid #c4b5fd;
    background: #ffffff;
    color: #3b0764;
    user-select: none;
  }
  .attr-chip.checked { background: #ede9fe; border-color: #7c3aed; color: #4c1d95; }
  .attr-chip.missing { background: #fef2f2; border-color: #ef4444; color: #b91c1c; }

  .table-scroll { width: 100%; max-width: 100%; overflow: auto; max-height: 520px; border: 1px solid #e2e8f0; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { background: #f8fafc; color: #334155; padding: 9px 11px; text-align: left; border-bottom: 2px solid #cbd5e1; font-weight: 700; position: sticky; top: 0; z-index: 5; white-space: nowrap; }
  th.attr-compact-th { background: #ede9fe; color: #4c1d95; border-left: 1px solid #ddd6fe; border-right: 1px solid #ddd6fe; text-align: center; }
  th.ly-th { background: #ecfdf5; color: #065f46; border-left: 1px solid #a7f3d0; text-align: right; }
  td { padding: 8px 11px; border-bottom: 1px solid #e2e8f0; font-weight: 500; white-space: nowrap; color: #0f172a; }
  td.ly-td { text-align: right; color: #475569; background: #f8fafc; border-left: 1px solid #e2e8f0; font-weight: 600; }
  .total-row td {
    background: #eef2ff !important;
    border-top: 2px solid #4f46e5 !important;
    border-bottom: 2px solid #4f46e5 !important;
    font-weight: 800 !important;
    color: #1e1b4b !important;
  }
  .num { text-align: right; }

  .plus-hdr-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    background: #6d28d9; color: #ffffff; border: none; border-radius: 6px;
    padding: 3px 8px; margin-left: 6px; font-size: 11px; font-weight: 800;
    cursor: pointer; transition: 0.15s; box-shadow: 0 2px 5px rgba(109,40,217,0.28);
  }
  .plus-hdr-btn:hover { background: #5b21b6; }
  .plus-cell-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f5f3ff; color: #4c1d95; border: 1.5px solid #a78bfa;
    padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .plus-cell-btn:hover { background: #ede9fe; border-color: #7c3aed; }
  .plus-cell-btn.open { background: #6d28d9; color: #ffffff; border-color: #5b21b6; }
  .plus-icon-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px;
    background: #7c3aed; color: #ffffff; font-size: 13px; font-weight: 800; line-height: 1;
  }
  .plus-cell-btn.open .plus-icon-badge { background: #ffffff; color: #5b21b6; }

  /* Point 4: Party Multi-Store [+] Button */
  .party-plus-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(37,99,235,0.28);
    transition: 0.15s;
    vertical-align: middle;
  }
  .party-plus-btn:hover { transform: translateY(-1px); background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); }

  /* Full-Screen Multi-Store Popup Modal */
  .fs-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.75);
    backdrop-filter: blur(4px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .fs-modal-card {
    width: 98vw;
    height: 95vh;
    background: #f8fafc;
    border-radius: 16px;
    border: 2px solid #4f46e5;
    box-shadow: 0 25px 60px rgba(15,23,42,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .fs-modal-head {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: #ffffff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .fs-modal-body {
    flex: 1;
    overflow: auto;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .expand-drawer-row td {
    background: #faf5ff !important;
    padding: 10px 12px !important;
    border-bottom: 2px solid #c4b5fd !important;
    white-space: normal !important;
  }
  .drawer-box {
    position: sticky;
    left: 0;
    width: 100%;
    max-width: calc(100vw - 75px);
    background: #ffffff;
    border: 1.5px solid #c4b5fd;
    border-radius: 10px;
    padding: 10px 13px;
    box-shadow: 0 4px 12px rgba(109,40,217,0.06);
  }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    padding-bottom: 8px; margin-bottom: 9px; border-bottom: 1px solid #ede9fe;
  }
  .drawer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 8px;
    width: 100%;
  }
  .drawer-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; min-width: 0; background: #f8fafc; border: 1px solid #cbd5e1;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: #1e293b;
  }
  .drawer-item.missing { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
  .drawer-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .drawer-qty { background: #4c1d95; color: #ffffff; padding: 2px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
  .drawer-item.missing .drawer-qty { background: #dc2626; }

  /* Point 5: Visual Analytics Dashboard Grid */
  .dash-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; }
  .chart-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    padding: 15px 18px;
    box-shadow: 0 6px 18px rgba(15,23,42,0.05);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chart-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chart-box { position: relative; width: 100%; height: 290px; }
  .chart-box-tall { position: relative; width: 100%; height: 320px; }

  .pending-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 7px;
    max-height: 210px;
    overflow-y: auto;
    width: 100%;
  }

  .gr-pos { background: #dcfce7; color: #15803d; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700; display: inline-block; }
  .gr-neg { background: #fee2e2; color: #b91c1c; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700; display: inline-block; }
  .gr-new { background: #e0f2fe; color: #0369a1; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700; display: inline-block; }
  .gr-flat { background: #f1f5f9; color: #64748b; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 600; display: inline-block; }
  .lock-screen { max-width: 420px; margin: 70px auto; background: #fff; border-radius: 16px; padding: 28px; text-align: center; border: 2px solid #cbd5e1; box-shadow: 0 18px 40px rgba(15,23,42,0.12); }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="lock-screen">⏳ Loading Live KRITO Report...</div>
</div>
<div id="subStoreModalRoot"></div>

<script>
var TYPE_META = {
  TERTIARY:     { label: '🔥 Tertiary Data', valTitle: 'Tertiary Net Value' },
  STOCK:        { label: '📦 Stock Data',    valTitle: 'Stock Value' },
  SELL_IN:      { label: '📥 Sell In',       valTitle: 'Sell-In Value' },
  SELL_OUT:     { label: '📤 Sell Out',      valTitle: 'Sell-Out Value' },
  BRAND_ORDER:  { label: '📝 Brand Order',   valTitle: 'Order Value' },
  PAYMENT_COLL: { label: '💳 Payment Coll',  valTitle: 'Collection Value' },
  TARGET_SHEET: { label: '🎯 Target Sheet',  valTitle: 'Target Value' }
};

var MON_NUM = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };
var FY_MON_ORDER = ['APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC','JAN','FEB','MAR'];

var LIVE_PAYLOAD = null;
var ACTIVE_LINK = null;
var ACTIVE_DATA_TYPE = '';
var ACTIVE_BRAND = '';
var ACTIVE_YEAR2 = 'ALL';
var ACTIVE_MONTH = '';
var COMPARE_LY_ENABLED = true;

// View Mode: 'TABLE' or 'GRAPHS' (Point 5)
var VIEW_MODE = 'TABLE';
var GRAPH_METRIC = 'NET'; // 'NET' or 'QTY'
var ACTIVE_CHARTS = [];

// Multi-Header State (Point 2: Show ALL selected headers simultaneously!)
var ACTIVE_HEADERS_LIST = [];
var HEADER_DEFAULT_INIT = false;
var UNCHECKED_ATTR_VALS = {}; // headerName -> Set of unchecked sub-values
var ATTR_VAL_SEARCH_MAP = {}; // headerName -> search string

// Expand states
var EXPANDED_MGR_KEYS = new Set();
var EXPANDED_STORE_KEYS = new Set();

// Point 4: Full-Screen Multi-Store Popup State
var SUBSTORE_MODAL_PARTY = '';
var SUBSTORE_MODAL_SEARCH = '';
var EXPANDED_SUBSTORE_KEYS = new Set();

var PIN_UNLOCKED = false;
var SEARCH_Q = '';
var SEARCH_TIMER = null;

var TIMER_SECONDS = 30;
var TIMER_INTERVAL = null;
var IS_FETCHING_NOW = false;

function fmtINR(n) { return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('en-IN'); }
function fmtShortINR(n) {
  var v = Number(n) || 0, a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 10000000) return sign + '₹' + (a / 10000000).toFixed(2) + ' Cr';
  if (a >= 100000) return sign + '₹' + (a / 100000).toFixed(2) + ' L';
  if (a >= 1000) return sign + '₹' + (a / 1000).toFixed(1) + ' K';
  return sign + '₹' + Math.round(a);
}
function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s) { return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function getQueryId() {
  return new URLSearchParams(window.location.search).get('id') || '';
}

function getLastYearPeriodKey(periodKey) {
  if (!periodKey) return '';
  if (periodKey.startsWith('FULL_FY::')) {
    var fm = periodKey.slice(9).match(/^(\d{4})-(\d{2})$/);
    if (fm) {
      var prevStart = parseInt(fm[1], 10) - 1;
      return 'FULL_FY::' + prevStart + '-' + String((prevStart + 1) % 100).padStart(2, '0');
    }
    return '';
  }
  var mm = periodKey.match(/^([A-Z]{3})-(\d{4})$/);
  return mm ? (mm[1] + '-' + (parseInt(mm[2], 10) - 1)) : '';
}

function getPeriodDisplayLabel(periodKey) {
  if (!periodKey) return '-';
  if (periodKey.startsWith('FULL_FY::')) return '📅 FULL FY (' + periodKey.slice(9) + ')';
  return '🗓️ ' + periodKey;
}

function calcGrowthBadgeHtml(cyVal, lyVal) {
  var cy = Number(cyVal) || 0, ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return '<span class="gr-new">★ NEW</span>';
  if (ly <= 0 && cy <= 0) return '<span class="gr-flat">0.0%</span>';
  var pct = ((cy - ly) / ly) * 100;
  return '<span class="' + (pct >= 0 ? 'gr-pos' : 'gr-neg') + '">' + (pct >= 0 ? '▲ +' : '▼ ') + pct.toFixed(1) + '%</span>';
}

function calcGrowthPlainText(cyVal, lyVal) {
  var cy = Number(cyVal) || 0, ly = Number(lyVal) || 0;
  if (ly <= 0 && cy > 0) return 'NEW';
  if (ly <= 0 && cy <= 0) return '0.0%';
  var pct = ((cy - ly) / ly) * 100;
  return (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function sortMonthKeysDesc(keysArr) {
  return keysArr.slice().sort(function(a, b) {
    var aIsFy = a.startsWith('FULL_FY::'), bIsFy = b.startsWith('FULL_FY::');
    if (aIsFy && !bIsFy) return 1;
    if (!aIsFy && bIsFy) return -1;
    if (aIsFy && bIsFy) return b.localeCompare(a);
    var ma = a.match(/^([A-Z]{3})-(\d{4})$/), mb = b.match(/^([A-Z]{3})-(\d{4})$/);
    if (ma && mb) {
      return (parseInt(mb[2], 10) * 100 + (MON_NUM[mb[1]] || 0)) - (parseInt(ma[2], 10) * 100 + (MON_NUM[ma[1]] || 0));
    }
    return b.localeCompare(a);
  });
}

function sortMonthKeysAsc(keysArr) {
  return keysArr.slice().sort(function(a, b) {
    var ma = a.match(/^([A-Z]{3})-(\d{4})$/), mb = b.match(/^([A-Z]{3})-(\d{4})$/);
    if (ma && mb) {
      return (parseInt(ma[2], 10) * 100 + (MON_NUM[ma[1]] || 0)) - (parseInt(mb[2], 10) * 100 + (MON_NUM[mb[1]] || 0));
    }
    return a.localeCompare(b);
  });
}

function start30SecCountdownLoop() {
  if (TIMER_INTERVAL) clearInterval(TIMER_INTERVAL);
  TIMER_INTERVAL = setInterval(function() {
    if (IS_FETCHING_NOW) return;
    TIMER_SECONDS--;
    var el = document.getElementById('liveTimerText');
    if (TIMER_SECONDS <= 0) {
      TIMER_SECONDS = 30;
      if (el) el.textContent = '🔄 Syncing...';
      fetchLiveReportData(true);
    } else if (el) {
      el.textContent = TIMER_SECONDS + 's';
    }
  }, 1000);
}

function manualRefreshClick() {
  TIMER_SECONDS = 30;
  var el = document.getElementById('liveTimerText');
  if (el) el.textContent = '🔄 Syncing...';
  fetchLiveReportData(false);
}

async function fetchLiveReportData(isAutoTick) {
  if (IS_FETCHING_NOW) return;
  IS_FETCHING_NOW = true;
  try {
    var res = await fetch('./live_data.json?_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Live data file not found yet.');
    var freshPayload = await res.json();
    var prevIso = LIVE_PAYLOAD ? LIVE_PAYLOAD.generatedAtIso : '';
    var changed = !LIVE_PAYLOAD || (freshPayload.generatedAtIso !== prevIso);
    LIVE_PAYLOAD = freshPayload;

    if (!isAutoTick || changed) {
      var winY = window.scrollY || 0;
      var tblEl = document.getElementById('liveStoreScrollWrap');
      var tblY = tblEl ? tblEl.scrollTop : 0;
      renderApp();
      window.scrollTo(0, winY);
      var newTblEl = document.getElementById('liveStoreScrollWrap');
      if (newTblEl) newTblEl.scrollTop = tblY;
    }
  } catch (err) {
    if (!LIVE_PAYLOAD) {
      document.getElementById('app').innerHTML = '<div class="lock-screen"><h3>⚠️ Unable to Load Live Data</h3><p style="color:#64748b;font-size:13px;">' + escHtml(err.message) + '</p><button onclick="manualRefreshClick()" style="background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-weight:700;cursor:pointer;">🔄 Retry</button></div>';
    }
  } finally {
    IS_FETCHING_NOW = false;
    TIMER_SECONDS = 30;
    var el = document.getElementById('liveTimerText');
    if (el) el.textContent = '30s';
  }
}

function getAdminPermittedSubValues(mData, headerName) {
  var aObj = (mData && mData.attributes && mData.attributes[headerName]) ? mData.attributes[headerName] : null;
  if (!aObj || !Array.isArray(aObj.values)) return [];
  var adminAllowedMap = ACTIVE_LINK && ACTIVE_LINK.allowedHeaderValues;
  if (adminAllowedMap && Array.isArray(adminAllowedMap[headerName])) {
    var allowSet = new Set(adminAllowedMap[headerName]);
    return aObj.values.filter(function(v) { return allowSet.has(v); });
  }
  return aObj.values;
}

function getSelectedSubValuesForHeader(mData, headerName) {
  var permitted = getAdminPermittedSubValues(mData, headerName);

}

// Compute exact { qty, net, mrp, disc, discPct, hasFullMetrics } for any Header's currently ticked sub-values
function computeSelectedHeaderMetrics(periodData, headerName, selectedValsList) {
  if (!periodData || !headerName || !periodData.attributes || !periodData.attributes[headerName]) {
    return null;
  }
  var aObj = periodData.attributes[headerName];
  var valsToUse = selectedValsList || getSelectedSubValuesForHeader(periodData, headerName);
  var hasMetrics = !!(aObj.totalsMetrics && typeof aObj.totalsMetrics === 'object');
  var q = 0, n = 0, m = 0, d = 0;

  for (var i = 0; i < valsToUse.length; i++) {
    var v = valsToUse[i];
    if (hasMetrics && Array.isArray(aObj.totalsMetrics[v])) {
      var arr = aObj.totalsMetrics[v];
      q += Number(arr[0]) || 0;
      n += Number(arr[1]) || 0;
      m += Number(arr[2]) || 0;
      d += Number(arr[3]) || 0;
    } else if (aObj.totals && aObj.totals[v] !== undefined) {
      q += Number(aObj.totals[v]) || 0;
    }
  }
  return {
    qty: Math.round(q),
    net: Math.round(n),
    mrp: Math.round(m),
    disc: Math.round(d),
    discPct: m > 0 ? Number(((d / m) * 100).toFixed(2)) : 0,
    hasFullMetrics: hasMetrics
  };
}

function updateStoreTableBodyOnly() {
  var tbody = document.getElementById('liveStoreTbody');
  var cntBadge = document.getElementById('liveStoreCountBadge');
  if (!tbody || !ACTIVE_LINK || !LIVE_PAYLOAD) return;

  var bucket = getActiveDatasetBucket();
  var brandPeriods = bucket[ACTIVE_BRAND] || {};
  var mData = brandPeriods[ACTIVE_MONTH] || { stores: [], attributes: {} };
  var rights = ACTIVE_LINK.rights || {};
  var compareOn = !!(rights.allowCompareLY && COMPARE_LY_ENABLED);
  var lyKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyKey && brandPeriods[lyKey]) ? brandPeriods[lyKey] : null;
  var lyStoreMap = {};
  if (lyData && Array.isArray(lyData.stores)) {
    lyData.stores.forEach(function(s) { lyStoreMap[String(s.party || '').trim().toUpperCase()] = s; });
  }

  var activeHeaders = rights.showHeaderBreakdown ? ACTIVE_HEADERS_LIST : [];
  var totalColsCount = 5 + activeHeaders.length + (compareOn ? 4 : 0) + (rights.showMrpAndDisc ? 2 : 0);

  var filtered = (mData.stores || []).filter(function(s) {
    return !SEARCH_Q || s.party.toLowerCase().includes(SEARCH_Q) || s.manager.toLowerCase().includes(SEARCH_Q);
  });

  if (cntBadge) cntBadge.textContent = '(' + filtered.length + ' Stores)';
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + totalColsCount + '" style="text-align:center;color:#64748b;padding:24px;">No store data found for this filter.</td></tr>';
    return;
  }

  var htmlRows = [];
  for (var i = 0; i < filtered.length; i++) {
    var s = filtered[i];
    var pKey = String(s.party || '').trim().toUpperCase();
    var lyS = lyStoreMap[pKey] || { qty: 0, net: 0 };

    var compactHeaderTds = '';
    var expandedDrawersHtml = [];

    for (var h = 0; h < activeHeaders.length; h++) {
      var hName = activeHeaders[h];
      var subVals = getSelectedSubValuesForHeader(mData, hName);
      var byStore = (mData.attributes && mData.attributes[hName]) ? (mData.attributes[hName].byStore || {}) : {};
      var sAttrMap = byStore[pKey] || byStore[s.party] || {};

      var sumQty = 0, nonZeroCount = 0;
      for (var sv = 0; sv < subVals.length; sv++) {
        var qv = Number(sAttrMap[subVals[sv]] || 0);
        if (qv > 0) { sumQty += qv; nonZeroCount++; }
      }

      var expKey = hName + '||' + s.party;
      var isOpen = EXPANDED_STORE_KEYS.has(expKey);
      var clickJs = "toggleStoreExpand('" + escJs(hName) + "','" + escJs(s.party) + "')";

      compactHeaderTds += '<td style="text-align:center; border-left:1px solid #ede9fe; border-right:1px solid #ede9fe; background:#fcfaff;">' +
        '<button type="button" class="plus-cell-btn ' + (isOpen ? 'open' : '') + '" onclick="' + clickJs + '" title="Click to view ' + escHtml(hName) + ' breakdown">' +
          '<span class="plus-icon-badge">' + (isOpen ? '−' : '+') + '</span>' +
          '<span>' + fmtNum(sumQty) + ' Qty</span>' +
          '<span style="font-size:10.5px; opacity:0.8;">(' + nonZeroCount + ')</span>' +
        '</button>' +
      '</td>';

      if (isOpen) {
        var titleLeft = '<span>🏢 <b>' + escHtml(s.party) + '</b></span>' +
                        '<span style="color:#475569;">|</span>' +
                        '<span>👨‍💼 Manager: <b>' + escHtml(s.manager) + '</b></span>';
        expandedDrawersHtml.push(buildCompactDrawerHtml(titleLeft, hName, subVals, sAttrMap, sumQty, clickJs));
      }
    }

    // Point 4: [ + ] button right next to Party Name when multiple CustomerNameActive stores exist!
    var hasMultiSub = Array.isArray(s.subStores) && s.subStores.length > 0;
    var subStoreBtnHtml = hasMultiSub
      ? '<button type="button" class="party-plus-btn" onclick="openPartySubStoresModal(\'' + escJs(s.party) + '\')" title="Click to view all ' + s.subStores.length + ' Active Stores in Full Screen">+ ' + s.subStores.length + '</button>'
      : '';

    var lyTds = compareOn
      ? '<td class="ly-td">' + fmtNum(lyS.qty) + '</td><td class="num">' + calcGrowthBadgeHtml(s.qty, lyS.qty) + '</td><td class="ly-td">' + fmtINR(lyS.net) + '</td><td class="num">' + calcGrowthBadgeHtml(s.net, lyS.net) + '</td>'
      : '';

    var mrpDiscTds = rights.showMrpAndDisc
      ? '<td class="num">' + fmtINR(s.mrp) + '</td><td class="num" style="color:#dc2626; font-weight:700;">' + s.discPct + '%</td>'
      : '';

    htmlRows.push(
      '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><b>' + escHtml(s.party) + '</b>' + subStoreBtnHtml + '</td>' +
        '<td>' + escHtml(s.manager) + '</td>' +
        compactHeaderTds +
        '<td class="num"><b>' + fmtNum(s.qty) + '</b></td>' +
        '<td class="num" style="color:#0284c7;"><b>' + fmtINR(s.net) + '</b></td>' +
        lyTds +
        mrpDiscTds +
      '</tr>'
    );

    if (expandedDrawersHtml.length > 0) {
      htmlRows.push(
        '<tr class="expand-drawer-row"><td colspan="' + totalColsCount + '">' +
          '<div style="display:flex; flex-direction:column; gap:8px;">' + expandedDrawersHtml.join('') + '</div>' +
        '</td></tr>'
      );
    }
  }
  tbody.innerHTML = htmlRows.join('');
}

function downloadLiveCsv() {
  var bucket = getActiveDatasetBucket();
  var brandPeriods = bucket[ACTIVE_BRAND] || {};
  var mData = brandPeriods[ACTIVE_MONTH];
  if (!mData || !mData.stores) return;

  var r = ACTIVE_LINK.rights || {};
  var compareOn = !!(r.allowCompareLY && COMPARE_LY_ENABLED);
  var lyKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyKey && brandPeriods[lyKey]) ? brandPeriods[lyKey] : null;
  var lyStoreMap = {};
  if (lyData && Array.isArray(lyData.stores)) {
    lyData.stores.forEach(function(s) { lyStoreMap[String(s.party || '').trim().toUpperCase()] = s; });
  }

  var activeHeaders = r.showHeaderBreakdown ? ACTIVE_HEADERS_LIST : [];
  var flatAttrSpecs = [];
  activeHeaders.forEach(function(hName) {
    getSelectedSubValuesForHeader(mData, hName).forEach(function(v) {
      flatAttrSpecs.push({ hName: hName, val: v, colTitle: activeHeaders.length > 1 ? (hName + ': ' + v) : v });
    });
  });

  var vTitle = (TYPE_META[ACTIVE_DATA_TYPE] && TYPE_META[ACTIVE_DATA_TYPE].valTitle) || 'Net Value';
  var hdr = ['S.No', 'Party Name', 'Manager'].concat(flatAttrSpecs.map(function(x) { return x.colTitle; })).concat(['Qty', vTitle]);
  if (compareOn) hdr = hdr.concat(['LY Qty', 'Qty Growth %', 'LY ' + vTitle, 'Val Growth %']);
  if (r.showMrpAndDisc) hdr = hdr.concat(['MRP Value', 'Discount', 'Disc %']);

  var lines = [hdr.map(function(h) { return '"' + String(h).replace(/"/g,'""') + '"'; }).join(',')];
  mData.stores.forEach(function(s, i) {
    var pKey = String(s.party || '').trim().toUpperCase();
    var lyS = lyStoreMap[pKey] || { qty: 0, net: 0 };
    var row = [i + 1, '"' + s.party.replace(/"/g,'""') + '"', '"' + s.manager.replace(/"/g,'""') + '"'];
    flatAttrSpecs.forEach(function(sp) {
      var byS = (mData.attributes && mData.attributes[sp.hName]) ? (mData.attributes[sp.hName].byStore || {}) : {};
      var mp = byS[pKey] || byS[s.party] || {};
      row.push(mp[sp.val] || 0);
    });
    row.push(s.qty, s.net);
    if (compareOn) row.push(lyS.qty, '"' + calcGrowthPlainText(s.qty, lyS.qty) + '"', lyS.net, '"' + calcGrowthPlainText(s.net, lyS.net) + '"');
    if (r.showMrpAndDisc) row.push(s.mrp, s.disc, s.discPct + '%');
    lines.push(row.join(','));
  });

  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ACTIVE_DATA_TYPE + '_' + ACTIVE_BRAND + '_' + ACTIVE_MONTH.replace(/:/g,'_') + '_Live.csv';
  a.click();
}

  return `

      <div style="display:flex; gap:6px; align-items:center;">

function mountLiveDashboardCharts(brandPeriods, mData, lyData, dtMeta, compareOn) {

  if (typeof Chart === 'undefined') return;

  var isNet = (GRAPH_METRIC === 'NET');
  var palette = ['#4f46e5','#10b981','#0ea5e9','#f59e0b','#ec4899','#8b5cf6','#14b8a6','#f97316','#06b6d4','#84cc16','#e11d48','#6366f1'];

  var monthKeys = sortMonthKeysAsc(Object.keys(brandPeriods).filter(function(pk) {
    if (pk.startsWith('FULL_FY::')) return false;
    if (ACTIVE_YEAR2 !== 'ALL') return (brandPeriods[pk] && brandPeriods[pk].year2 === ACTIVE_YEAR2);
    return true;
  }));

  // 1. Month-Wise CY vs LY Comparison
  var c1 = document.getElementById('chartMonthComparison');
  if (c1) {
    var cyVals = monthKeys.map(function(mk) { var g = brandPeriods[mk].grandTotal; return isNet ? g.net : g.qty; });
    var lyVals = monthKeys.map(function(mk) {
      var lk = getLastYearPeriodKey(mk);
      var g = (lk && brandPeriods[lk]) ? brandPeriods[lk].grandTotal : { net: 0, qty: 0 };
      return isNet ? g.net : g.qty;
    });
    var datasets1 = [{
      label: 'Current Year ' + (isNet ? dtMeta.valTitle : 'Qty'),
      data: cyVals,
      backgroundColor: 'rgba(79,70,229,0.85)',
      borderColor: '#4338ca',
      borderWidth: 1.5,
      borderRadius: 6
    }];
    if (compareOn) {
      datasets1.push({
        label: 'Last Year ' + (isNet ? dtMeta.valTitle : 'Qty'),
        data: lyVals,
        backgroundColor: 'rgba(16,185,129,0.75)',
        borderColor: '#059669',
        borderWidth: 1.5,
        borderRadius: 6
      });

        responsive: true, maintainAspectRatio: false,

          legend: { position: 'top', labels: { font: { weight: '700' } } },

            callbacks: {
              label: function(ctx) {
                return ctx.dataset.label + ': ' + (isNet ? fmtINR(ctx.parsed.y) : fmtNum(ctx.parsed.y) + ' Qty');
              }
            }
          }
        },
        scales: {
          y: { beginAtZero: true, ticks: { callback: function(v) { return isNet ? fmtShortINR(v) : fmtNum(v); } } }
        }
      }
    }));
  }

  // 2. Manager-Wise Bar Chart
  var c2 = document.getElementById('chartManagerBar');
  if (c2) {
    var mgrs = mData.managers || [];
    var lyMgrMap = {};
    if (lyData && Array.isArray(lyData.managers)) {
      lyData.managers.forEach(function(m) { lyMgrMap[String(m.manager || '').trim().toUpperCase()] = m; });
    }
    var mLabels = mgrs.map(function(m) { return m.manager; });
    var mCy = mgrs.map(function(m) { return isNet ? m.net : m.qty; });
    var mLy = mgrs.map(function(m) {
      var lm = lyMgrMap[String(m.manager || '').trim().toUpperCase()] || { net: 0, qty: 0 };
      return isNet ? lm.net : lm.qty;
    });
    var ds2 = [{ label: 'CY ' + (isNet ? 'Value' : 'Qty'), data: mCy, backgroundColor: '#6366f1', borderRadius: 6 }];
    if (compareOn) ds2.push({ label: 'LY ' + (isNet ? 'Value' : 'Qty'), data: mLy, backgroundColor: '#10b981', borderRadius: 6 });

    ACTIVE_CHARTS.push(new Chart(c2.getContext('2d'), {
      type: 'bar',
      data: { labels: mLabels, datasets: ds2 },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label + ': ' + (isNet ? fmtINR(ctx.parsed.y) : fmtNum(ctx.parsed.y) + ' Qty'); } } }
        },
        scales: { y: { beginAtZero: true, ticks: { callback: function(v) { return isNet ? fmtShortINR(v) : fmtNum(v); } } } }
      }
    }));
  }

  // 3. Category / Group 5 Doughnut Chart
  var c3 = document.getElementById('chartCategoryDoughnut');
  if (c3) {
    var g5Hdr = findGroup5HeaderName(mData);
    var chartHdr = ACTIVE_HEADERS_LIST[0] || g5Hdr || (mData.attributes ? Object.keys(mData.attributes)[0] : '');
    var aObj = (chartHdr && mData.attributes && mData.attributes[chartHdr]) ? mData.attributes[chartHdr] : null;
    if (aObj) {

      var rowsCat = selVals.map(function(v) {

        var val = (isNet && mArr) ? mArr[1] : (aObj.totals[v] || 0);
        return { label: v, val: val };
      }).filter(function(x) { return x.val > 0; }).sort(function(a, b) { return b.val - a.val; });

      var topCats = rowsCat.slice(0, 8);
      if (rowsCat.length > 8) {
        var restSum = rowsCat.slice(8).reduce(function(acc, x) { return acc + x.val; }, 0);
        topCats.push({ label: 'OTHERS', val: restSum });
      }
      var totCat = topCats.reduce(function(acc, x) { return acc + x.val; }, 0) || 1;

      ACTIVE_CHARTS.push(new Chart(c3.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: topCats.map(function(x) { return x.label + ' (' + ((x.val / totCat) * 100).toFixed(1) + '%)'; }),
          datasets: [{ data: topCats.map(function(x) { return x.val; }), backgroundColor: palette, borderWidth: 2, borderColor: '#fff' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '55%',
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11, weight: '600' } } },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  var useVal = (isNet && aObj.totalsMetrics) ? fmtINR(ctx.parsed) : (fmtNum(ctx.parsed) + ' Qty');
                  return ctx.label + ': ' + useVal;
                }
              }
            }
          }
        }
      }));
    }
  }

  // 4. Top 10 Stores Horizontal Bar Chart
  var c4 = document.getElementById('chartTopStores');
  if (c4) {
    var top10 = (mData.stores || []).slice().sort(function(a, b) { return (isNet ? b.net - a.net : b.qty - a.qty); }).slice(0, 10);
    ACTIVE_CHARTS.push(new Chart(c4.getContext('2d'), {
      type: 'bar',
      data: {
        labels: top10.map(function(s) { return s.party.length > 26 ? s.party.slice(0, 26) + '…' : s.party; }),
        datasets: [{
          label: isNet ? dtMeta.valTitle : 'Qty',
          data: top10.map(function(s) { return isNet ? s.net : s.qty; }),
          backgroundColor: 'rgba(14,165,233,0.85)',
          borderColor: '#0284c7',
          borderWidth: 1,
          borderRadius: 5
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function(items) { var idx = items[0].dataIndex; return top10[idx] ? top10[idx].party : ''; },
              label: function(ctx) { return (isNet ? fmtINR(ctx.parsed.x) : fmtNum(ctx.parsed.x) + ' Qty'); }
            }
          }
        },
        scales: { x: { beginAtZero: true, ticks: { callback: function(v) { return isNet ? fmtShortINR(v) : fmtNum(v); } } } }
      }
    }));
  }

  // 5. Monthly Discount % & Value Trend Area Chart
  var c5 = document.getElementById('chartDiscountTrend');
  if (c5) {
    var discPcts = monthKeys.map(function(mk) { return brandPeriods[mk].grandTotal.discPct || 0; });
    var netVals = monthKeys.map(function(mk) { return brandPeriods[mk].grandTotal.net || 0; });
    ACTIVE_CHARTS.push(new Chart(c5.getContext('2d'), {
      type: 'line',
      data: {
        labels: monthKeys,
        datasets: [
          {
            label: 'Discount %',
            data: discPcts,
            yAxisID: 'yPct',
            borderColor: '#e11d48',
            backgroundColor: 'rgba(225,29,72,0.12)',
            fill: true,
            tension: 0.35,
            borderWidth: 2.5,
            pointRadius: 4
          },
          {
            label: dtMeta.valTitle + ' (₹)',
            data: netVals,
            yAxisID: 'yVal',
            borderColor: '#4f46e5',
            backgroundColor: 'rgba(79,70,229,0.08)',
            fill: false,
            tension: 0.35,
            borderWidth: 2,
            borderDash: [5, 4],
            pointRadius: 3
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                return ctx.datasetIndex === 0 ? ('Discount %: ' + ctx.parsed.y + '%') : (ctx.dataset.label + ': ' + fmtINR(ctx.parsed.y));
              }
            }
          }
        },
        scales: {
          yPct: { type: 'linear', position: 'left', beginAtZero: true, ticks: { callback: function(v) { return v + '%'; } } },
          yVal: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { callback: function(v) { return fmtShortINR(v); } } }
        }
      }
    }));
  }
}

function renderApp() {
  var app = document.getElementById('app');
  var linkId = getQueryId();
  var linksMap = (LIVE_PAYLOAD && LIVE_PAYLOAD.links) || {};
  ACTIVE_LINK = linkId ? linksMap[linkId] : Object.values(linksMap)[0];

  if (!ACTIVE_LINK) {
    app.innerHTML = '<div class="lock-screen"><h2>🔒 Invalid Link</h2><p style="color:#64748b;font-size:13px;">Yeh Live Report Link valid nahi hai ya delete ho chuka hai.</p></div>';
    return;
  }
  if (!ACTIVE_LINK.active) {
    app.innerHTML = '<div class="lock-screen"><h2>🚫 Access Disabled</h2><p style="color:#dc2626;font-weight:700;font-size:13px;">Admin ne is Live Report Link ka access band (Revoke) kar diya hai.</p></div>';
    return;
  }
  if (ACTIVE_LINK.expiresAt && new Date(ACTIVE_LINK.expiresAt).getTime() < Date.now()) {
    app.innerHTML = '<div class="lock-screen"><h2>⏰ Link Expired</h2><p style="color:#b91c1c;font-weight:700;font-size:13px;">Is Live Report Link ka valid time (' + escHtml(ACTIVE_LINK.validityLabel) + ') khatam ho chuka hai.</p></div>';
    return;
  }
  if (ACTIVE_LINK.pin && !PIN_UNLOCKED) {
    app.innerHTML = '<div class="lock-screen"><h2>🔐 PIN Protected Report</h2><p style="color:#475569;font-size:13px;"><b>' + escHtml(ACTIVE_LINK.title) + '</b> dekhne ke liye Access PIN daalein:</p><input id="viewerPinInp" type="password" placeholder="Enter PIN" style="padding:10px;width:180px;text-align:center;font-size:16px;font-weight:800;border:2px solid #4f46e5;border-radius:8px;margin:10px 0;"><br><button onclick="verifyPin()" style="background:#4f46e5;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;">🔓 Unlock Report</button></div>';
    return;
  }

  var rights = ACTIVE_LINK.rights || {
    showGrandTotal: true, showManagers: true, showStores: true, showPending: true,
    showMrpAndDisc: true, showYear2: false, allowCompareLY: false, showHeaderBreakdown: false
  };

  var allowedHeaders = (rights.showHeaderBreakdown && Array.isArray(ACTIVE_LINK.allowedHeaders)) ? ACTIVE_LINK.allowedHeaders : [];
  if (!HEADER_DEFAULT_INIT) {
    HEADER_DEFAULT_INIT = true;
    if (ACTIVE_LINK.defaultHeader && allowedHeaders.includes(ACTIVE_LINK.defaultHeader)) {
      ACTIVE_HEADERS_LIST = [ACTIVE_LINK.defaultHeader];
    }
  }
  ACTIVE_HEADERS_LIST = ACTIVE_HEADERS_LIST.filter(function(h) { return allowedHeaders.includes(h); });

  var allowedDataTypes = (Array.isArray(ACTIVE_LINK.dataTypes) && ACTIVE_LINK.dataTypes.length > 0) ? ACTIVE_LINK.dataTypes : ['TERTIARY'];
  if (!ACTIVE_DATA_TYPE || !allowedDataTypes.includes(ACTIVE_DATA_TYPE)) ACTIVE_DATA_TYPE = allowedDataTypes[0];

  var activeBucket = getActiveDatasetBucket();
  var allowedBrands = (Array.isArray(ACTIVE_LINK.brands) && ACTIVE_LINK.brands.length > 0) ? ACTIVE_LINK.brands : Object.keys(activeBucket);
  if (!ACTIVE_BRAND || !allowedBrands.includes(ACTIVE_BRAND)) ACTIVE_BRAND = allowedBrands[0] || 'ARROW';

  var brandPeriods = activeBucket[ACTIVE_BRAND] || {};
  var allPeriodKeys = Object.keys(brandPeriods);

  var fySet = new Set();
  allPeriodKeys.forEach(function(pk) {
    var y2 = brandPeriods[pk] && brandPeriods[pk].year2;
    if (y2) fySet.add(y2);
  });
  var availYear2 = Array.from(fySet).sort().reverse();
  if (!rights.showYear2) ACTIVE_YEAR2 = 'ALL';
  else if (ACTIVE_YEAR2 !== 'ALL' && !fySet.has(ACTIVE_YEAR2)) ACTIVE_YEAR2 = availYear2[0] || 'ALL';

  var availMonths = sortMonthKeysDesc(allPeriodKeys.filter(function(pk) {
    if (ACTIVE_YEAR2 === 'ALL') return !pk.startsWith('FULL_FY::');
    var y2 = brandPeriods[pk] && brandPeriods[pk].year2;
    return y2 === ACTIVE_YEAR2;
  }));

  if (!ACTIVE_MONTH || !availMonths.includes(ACTIVE_MONTH)) {
    ACTIVE_MONTH = (ACTIVE_LINK.defaultMonth && availMonths.includes(ACTIVE_LINK.defaultMonth)) ? ACTIVE_LINK.defaultMonth : (availMonths[0] || '');
  }

  var dtMeta = TYPE_META[ACTIVE_DATA_TYPE] || { label: ACTIVE_DATA_TYPE, valTitle: 'Net Value' };
  var gStatus = LIVE_PAYLOAD.globalStatus || { status: 'UPDATING', statusNote: '' };
  var effStatus = (ACTIVE_LINK.statusOverride && ACTIVE_LINK.statusOverride !== 'GLOBAL') ? ACTIVE_LINK.statusOverride : gStatus.status;
  var stClass = effStatus === 'COMPLETED' ? 'st-completed' : (effStatus === 'PARTIAL' ? 'st-partial' : 'st-updating');
  var stText  = effStatus === 'COMPLETED' ? '✅ STATUS: COMPLETED & UPDATED' : (effStatus === 'PARTIAL' ? '🟠 STATUS: PARTIALLY UPDATED' : '🟡 STATUS: LIVE UPDATING IN PROGRESS');

  var mData = brandPeriods[ACTIVE_MONTH] || { grandTotal: { stores: 0, pendingStores: 0, qty: 0, mrp: 0, net: 0, disc: 0, discPct: 0 }, managers: [], stores: [], pending: [], attributes: {} };
  var gt = mData.grandTotal;

  var compareOn = !!(rights.allowCompareLY && COMPARE_LY_ENABLED);
  var lyPeriodKey = compareOn ? getLastYearPeriodKey(ACTIVE_MONTH) : '';
  var lyData = (compareOn && lyPeriodKey && brandPeriods[lyPeriodKey]) ? brandPeriods[lyPeriodKey] : null;
  var lyGt = lyData ? lyData.grandTotal : { qty: 0, net: 0, mrp: 0, disc: 0, discPct: 0 };
  var lyMgrMap = {};
  if (lyData && Array.isArray(lyData.managers)) {
    lyData.managers.forEach(function(m) { lyMgrMap[String(m.manager || '').trim().toUpperCase()] = m; });
  }

  // =========================================================================
  // POINT 1 & POINT 2: COMPUTE GROUP 5 SELECTED + (PROMO) DIFF + MANUAL HEADERS
  // =========================================================================
  var g5Header = findGroup5HeaderName(mData);
  var g5SelectedVals = g5Header ? getSelectedSubValuesForHeader(mData, g5Header) : [];
  var g5Cy = g5Header ? computeSelectedHeaderMetrics(mData, g5Header, g5SelectedVals) : null;
  var g5Ly = (g5Header && lyData) ? computeSelectedHeaderMetrics(lyData, g5Header, g5SelectedVals) : { qty: 0, net: 0, mrp: 0, disc: 0, discPct: 0 };
  if (!g5Ly) g5Ly = { qty: 0, net: 0, mrp: 0, disc: 0, discPct: 0 };

  var mainQty  = g5Cy ? g5Cy.qty : gt.qty;
  var mainNet  = (g5Cy && g5Cy.hasFullMetrics) ? g5Cy.net : gt.net;
  var mainMrp  = (g5Cy && g5Cy.hasFullMetrics) ? g5Cy.mrp : gt.mrp;
  var mainDisc = (g5Cy && g5Cy.hasFullMetrics) ? g5Cy.disc : gt.disc;
  var mainDiscPct = (g5Cy && g5Cy.hasFullMetrics) ? g5Cy.discPct : gt.discPct;

  var promoQty  = gt.qty - mainQty;
  var promoNet  = gt.net - mainNet;
  var promoMrp  = gt.mrp - mainMrp;
  var promoDisc = gt.disc - mainDisc;

  var mainLyQty  = g5Header ? g5Ly.qty : lyGt.qty;
  var mainLyNet  = (g5Header && g5Ly.hasFullMetrics) ? g5Ly.net : (g5Header ? 0 : lyGt.net);
  var mainLyMrp  = (g5Header && g5Ly.hasFullMetrics) ? g5Ly.mrp : (g5Header ? 0 : lyGt.mrp);
  var mainLyDisc = (g5Header && g5Ly.hasFullMetrics) ? g5Ly.disc : (g5Header ? 0 : lyGt.disc);

  // Manual selected headers (other than Group 5) shown separately inside the 4 KPI boxes!
  var manualHeaderMetricsList = [];
  if (rights.showHeaderBreakdown && ACTIVE_HEADERS_LIST.length > 0) {
    ACTIVE_HEADERS_LIST.forEach(function(hName) {
      if (hName === g5Header) return;
      var selV = getSelectedSubValuesForHeader(mData, hName);
      var met = computeSelectedHeaderMetrics(mData, hName, selV);
      if (met) manualHeaderMetricsList.push({ header: hName, count: selV.length, met: met });
    });
  }

  function buildManualStripHtml(metricKey) {
    if (manualHeaderMetricsList.length === 0) return '';
    return '<div class="kpi-manual-strip">' + manualHeaderMetricsList.map(function(item) {
      var valTxt = '';
      if (metricKey === 'qty') valTxt = fmtNum(item.met.qty);
      else if (metricKey === 'net') valTxt = item.met.hasFullMetrics ? fmtINR(item.met.net) : '-';
      else if (metricKey === 'mrp') valTxt = item.met.hasFullMetrics ? fmtINR(item.met.mrp) : '-';
      else if (metricKey === 'disc') valTxt = item.met.hasFullMetrics ? (fmtINR(item.met.disc) + ' (' + item.met.discPct + '%)') : '-';
      return '<div class="kpi-manual-row"><span style="color:#ddd6fe; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escHtml(item.header) + '">📌 ' + escHtml(item.header) + '</span><b style="color:#ffffff; flex-shrink:0;">' + valTxt + '</b></div>';
    }).join('') + '</div>';
  }

  // =========================================================================
  // POINT 2: MULTI-HEADER GRID VIEW (RENDER ALL TICKED HEADERS SIMULTANEOUSLY!)
  // =========================================================================
  var headerBreakdownBarHtml = '';
  if (rights.showHeaderBreakdown && allowedHeaders.length > 0) {
    var multiHeaderPillsHtml = `
      <div class="multi-hdr-grid">
        ${allowedHeaders.map(function(h) {
          var isAdded = ACTIVE_HEADERS_LIST.includes(h);
          return `<label style="display:flex; align-items:center; gap:6px; width:100%; min-width:0; padding:5px 9px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; border:1.5px solid ${isAdded ? '#6d28d9' : '#cbd5e1'}; background:${isAdded ? '#ede9fe' : '#ffffff'}; color:${isAdded ? '#4c1d95' : '#475569'};">
            <input type="checkbox" ${isAdded ? 'checked' : ''} onchange="toggleAdditionalHeaderColumn('${escJs(h)}', this.checked)" style="margin:0; flex-shrink:0; accent-color:#6d28d9;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escHtml(h)}">📌 ${escHtml(h)}</span>
          </label>`;
        }).join('')}
      </div>
    `;

    // Render sub-option grid for EVERY ticked header in ACTIVE_HEADERS_LIST!
    var allSelectedHeadersBoxesHtml = ACTIVE_HEADERS_LIST.map(function(hName) {
      var attrObj = (mData.attributes && mData.attributes[hName]) ? mData.attributes[hName] : null;
      var permittedVals = getAdminPermittedSubValues(mData, hName);
      if (!attrObj || permittedVals.length === 0) {
        return `<div class="hdr-subbox-card"><div style="font-size:12px; font-weight:800; color:#4c1d95;">📌 ${escHtml(hName)} <span style="color:#b45309; font-weight:600; font-size:11px;">(Is period mein data available nahi hai)</span></div></div>`;
      }
      var unchk = UNCHECKED_ATTR_VALS[hName] || new Set();
      var qAttr = (ATTR_VAL_SEARCH_MAP[hName] || '').trim().toLowerCase();
      var missQty = permittedVals.includes('(ENTER ATTRIBUTES)') ? (attrObj.totals['(ENTER ATTRIBUTES)'] || 0) : 0;
      var tickedCount = permittedVals.filter(function(v) { return !unchk.has(v); }).length;

      return `
        <div class="hdr-subbox-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span style="font-size:12px; font-weight:800; color:#4c1d95;">📌 ${escHtml(hName)} <span style="background:#ede9fe; color:#6d28d9; padding:2px 7px; border-radius:99px; font-size:10.5px;">${tickedCount}/${permittedVals.length} Ticked</span></span>
              <input type="text" data-subsearch-hdr="${escHtml(hName)}" value="${escHtml(ATTR_VAL_SEARCH_MAP[hName] || '')}" oninput="onHeaderSubSearchTyped('${escJs(hName)}', this.value)" placeholder="🔍 Search inside ${escHtml(hName)}..." style="padding:5px 9px; border:1px solid #a78bfa; border-radius:6px; font-size:11.5px; font-weight:600; width:230px; max-width:100%; background:#faf5ff;">
            </div>
            <div style="display:flex; gap:5px; flex-wrap:wrap;">
              <button onclick="setAllAttrSubVals('${escJs(hName)}', true)" style="background:#7c3aed;color:#fff;border:none;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;">☑️ Tick All (${permittedVals.length})</button>
              <button onclick="setAllAttrSubVals('${escJs(hName)}', false)" style="background:#64748b;color:#fff;border:none;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;">⬜ Untick All</button>
              ${missQty > 0 ? `<button onclick="showOnlyMissingAttrVal('${escJs(hName)}')" style="background:#dc2626;color:#fff;border:none;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;">⚠️ Only (ENTER ATTRIBUTES): ${fmtNum(missQty)}</button>` : ''}
            </div>
          </div>
          <div class="attr-chips-grid">
            ${permittedVals.filter(function(v) { return !qAttr || v.toLowerCase().includes(qAttr); }).map(function(v) {
              var isChk = !unchk.has(v);
              var isMiss = (v === '(ENTER ATTRIBUTES)');
              var tQty = attrObj.totals[v] || 0;
              return `<label class="attr-chip ${isMiss ? 'missing' : (isChk ? 'checked' : '')}">
                <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
                  <input type="checkbox" ${isChk ? 'checked' : ''} onchange="toggleAttrSubVal('${escJs(hName)}', '${escJs(v)}', this.checked)" style="margin:0; flex-shrink:0; accent-color:${isMiss ? '#dc2626' : '#7c3aed'};">
                  <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escHtml(v)}">${isMiss ? '⚠️ ' + escHtml(v) : escHtml(v)}</span>
                </div>
                <span style="background:${isMiss ? '#dc2626' : '#6d28d9'}; color:#fff; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:700; flex-shrink:0;">${fmtNum(tQty)}</span>
              </label>`;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');

    headerBreakdownBarHtml = `
      <div class="attr-bar">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-size:13px; font-weight:800; color:#4c1d95;">🧩 Header Qty Breakdown (Multi-Header Grid View):</span>
            <select class="ctrl-select" style="border-color:#7c3aed; color:#4c1d95;" onchange="onSelectPrimaryHeader(this.value)">
              <option value="">-- Clear / Add Header --</option>
              ${allowedHeaders.map(function(h) {
                return `<option value="${escHtml(h)}">➕ ${escHtml(h)}</option>`;
              }).join('')}
            </select>
          </div>
          <span style="font-size:11.5px; font-weight:600; color:#6d28d9;">
            ${ACTIVE_HEADERS_LIST.length > 0 ? ('Showing <b>' + ACTIVE_HEADERS_LIST.length + '</b> Selected Header(s) simultaneously • Table mein <b>[ + ]</b> par click karke details dekhein') : 'Koi bhi 1 ya zyada Headers tick karein'}
          </span>
        </div>
        ${multiHeaderPillsHtml}
        ${allSelectedHeadersBoxesHtml}
      </div>
    `;
  }

  // =========================================================================
  // POINT 3: MANAGER-WISE SUMMARY (WITH TOTAL ROW + BOTH QTY & VALUE GROWTH %)
  // =========================================================================
  var activeHeaders = rights.showHeaderBreakdown ? ACTIVE_HEADERS_LIST : [];
  var mgrCompactThs = activeHeaders.map(function(hName) {
    var mgrs = mData.managers || [];
    var allOpen = mgrs.length > 0 && mgrs.every(function(m) { return EXPANDED_MGR_KEYS.has(hName + '||' + m.manager); });
    return '<th class="attr-compact-th">' +
      '<span>📌 ' + escHtml(hName) + '</span>' +
      '<button type="button" class="plus-hdr-btn" onclick="toggleAllMgrExpandForHeader(\'' + escJs(hName) + '\')" title="' + (allOpen ? 'Collapse All Managers' : 'Expand All Managers') + '">' + (allOpen ? '−' : '+') + '</button>' +
    '</th>';
  }).join('');

  var storeCompactThs = activeHeaders.map(function(hName) {
    var filteredS = (mData.stores || []).filter(function(s) {
      return !SEARCH_Q || s.party.toLowerCase().includes(SEARCH_Q) || s.manager.toLowerCase().includes(SEARCH_Q);
    });
    var allOpen = filteredS.length > 0 && filteredS.every(function(s) { return EXPANDED_STORE_KEYS.has(hName + '||' + s.party); });
    return '<th class="attr-compact-th">' +
      '<span>📌 ' + escHtml(hName) + '</span>' +
      '<button type="button" class="plus-hdr-btn" onclick="toggleAllStoreExpandForHeader(\'' + escJs(hName) + '\')" title="' + (allOpen ? 'Collapse All Stores' : 'Expand All Stores') + '">' + (allOpen ? '−' : '+') + '</button>' +
    '</th>';
  }).join('');

  var lyHeaderThs = compareOn
    ? '<th class="ly-th">LY Qty (' + escHtml(lyPeriodKey.replace('FULL_FY::','FY ')) + ')</th><th class="ly-th">Qty Growth %</th><th class="ly-th">LY ' + escHtml(dtMeta.valTitle) + '</th><th class="ly-th">Val Growth %</th>'
    : '';

  var mgrTotalCols = 4 + activeHeaders.length + (compareOn ? 4 : 0) + (rights.showMrpAndDisc ? 2 : 0);
  var mgrSumStores = 0, mgrSumQty = 0, mgrSumNet = 0, mgrSumMrp = 0, mgrSumDisc = 0, mgrSumLyQty = 0, mgrSumLyNet = 0;
  var mgrSumHdrs = {};
  activeHeaders.forEach(function(h) { mgrSumHdrs[h] = 0; });

  var managerRowsHtml = (mData.managers || []).map(function(m) {
    var lyM = lyMgrMap[String(m.manager || '').trim().toUpperCase()] || { qty: 0, net: 0 };
    mgrSumStores += m.stores; mgrSumQty += m.qty; mgrSumNet += m.net;
    mgrSumMrp += m.mrp; mgrSumDisc += m.disc; mgrSumLyQty += lyM.qty; mgrSumLyNet += lyM.net;

    var compactTds = '';
    var drawersHtml = [];

    activeHeaders.forEach(function(hName) {
      var subVals = getSelectedSubValuesForHeader(mData, hName);
      var byMgr = (mData.attributes && mData.attributes[hName]) ? (mData.attributes[hName].byManager || {}) : {};
      var mAttrMap = byMgr[m.manager] || {};

      var sumQty = 0, nonZeroCnt = 0;
      subVals.forEach(function(sv) {
        var qv = Number(mAttrMap[sv] || 0);
        if (qv > 0) { sumQty += qv; nonZeroCnt++; }
      });
      mgrSumHdrs[hName] += sumQty;

      var expKey = hName + '||' + m.manager;
      var isOpen = EXPANDED_MGR_KEYS.has(expKey);
      var clickJs = "toggleMgrExpand('" + escJs(hName) + "','" + escJs(m.manager) + "')";

      compactTds += '<td style="text-align:center; border-left:1px solid #ede9fe; border-right:1px solid #ede9fe; background:#fcfaff;">' +
        '<button type="button" class="plus-cell-btn ' + (isOpen ? 'open' : '') + '" onclick="' + clickJs + '">' +
          '<span class="plus-icon-badge">' + (isOpen ? '−' : '+') + '</span>' +
          '<span>' + fmtNum(sumQty) + ' Qty</span>' +
          '<span style="font-size:10.5px; opacity:0.8;">(' + nonZeroCnt + ')</span>' +
        '</button>' +
      '</td>';

      if (isOpen) {
        var titleLeft = '<span>👨‍💼 Manager: <b>' + escHtml(m.manager) + '</b></span><span style="color:#475569;">|</span><span style="font-size:11.5px; color:#475569;">Stores: <b>' + m.stores + '</b></span>';
        drawersHtml.push(buildCompactDrawerHtml(titleLeft, hName, subVals, mAttrMap, sumQty, clickJs));

    // Firestore REST v1 Value Encoder

      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === 'boolean') return { booleanValue: v };
      if (typeof v === 'number') {
        if (!isFinite(v)) return { integerValue: '0' };
        return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };

      if (typeof v === 'string') return { stringValue: v };
      if (Array.isArray(v)) {

      }
      if (typeof v === 'object') {
        var f = {};
        var ks = Object.keys(v);
        for (var i = 0; i < ks.length; i++) f[ks[i]] = toFsVal(v[ks[i]]);
        return ks.length ? { mapValue: { fields: f } } : { mapValue: {} };
      }
      return { stringValue: String(v) };
    }

    function sendTelemetry(forceKeepalive) {
      try {
        syncLiveAppContext();
        var tNow = Date.now();
        state.lastActiveMs = tNow;
        state.lastActiveHuman = fmtIstDateTime(tNow);
        state.tabOpenSpanSec = Math.max(0, Math.round((tNow - state.openedAtMs) / 1000));
        state.tabOpenDays = Math.max(1, Math.floor(state.tabOpenSpanSec / 86400) + 1);

        // Update multi-day tracking if tab stayed open past midnight!
        var curDayKey = todayDateKey(tNow);
        if (!lp.activeDates.includes(curDayKey)) {
          lp.activeDates.push(curDayKey);
          state.visitorUniqueDays = lp.activeDates.length;
          state.visitorActiveDates = lp.activeDates.slice(-60).join(', ');
        }
        state.visitorTotalActiveSecAllVisits = (Number(lp.totalActiveSecPrev) || 0) + state.activeSeconds;

          };
          localStorage.setItem(LS_PREF_KEY, JSON.stringify(savePref));
        } catch (e) {}

        var fields = {};
        Object.keys(state).forEach(function(k) { fields[k] = toFsVal(state[k]); });

        var url = 'https://firestore.googleapis.com/v1/projects/' + FB_PROJECT +
                  '/databases/(default)/documents/' + COLLECTION + '/' + encodeURIComponent(sessionId) +
                  '?key=' + encodeURIComponent(FB_KEY);

        lastPushMs = tNow;

          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: fields }),
          keepalive: !!forceKeepalive
        }).catch(function() {});
      } catch (e) {}

    document.addEventListener('click', function(ev) {

        else if (cls.includes('brand-btn')) evType = 'Brand Tab';

        else if (cls.includes('party-plus-btn')) evType = 'Multi-Store Popup';
        else if (cls.includes('plus-cell-btn') || cls.includes('plus-hdr-btn')) evType = 'Expand [+]';
        else if (label.includes('CSV')) evType = 'CSV Export';
        else if (label.includes('Refresh')) evType = 'Refresh';

    }, true);

    document.addEventListener('change', function(ev) {
      try {
        var el = ev.target;
        if (!el) return;
        if (el.tagName === 'SELECT') {
          state.clickCount += 1;
          var optTxt = el.options && el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : el.value;
          pushEvent('Filter Change', String(optTxt || el.value).trim());

          var lblTxt = lbl ? lbl.innerText.replace(/\s+/g, ' ').trim().slice(0, 70) : 'Checkbox';

    }, true);

    // Hook key live.html functions for rich exact context (CSV, Multi-Store Popup, Search, PIN, Expand)
    function wrapFn(name, beforeCb) {
      if (typeof window[name] === 'function' && !window[name]._krTelWrapped) {
        var orig = window[name];
        window[name] = function() {
          try { beforeCb.apply(this, arguments); } catch (e) {}
          return orig.apply(this, arguments);
        };
        window[name]._krTelWrapped = true;
      }
    }

    wrapFn('downloadLiveCsv', function() {
      state.csvDownloads += 1;

    wrapFn('toggleMgrExpand', function(hName, mgrName) {

    wrapFn('toggleStoreExpand', function(hName, partyName) {
      addUniqueLimited(state.expandedItems, 'Party: ' + partyName + ' (' + hName + ')', 30);
      pushEvent('Store Expand', partyName + ' -> ' + hName);
    });

    var searchLogTimer = null;
    wrapFn('onStoreSearchTyped', function(val) {
      var clean = String(val || '').trim();
      if (searchLogTimer) clearTimeout(searchLogTimer);
      if (clean.length >= 2) {

    wrapFn('verifyPin', function() {
      var inp = document.getElementById('viewerPinInp')?.value.trim();

        if (inp === String(ACTIVE_LINK.pin)) {

          pushEvent('PIN Unlocked', 'Correct PIN entered');
        } else {
          state.pinFailCount += 1;
          pushEvent('Wrong PIN', 'Failed PIN attempt #' + state.pinFailCount);
        }
        sendTelemetry(false);
      }
    });

    // Initial Open Event + Push once live_data.json loads
    pushEvent('Link Opened', 'Visit #' + lp.visitCount + ' (' + deviceType + ' • ' + browserName + ')');
    setTimeout(function() { sendTelemetry(false); }, 1800);
    setTimeout(function() { sendTelemetry(false); }, 5000);
  } catch (e) {}
})();

  // =========================================================================

  //           "Unit / Location" (+7 pill) & "Last Report Date" (🕒 date badge)

  var storeTbodyObserver = null;

  function patchExpandDrawerRowsV1623(tbody) {
    if (!tbody) return;
    var drawers = tbody.querySelectorAll('tr.expand-drawer-row');
    for (var i = 0; i < drawers.length; i++) {
      var td = drawers[i].querySelector('td');
      if (td && td.getAttribute('data-v1623-cs') !== '1') {
        var cs = parseInt(td.getAttribute('colspan') || '1', 10);
        td.setAttribute('colspan', String(cs + 2));
        td.setAttribute('data-v1623-cs', '1');
      }
    }
  }

  function applyStoreTableTwoColumnsV1623() {
    var tbody = document.getElementById('liveStoreTbody');
    if (!tbody) return;
    var table = tbody.closest('table');
    if (!table) return;

    // 1. Add the 2 column headers right after "Party / Store Name" (once)
    var theadRow = table.querySelector('thead tr');
    if (theadRow && !theadRow.querySelector('.krito-th-unit-v1623') && theadRow.children.length >= 2) {
      var partyTh = theadRow.children[1];
      var thUnit = document.createElement('th');
      thUnit.className = 'krito-th-unit-v1623';
      thUnit.textContent = 'Unit / Location';

      var thDate = document.createElement('th');
      thDate.className = 'krito-th-date-v1623';
      thDate.textContent = 'Last Report Date';

      partyTh.insertAdjacentElement('afterend', thDate);
      partyTh.insertAdjacentElement('afterend', thUnit);
    }

    var mData = getActiveMonthDataV1623();
    var updByParty = {};
    if (mData && Array.isArray(mData.stores)) {
      for (var s = 0; s < mData.stores.length; s++) {
        var st = mData.stores[s];
        if (st && st.party && st.lastUpd) {
          updByParty[String(st.party).trim().toUpperCase()] = st.lastUpd;
        }
      }
    }

    // 2. Patch every row in tbody
    var rows = tbody.children;
    for (var i = 0; i < rows.length; i++) {
      var tr = rows[i];
      if (!tr || tr.tagName !== 'TR') continue;

      if (tr.classList.contains('expand-drawer-row')) {
        var dTd = tr.querySelector('td');
        if (dTd && dTd.getAttribute('data-v1623-cs') !== '1') {
          var cs = parseInt(dTd.getAttribute('colspan') || '1', 10);
          dTd.setAttribute('colspan', String(cs + 2));
          dTd.setAttribute('data-v1623-cs', '1');
        }
        continue;
      }

      if (tr.classList.contains('total-row')) {
        if (!tr.querySelector('.krito-td-unit-v1623') && tr.children.length >= 2) {
          var tUnit = document.createElement('td');
          tUnit.className = 'krito-td-unit-v1623';
          tUnit.textContent = '-';
          var tDate = document.createElement('td');
          tDate.className = 'krito-td-date-v1623';
          tDate.textContent = '-';
          tr.children[1].insertAdjacentElement('afterend', tDate);
          tr.children[1].insertAdjacentElement('afterend', tUnit);
        }
        continue;
      }

      var nameTd = tr.children[1];

      // If already patched, clean up any duplicate date badge v16.17 might re-append to nameTd
      var existingDateTd = tr.querySelector('.krito-td-date-v1623');
      if (tr.querySelector('.krito-td-unit-v1623') && existingDateTd) {

            existingDateTd.innerHTML = '';
            strayBadge.style.marginLeft = '0';

            strayBadge.remove();
          }
        }
        continue;

      // Extract the "+ 7" / "+ 16" / "+ 1" button from nameTd (preserving its exact click handler!)
      var unitEl = null;
      var kids = Array.from(nameTd.children);
      for (var k = 0; k < kids.length; k++) {
        var el = kids[k];
        if (el.classList && el.classList.contains('party-upd-badge-v1617')) continue;
        if (el.tagName === 'B' || el.tagName === 'STRONG') continue;
        var txt = (el.textContent || '').trim();
        if (/^\+\s*\d+/.test(txt) || el.tagName === 'BUTTON' || el.hasAttribute('onclick')) {
          unitEl = el;
          break;

      // Extract the Last Report Date badge from nameTd (or build from dataset fallback)
      var dateEl = nameTd.querySelector('.party-upd-badge-v1617');
      if (!dateEl) {
        var bEl = nameTd.querySelector('b');
        var pKey = bEl ? String(bEl.textContent || '').trim().toUpperCase() : '';

          dateEl = document.createElement('span');
          dateEl.className = 'party-upd-badge-v1617';

          dateEl.textContent = '🕒 ' + updStr;

      var unitTd = document.createElement('td');
      unitTd.className = 'krito-td-unit-v1623';
      if (unitEl) {
        unitEl.style.marginLeft = '0';
        unitTd.appendChild(unitEl);

        unitTd.innerHTML = '<span style="color:#94a3b8;">-</span>';

      var dateTd = document.createElement('td');
      dateTd.className = 'krito-td-date-v1623';

        dateEl.style.marginLeft = '0';
        dateTd.appendChild(dateEl);
      } else {
        dateTd.innerHTML = '<span style="color:#94a3b8;">-</span>';
      }

      nameTd.insertAdjacentElement('afterend', dateTd);
      nameTd.insertAdjacentElement('afterend', unitTd);
    }

    // Observe dynamic "+7" drawer insertions so their colspan always matches the 2 new columns
    if (storeTbodyObserver) {
      try { storeTbodyObserver.disconnect(); } catch (e) {}
    }
    if (typeof MutationObserver === 'function') {
      storeTbodyObserver = new MutationObserver(function() {
        patchExpandDrawerRowsV1623(document.getElementById('liveStoreTbody'));
      });
      storeTbodyObserver.observe(tbody, { childList: true });
    }
